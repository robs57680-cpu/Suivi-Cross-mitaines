<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D8321A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Box Score">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Box Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a gym whiteboard column. Barbell wordmark on top, scoreboard panel for stats, weight plates as ranks and trophies.
   Light = concrete floor, dark = rubber floor. Anton for headings and numerals, Work Sans for text, Plex Mono for scores. */
:root{
  --bg:#E2E4E6; --surface:#FFFFFF; --surface2:#F0F1F2; --ink:#0D0F12; --muted:#58606A; --line:#C3C8CD; --edge:#0D0F12;
  --accent:#D8321A; --accent-ink:#FFFFFF; --tint:#FCE4DF;
  --panel:#0D0F12; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
  --ok:#17803F; --danger:#B3261E;
  --plate-red:#D92B1F; --plate-blue:#1F55D6; --plate-yellow:#F4C400; --plate-green:#1E9B4A; --plate-black:#1B1D20; --plate-white:#F3F3F1;
  --f-display:'Anton','Impact','Arial Narrow',sans-serif;
  --f-body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C0E; --surface:#16181B; --surface2:#1E2125; --ink:#F2F2EF; --muted:#9BA2A9; --line:#2B2F34; --edge:#3A3F45;
    --accent:#FF4B27; --accent-ink:#1A0A06; --tint:#2A1B18;
    --panel:#1D2024; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
    --ok:#5CCB92; --danger:#FF8A80; --plate-black:#2A2D31;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --surface:#16181B; --surface2:#1E2125; --ink:#F2F2EF; --muted:#9BA2A9; --line:#2B2F34; --edge:#3A3F45;
  --accent:#FF4B27; --accent-ink:#1A0A06; --tint:#2A1B18;
  --panel:#1D2024; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
  --ok:#5CCB92; --danger:#FF8A80; --plate-black:#2A2D31;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.shell{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px;min-width:0}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;border-bottom:2px solid var(--edge);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:26px;letter-spacing:.06em;line-height:1}
.bb{width:58px;height:20px;color:var(--ink);flex:none}
.bb .pl{fill:var(--accent)}
.bb rect{fill:currentColor}
.bb .pl{fill:var(--accent)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day{font-family:var(--f-display);font-weight:400;font-size:46px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.wtitle{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;text-transform:uppercase;text-wrap:balance}
.h2{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.h2::after{content:"";flex:1;height:2px;background:var(--edge);opacity:.25}

/* blocs */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:4px;padding:16px;display:grid;gap:12px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--edge);border-radius:2px;padding:1px 8px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:transparent;white-space:nowrap}
.chip.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.done{color:var(--muted);border-color:var(--line)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip.load{background:var(--tint);border-color:transparent;color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px}
.chip.miss{border-style:dashed;border-color:var(--line);color:var(--muted);text-transform:none;letter-spacing:0}
.btn{border:2px solid var(--edge);background:transparent;border-radius:4px;padding:10px 16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:12px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.field{display:grid;gap:4px;min-width:0}
.flabel{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;background:var(--surface2);border:2px solid var(--line);border-radius:4px;padding:10px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.link{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font-weight:600}

/* séance, façon tableau blanc de la box */
.part{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:14px;background:var(--surface);border:2px solid var(--edge);border-radius:4px}
.plabel{font-family:var(--f-display);font-size:28px;line-height:1;display:grid;place-items:center;height:48px;background:var(--ink);color:var(--bg);border-radius:2px}
.plabel.sm{height:34px;width:48px;font-size:20px}
.metcon{border-color:var(--accent)}
.metcon .plabel,.plabel.on{background:var(--accent);color:var(--accent-ink)}
.pbody{display:grid;gap:8px;min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.phead h3{font-weight:700;font-size:17px}
.fmt{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.line{overflow-wrap:anywhere}
.lines{display:grid;gap:6px}
.tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tier{font-family:var(--f-mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;padding:2px 8px}

/* disques */
.plate{--pc:var(--plate-black);--pi:#FFFFFF;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--pi);
  background:radial-gradient(circle,transparent 0 44%,rgba(0,0,0,.32) 45% 48%,transparent 49% 100%),var(--pc);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),inset 0 0 0 4px rgba(0,0,0,.28)}
.plate svg{width:26px;height:26px}
.t-goat{--pc:var(--plate-red)}
.t-regulier{--pc:var(--plate-green)}
.t-serie{--pc:var(--plate-blue)}
.t-perf{--pc:var(--plate-yellow);--pi:#14161A}
.t-fort{--pc:var(--plate-black)}
.t-cardio{--pc:var(--plate-white);--pi:#14161A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.08)}
.plate.off{filter:grayscale(1);opacity:.3}

/* classement */
.lb{list-style:none;margin:0;padding:0;border:2px solid var(--edge);border-radius:4px;background:var(--surface);overflow:hidden}
.lb li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb li.me{background:var(--tint)}
.rank{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;line-height:1;border:2px solid var(--line);color:var(--muted)}
.rank.r1,.rank.r2,.rank.r3{border-color:transparent;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),inset 0 0 0 4px rgba(0,0,0,.25);color:#FFFFFF}
.rank.r1{background:var(--plate-red)}
.rank.r2{background:var(--plate-blue)}
.rank.r3{background:var(--plate-yellow);color:#14161A}
.nm{font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.pts{font-family:var(--f-display);font-size:30px;line-height:1;text-align:right}
.pts small{display:block;font-family:var(--f-mono);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}

/* trophées */
.trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.trophy{background:var(--surface);border:2px solid var(--edge);border-radius:4px;padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.trophy .tn{font-family:var(--f-display);font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.trophy .td{font-size:12px;color:var(--muted)}
.trophy .tw{font-weight:700;overflow-wrap:anywhere;margin-top:6px}
.trophy.mine{background:var(--tint)}

/* tableau de score du profil */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));background:var(--panel);color:var(--panel-ink);border-radius:4px}
.stat{padding:14px 14px 12px;border-right:1px solid rgba(255,255,255,.14);min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1}
.stat:first-child b{color:var(--panel-accent)}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--panel-muted)}
.tally-row{display:grid;gap:6px;padding:12px 14px;border:2px solid var(--edge);border-radius:4px;background:var(--surface)}
.tally{display:flex;flex-wrap:wrap;gap:6px;color:var(--ink)}
.tally svg{display:block;height:26px;width:auto}

.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.list li:last-child{border-bottom:0}
.list .l{min-width:0;overflow-wrap:anywhere}
.pr{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr-top{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center}
.pct{display:flex;flex-wrap:wrap;gap:6px}
.pct span{font-family:var(--f-mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;padding:2px 6px}
.pedit{border:2px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:10px;background:var(--surface2)}
.pedit-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pedit-head select{width:auto;flex:1;min-width:120px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.banner{border:2px solid var(--edge);background:var(--surface);border-radius:4px;padding:14px;display:grid;gap:10px;margin-bottom:16px}
.banner.warn{border-color:var(--accent)}
.preview{font-family:var(--f-mono);font-size:14px;font-weight:600}
.empty{border:2px dashed var(--line);border-radius:4px;padding:20px;display:grid;gap:10px;color:var(--muted)}

/* navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;border-top:5px solid transparent;margin-top:-2px;padding:12px 4px 10px;font-family:var(--f-display);font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;z-index:20;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:4px;padding:10px 14px;font-weight:700;max-width:100%}
.toast.bad{background:var(--danger);color:#fff}
@media (max-width:420px){.day{font-size:38px}.pr-top{grid-template-columns:minmax(0,1fr) 90px}.pr-top .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .08s}.btn:active{transform:scale(.98)}}

/* ajouts : saisons, niveaux, objectif */
.brand span{white-space:nowrap}
.tab{font-size:clamp(13px,4.2vw,17px);letter-spacing:.03em;min-width:0;padding-inline:2px;white-space:nowrap}
.ttop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ttop .tn{flex:1;min-width:0}
.stamp{flex:none;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--accent);color:var(--accent);padding:1px 6px;border-radius:2px;transform:rotate(-4deg);white-space:nowrap}
.t-mcardio{--pc:#F07A18}
.t-mgym{--pc:#8B929A;--pi:#14161A}
.t-mhaltero{--pc:var(--plate-white);--pi:#14161A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.08)}
.t-objectif{--pc:#7B3FC4}
.levels{display:grid;gap:8px}
.lvl{border:1.5px solid var(--line);border-radius:4px;padding:10px;display:grid;gap:6px;background:var(--surface2)}
.lvl-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.lvl-load{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--accent)}
.lvl-edit{border:2px solid var(--line);border-radius:4px;padding:10px;display:grid;gap:10px;background:var(--surface)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg .btn{padding:8px 2px;font-size:11px;letter-spacing:0}
.seg .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip.lv{margin-left:8px;background:var(--tint);border-color:transparent;color:var(--ink);vertical-align:middle;text-transform:none;letter-spacing:0;font-size:12px}
.t-points{--pc:#0E8A8A}
.mv{background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;text-decoration:underline dotted var(--accent);text-underline-offset:3px;cursor:pointer;text-align:left}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:grid;align-items:end;justify-items:center}
.sheet{background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:4px 4px 0 0;width:100%;max-width:720px;max-height:85vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet ul{margin:4px 0 0;padding-left:20px;display:grid;gap:4px}
.gok{color:var(--ok)}.gno{color:var(--danger)}
.pts.vsm{font-family:var(--f-mono);font-size:13px;font-weight:600;max-width:130px}

</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><svg class="bb" viewBox="0 0 72 24" aria-hidden="true"><rect x="0" y="11" width="72" height="2"/><rect class="pl" x="12" y="1" width="6" height="22" rx="1"/><rect x="19" y="5" width="4" height="14" rx="1"/><rect x="25" y="9" width="2" height="6"/><rect x="45" y="9" width="2" height="6"/><rect x="49" y="5" width="4" height="14" rx="1"/><rect class="pl" x="54" y="1" width="6" height="22" rx="1"/></svg><span>BOX SCORE</span></div><div id="hdr-right"></div></header>
  <main id="main" class="stack"></main>
</div>
<nav class="tabs" aria-label="Navigation"><div class="in" id="tabs"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,setDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

let auth=null;
/* Petite couche qui expose Firestore sous la forme utilisée par l'appli */
function makeDb(fdb){
  const wrapDoc=r=>({id:r.id,set:d=>setDoc(r,d),delete:()=>deleteDoc(r),
    onSnapshot:(n,e)=>onSnapshot(r,s=>n({exists:s.exists(),data:()=>s.data()}),e)});
  return {
    doc:p=>wrapDoc(doc(fdb,p)),
    collection:p=>({
      onSnapshot:(n,e)=>onSnapshot(collection(fdb,p),s=>n({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e),
      doc:id=>wrapDoc(id?doc(fdb,p+'/'+id):doc(collection(fdb,p)))
    })
  };
}

(function(){
'use strict';
const APP_VERSION='2026-10-03.5';

/* ---------- utilitaires ---------- */
const $=(s)=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dparse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const dfmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>dfmt(new Date());
const addDays=(s,n)=>{const d=dparse(s);d.setDate(d.getDate()+n);return dfmt(d);};
const mondayOf=s=>{const d=dparse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return dfmt(d);};
const fmtDate=(s,o)=>dparse(s).toLocaleDateString('fr-FR',o||{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>fmtDate(s,{day:'numeric',month:'short'});
const fmtN=n=>String(Math.round(n*10)/10).replace('.',',');
const fmtKg=n=>String(Math.round(n*2)/2).replace('.',',')+' kg';
const fmtTime=sec=>Math.floor(sec/60)+':'+pad(Math.round(sec%60));
function parseTime(s){const m=String(s).trim().match(/^(\d{1,3})\s*[:'’mM.]\s*(\d{1,2})\s*s?$/);if(!m)return null;const sec=+m[2];if(sec>59)return null;return +m[1]*60+sec;}
function parseNum(s){const v=parseFloat(String(s).replace(',','.').replace('−','-'));return isNaN(v)?null:v;}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);let val;
  if(attrs)for(const [k,v] of Object.entries(attrs)){
    if(v===undefined||v===null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='value')val=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){if(c===null||c===undefined||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}
  if(val!==undefined)el.value=val;
  return el;
}

const plist=()=>Object.entries(S.periods).map(([id,p])=>Object.assign({id},p)).sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
const inP=(d,p)=>p.start<=d&&d<=p.end;
function activePeriod(){const l=plist();if(!l.length)return ALL;const t=todayStr();const cur=l.filter(p=>inP(t,p));if(cur.length)return cur[cur.length-1];const past=l.filter(p=>p.end<t);return past.length?past[past.length-1]:l[0];}
function selPeriod(){const l=plist();if(!l.length)return ALL;return l.find(p=>p.id===S.periodId)||activePeriod();}
function periodFor(date){const l=plist();if(!l.length)return ALL;const m=l.filter(p=>inP(date,p));return m.length?m[m.length-1]:null;}
function periodState(p){if(p.virtual)return 'live';const t=todayStr();return t<p.start?'soon':t>p.end?'done':'live';}
const seasonNum=p=>p.virtual?1:((p.num!==undefined&&p.num!==null&&p.num!=='')?Number(p.num):(plist().findIndex(x=>x.id===p.id)+1));
const seasonLabel=p=>'Saison '+seasonNum(p);
const metconOf=w=>(w.parts||[]).find(p=>p.kind==='metcon');
const levelsOf=m=>(m&&m.levels&&m.levels.length)?m.levels:[{name:'',tiers:(m&&m.tiers)||[]}];
const activeLevels=m=>levelsOf(m).map((lv,i)=>[lv,i]).filter(x=>!x[0].off);
const okLvl=(m,l)=>{const a=activeLevels(m);if(!a.length||a.some(x=>x[1]===l))return l;return a.reduce((b,x)=>Math.abs(x[1]-l)<Math.abs(b-l)?x[1]:b,a[0][1]);};
const LEVEL_DIV=2; /* multiplicateur du GOAT = niveau moyen / 2 (niveau 2,66 = x1,33) */
const levelName=(m,i)=>{const lv=levelsOf(m)[i||0];return (lv&&lv.name)||('Niveau '+((i||0)+1));};
function perfPoints(m,score,lvl){
  if(!m||score===undefined||score===null||isNaN(score))return 0;
  const lv=levelsOf(m)[lvl||0]||levelsOf(m)[0];let best=0;
  for(const t of (lv&&lv.tiers)||[]){const ok=m.format==='FT'?score<=t.t:score>=t.t;if(ok&&t.p>best)best=t.p;}
  return best;
}
function basePts(w,period){return (w.base!==undefined&&w.base!==null)?Number(w.base):((period&&period.base!==undefined)?Number(period.base):10);}
function wodPoints(w,e,period){
  const base=basePts(w,period);
  const m=metconOf(w);const perf=m&&e?perfPoints(m,e.score,e.level||0):0;
  return {base,perf,total:base+perf};
}
function scoreText(m,score){if(score===undefined||score===null)return '';return m.format==='FT'?fmtTime(score):fmtN(score)+' tours';}

function computeBoard(period){
  const wods=Object.values(S.wods).filter(w=>inP(w.date,period)).sort((a,b)=>a.date<b.date?-1:1);
  const metconCount=wods.filter(metconOf).length;
  const catCount={cardio:0,gym:0,haltero:0};
  for(const w of wods){const m=metconOf(w);if(m&&catCount[m.focus]!==undefined)catCount[m.focus]++;}
  const weeks={};
  for(const w of wods){const k=mondayOf(w.date);(weeks[k]=weeks[k]||[]).push(w.date);}
  const t=todayStr(),done=periodState(period)==='done';
  const weekKeys=Object.keys(weeks).filter(k=>done||addDays(k,6)<t).sort();
  const rows=Object.entries(S.logs).map(([uid,lg])=>{
    const r={uid,pseudo:lg.pseudo||'Athlète',sessions:0,base:0,perf:0,perfN:0,strength:0,streak:0,lvlSum:0,lvlN:0,items:[],
      cat:{cardio:{sum:0,n:0},gym:{sum:0,n:0},haltero:{sum:0,n:0}}};
    const best={};let run=0;
    for(const w of wods){
      const e=lg.entries&&lg.entries[w.date];
      if(!e){run=0;continue;}
      run++;r.streak=Math.max(r.streak,run);r.sessions++;
      const pts=wodPoints(w,e,period);r.base+=pts.base;r.perf+=pts.perf;
      const m=metconOf(w);
      if(m&&e.level!==undefined){r.lvlSum+=e.level+1;r.lvlN++;}
      if(m&&e.score!==undefined&&e.score!==null){r.perfN++;const c=r.cat[m.focus];if(c){c.sum+=pts.perf;c.n++;}}
      for(const p of w.parts||[]){
        if(p.kind==='force'&&p.movement&&e.loads&&e.loads[p.label]>0){const k=norm(p.movement.trim());best[k]=Math.max(best[k]||0,e.loads[p.label]);}
      }
      r.items.push({w,e,pts});
    }
    r.redo=0;r.redoN=0;
    const redoWk=k=>Object.values(lg.redos||{}).filter(x=>x.on>=k&&x.on<=addDays(k,6)).length;
    for(const [wd,x] of Object.entries(lg.redos||{})){
      const rw=S.wods[wd],rm=rw&&metconOf(rw);
      if(!rm||!(lg.entries&&lg.entries[wd])||!inP(x.on,period))continue;
      const rp=perfPoints(rm,x.score,x.level||0)/2;
      r.redo+=rp;r.redoN++;
      r.items.push({w:rw,e:{score:x.score,level:x.level},pts:{base:0,perf:rp,total:rp},redo:true,on:x.on});
    }
    r.items.sort((a,b)=>(a.redo?a.on:a.w.date)<(b.redo?b.on:b.w.date)?-1:1);
    r.total=r.base+r.perf+r.redo;
    r.strength=Object.values(best).reduce((a,b)=>a+b,0);
    r.perfAvg=r.perfN?r.perf/r.perfN:0;
    r.lvlAvg=r.lvlN?r.lvlSum/r.lvlN:0;
    r.mult=r.lvlN?r.lvlAvg/LEVEL_DIV:1;
    r.weighted=Math.round(r.total*r.mult*10)/10;
    const goal=lg.goals?Number(lg.goals[period.id]):0;
    r.goal=goal>0?goal:0;
    r.goalMet=r.goal>0&&weekKeys.length>0&&weekKeys.every(k=>weeks[k].filter(d=>lg.entries&&lg.entries[d]).length+redoWk(k)>=Math.min(r.goal,weeks[k].length));
    return r;
  });
  rows.sort((a,b)=>b.total-a.total||b.sessions-a.sessions||a.pseudo.localeCompare(b.pseudo));
  return {rows,wods,metconCount,catCount,weekKeys,period};
}

function winners(t,board){
  if(t.custom)return t.custom(board).filter(r=>r.sessions>0);
  const pool=board.rows.filter(r=>r.sessions>0&&(!t.elig||t.elig(r,board))&&t.key(r)[0]>0);
  if(!pool.length)return [];
  pool.sort((a,b)=>cmpKey(t.key(b),t.key(a)));
  const top=t.key(pool[0]);
  return pool.filter(r=>cmpKey(t.key(r),top)===0);
}

/* ---------- pourcentages et PR (parties force) ---------- */
function prFor(name){const e=S.prof.prs||{};for(const k of Object.keys(e)){if(norm(k)===norm(name))return e[k];}return null;}
function findMove(text){
  const t=norm(text);const list=[];
  for(const [c,al] of MOVES)for(const a of al)list.push([c,a]);
  for(const k of Object.keys(S.prof.prs||{}))list.push([k,norm(k)]);
  list.sort((x,y)=>y[1].length-x[1].length);
  for(const [c,a] of list){
    const re=new RegExp('(^|[^a-z0-9])'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])');
    if(re.test(t))return c;
  }
  return null;
}
function renderLine(text){
  const line=h('div',{class:'line'},h('span',{},glossSegs(text)));
  const m=text.match(PCT_RE);
  if(m){
    const nums=m[1].split(/\s*[\/–-]\s*/).map(Number).filter(n=>n>0&&n<=200);
    const canon=findMove(text);
    if(canon&&nums.length){
      const pr=prFor(canon);
      if(!(pr&&pr.kg<=0))line.append(pr?h('div',{class:'chips'},nums.map(n=>h('span',{class:'chip load'},n+' % = '+fmtKg(pr.kg*n/100))))
                    :h('div',{class:'chips'},h('span',{class:'chip miss'},'Renseigne ton PR de '+canon+' dans ton profil')));
    }
  }
  return line;
}
const plainLine=text=>h('div',{class:'line'},glossSegs(text));
function glossSegs(text){
  const t=norm(text);
  if(t.length!==text.length)return [text];
  const hits=[];
  for(const [al,gi] of GLOSS_AL){
    for(let i=t.indexOf(al);i>=0;i=t.indexOf(al,i+1)){
      const e=i+al.length;
      if((i===0||!/[a-z0-9]/.test(t[i-1]))&&(e>=t.length||!/[a-z0-9]/.test(t[e]))&&!hits.some(x=>i<x.e&&e>x.s))hits.push({s:i,e,g:gi});
    }
  }
  hits.sort((a,b)=>a.s-b.s);
  const out=[];let c=0;
  for(const x of hits){
    if(x.s>c)out.push(text.slice(c,x.s));
    out.push(h('button',{type:'button',class:'mv',onclick:()=>openGloss(x.g)},text.slice(x.s,x.e)));
    c=x.e;
  }
  if(c<text.length)out.push(text.slice(c));
  return out;
}
function openGloss(gi){
  const g=GLOSS[gi];if(!g)return;
  const old=document.getElementById('gloss-ov');if(old)old.remove();
  const esc=e=>{if(e.key==='Escape')close();};
  const close=()=>{ov.remove();document.removeEventListener('keydown',esc);};
  const ov=h('div',{class:'ov',id:'gloss-ov',onclick:e=>{if(e.target===ov)close();}},
    h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':g[0]},
      h('div',{},h('p',{class:'eyebrow'},'Mouvement'),h('h2',{class:'wtitle'},g[0])),

      h('div',{},h('div',{class:'flabel gno'},'No rep'),h('ul',{},g[4].map(x=>h('li',{},x)))),
      h('p',{class:'hint'},'Standards habituels. Ton coach peut les préciser pour la séance.'),
      h('button',{class:'btn primary',id:'gloss-close',type:'button',onclick:close},'Fermer')));

}

let lastCheck=0;
async function checkVersion(){
  if(!/^https?:$/.test(location.protocol))return;
  if(Date.now()-lastCheck<60000)return;
  lastCheck=Date.now();
  try{
    const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const m=(await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(m&&m[1]!==APP_VERSION&&S.newVersion!==m[1]){S.newVersion=m[1];scheduleRender();}
  }catch(e){}
}
async function applyUpdate(){
  try{
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.unregister()));}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
  }catch(e){}
  location.replace(location.pathname+'?v='+encodeURIComponent(S.newVersion||Date.now()));
}

const blankTiers=()=>[{t:'',p:''},{t:'',p:''},{t:'',p:''}];

function wodToDraft(w){
  return {date:w.date,title:w.title||'',base:(w.base!==undefined&&w.base!==null)?String(w.base):'',
    parts:(w.parts||[]).map(p=>{
      const fmt=p.format||'FT';
      const lv=(p.kind==='metcon'?levelsOf(p):blankLevels()).slice(0,3).map((l,i)=>({mode:l.mode||(l.off?'off':'custom'),touched:l.touched!==undefined?l.touched:!l.off,name:l.name||LEVEL_NAMES[i],loadF:l.loadF||'',loadH:l.loadH||'',note:l.note||'',
        tiers:(l.tiers&&l.tiers.length)?l.tiers.map(t=>({t:fmt==='FT'?fmtTime(t.t):String(t.t).replace('.',','),p:String(t.p)})):blankTiers()}));
      while(lv.length<3)lv.push({mode:lv.length<2?'off':'custom',touched:false,name:LEVEL_NAMES[lv.length],loadF:'',loadH:'',note:'',tiers:blankTiers()});
      const sk=l=>JSON.stringify([l.loadF,l.loadH,l.note,l.tiers]);lv.forEach((l,k)=>{if(k<2&&l.mode==='custom'&&sk(l)===sk(lv[2]))l.mode='same';});
      return {kind:p.kind||'autre',name:p.name||'',content:p.content||'',movement:p.movement||'',format:fmt,detail:p.detail||'',focus:FOCUS[p.focus]?p.focus:'cardio',levels:lv};
    })};
}
function draftToWod(d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date))throw new Error('Choisis une date.');
  if(!d.title.trim())throw new Error('Donne un titre à la séance.');
  if(!d.parts.length)throw new Error('Ajoute au moins une partie.');
  const parts=d.parts.map((p,i)=>{
    const o={label:'P'+(i+1),name:p.name.trim(),kind:p.kind,content:p.content.trim()};
    if(p.kind==='force')o.movement=p.movement.trim();
    if(p.kind==='metcon'){
      o.format=p.format;o.detail=p.detail.trim();o.focus=p.focus;
      const build=(lv,k)=>{
        const name=lv.name.trim()||LEVEL_NAMES[k];
        const tiers=[];
        for(const r of lv.tiers){
          if(String(r.t).trim()===''&&String(r.p).trim()==='')continue;
          const t=p.format==='FT'?parseTime(r.t):parseNum(r.t),pts=parseNum(r.p);
          if(t===null||pts===null)throw new Error('Palier illisible ('+o.label+', '+name+')'+(p.format==='FT'?' : écris le temps comme 12:00.':' : écris un nombre de tours.'));
          tiers.push({t,p:pts});
        }
        tiers.sort((a,b)=>p.format==='FT'?a.t-b.t:b.t-a.t);
        return {name,loadF:lv.loadF.trim(),loadH:lv.loadH.trim(),note:lv.note.trim(),tiers};
      };
      const rx=build(p.levels[2],2);
      o.levels=p.levels.map((lv,k)=>{
        if(k===2)return rx;
        const name=lv.name.trim()||LEVEL_NAMES[k];
        if(lv.mode==='off')return {name,off:true,tiers:[]};
        if(lv.mode==='custom')return build(lv,k);
        return Object.assign({},rx,{name,tiers:rx.tiers.map(t=>({t:t.t,p:t.p}))});
      });
    }
    return o;
  });
  const out={date:d.date,title:d.title.trim(),parts};
  if(String(d.base).trim()!==''){const b=parseNum(d.base);if(b===null||b<0)throw new Error('Points de la séance illisibles.');out.base=b;}
  return out;
}

        if(v==='metcon')d.parts.forEach((q,j)=>{if(j!==i&&q.kind==='metcon')q.kind='autre';});
        render();},{id:'p'+i+'-kind','aria-label':'Type de la partie'}),
      h('button',{class:'btn sm',type:'button','aria-label':'Monter',disabled:i===0,onclick:()=>{d.parts.splice(i-1,0,d.parts.splice(i,1)[0]);render();}},'↑'),
      h('button',{class:'btn sm',type:'button','aria-label':'Descendre',disabled:i===d.parts.length-1,onclick:()=>{d.parts.splice(i+1,0,d.parts.splice(i,1)[0]);render();}},'↓'),
      h('button',{class:'btn sm danger',type:'button',onclick:()=>{d.parts.splice(i,1);render();}},'Retirer')));
    box.append(field('Nom de la partie',tin(p,'name',{id:'p'+i+'-name',placeholder:metcon?'Metcon':'Back Squat'})));
    if(p.kind==='force'){const names=MOVES.map(m=>m[0]);if(p.movement&&!names.includes(p.movement))names.push(p.movement);box.append(field('Mouvement (pour le trophée du plus fort)',sel([['','Aucun']].concat(names.map(n=>[n,n])),p.movement||'',v=>{p.movement=v;},{id:'p'+i+'-mv'})));}
    box.append(field('Contenu, une ligne par consigne',h('textarea',{id:'p'+i+'-content',rows:'4',value:p.content,placeholder:metcon?'21-15-9\nThrusters\nPull-ups':'5 x 5 Back Squat à 75 %',oninput:e=>{p.content=e.target.value;}}),
      metcon?'Les charges se règlent par niveau ci-dessous.':'Écris un pourcentage et le mouvement sur la même ligne : chaque athlète verra sa charge calculée.'));
    if(metcon){
      box.append(h('div',{class:'grid2'},
        field('Format',sel([['FT','For Time'],['AMRAP','AMRAP'],['EMOM','EMOM']],p.format,v=>{p.format=v;p.levels.forEach(lv=>{lv.tiers=blankTiers();});render();},{id:'p'+i+'-fmt'}),'Changer le format efface les paliers.'),
        field('Détail (time cap, durée)',tin(p,'detail',{id:'p'+i+'-detail',placeholder:'Time cap 15 min'})),
        field('Type de metcon (trophées)',sel(Object.entries(FOCUS),p.focus,v=>{p.focus=v;},{id:'p'+i+'-focus'}))));
      [2,1,0].forEach(k=>{
        const lv=p.levels[k],mode=k===2?'custom':lv.mode;
        const kids=[h('div',{class:'flabel'},'Niveau '+(k+1)+' sur 3'+(k===2?' · Rx, à remplir en premier':''))];
        if(k<2)kids.push(h('div',{class:'seg',role:'group','aria-label':'Mode du niveau '+(k+1)},[['same','Comme niveau 3'],['custom','Adapté'],['off','Désactivé']].map(([m,l])=>h('button',{type:'button',class:'btn sm','aria-pressed':mode===m?'true':'false',onclick:()=>{
          if(m==='custom'&&!lv.touched){const rx=p.levels[2];lv.loadF=rx.loadF;lv.loadH=rx.loadH;lv.note=rx.note;lv.tiers=rx.tiers.map(t=>({t:t.t,p:t.p}));lv.touched=true;}
          lv.mode=m;render();}},l))));
        if(mode==='same')kids.push(h('p',{class:'hint'},'Reprend les charges, la variante et les paliers du niveau 3 au moment de la publication.'));
        else if(mode==='off')kids.push(h('p',{class:'hint'},'Ce niveau n’est pas proposé aux athlètes pour ce metcon.'));
        else kids.push(
          h('div',{class:'grid2'},
            field('Nom du niveau',tin(lv,'name',{id:'p'+i+'-l'+k+'-name'})),
            field('Charge femmes',tin(lv,'loadF',{id:'p'+i+'-l'+k+'-f',placeholder:'30 kg'})),
            field('Charge hommes',tin(lv,'loadH',{id:'p'+i+'-l'+k+'-h',placeholder:'40 kg'}))),
          field('Variante (optionnel)',tin(lv,'note',{id:'p'+i+'-l'+k+'-note',placeholder:'Ring rows à la place des pull-ups'})),
          tiersEditor(p,lv,i,k));
        box.append(h('div',{class:'lvl-edit'},kids));
      });
      box.append(h('p',{class:'hint'},'Le palier le plus généreux atteint donne ses points. Sans score, il n’y a que les points de la séance.'));
    }
    sec.append(box);
  });
  sec.append(h('div',{class:'row'},
    h('button',{class:'btn',type:'button',onclick:()=>{d.parts.push(blankPart('autre'));render();}},'Ajouter une partie'),
    h('button',{class:'btn primary',type:'button',onclick:async()=>{
      let w;try{w=draftToWod(d);}catch(e){toast(e.message,true);return;}
      await run(async()=>{await S.db.doc('wods/'+w.date).set(w);toast('Séance publiée pour tous les athlètes');});
      S.coach.editing=false;S.coach.wod=blankWod();render();}},S.coach.editing?'Enregistrer les modifications':'Publier la séance'),
    S.coach.editing?h('button',{class:'btn',type:'button',onclick:()=>{S.coach.editing=false;S.coach.wod=blankWod();render();}},'Annuler'):null));
  return sec;
}
function wodList(){
  const ws=Object.values(S.wods).sort((a,b)=>a.date<b.date?1:-1);
  const count=date=>Object.values(S.logs).filter(l=>l.entries&&l.entries[date]).length;
  return h('section',{class:'card'},h('h2',{class:'h2'},'Séances publiées'),
    ws.length?h('ul',{class:'list'},ws.slice(0,40).map(w=>h('li',{},
      h('div',{class:'l'},h('div',{class:'nm'},cap(fmtShort(w.date))+' · '+w.title),h('div',{class:'sub'},(w.parts||[]).length+' parties · '+count(w.date)+' athlète'+(count(w.date)>1?'s':'')+' ont validé')),
      h('div',{class:'row'},
        h('button',{class:'btn sm',onclick:()=>{S.coach.wod=wodToDraft(w);S.coach.editing=true;render();window.scrollTo(0,0);}},'Modifier'),
        S.confirm==='wod-'+w.date?h('button',{class:'btn sm danger',onclick:()=>{S.confirm=null;run(async()=>{await S.db.doc('wods/'+w.date).delete();toast('Séance supprimée');});}},'Confirmer')
                                  :h('button',{class:'btn sm danger',onclick:()=>{S.confirm='wod-'+w.date;render();}},'Supprimer')))))
    :h('p',{class:'muted'},'Aucune séance publiée.'));
}
function nextSeasonNum(){const l=plist();return String(l.reduce((m,p)=>Math.max(m,seasonNum(p)),0)+1);}
function periodEditor(){
  if(!S.coach.period)S.coach.period={id:null,num:nextSeasonNum(),name:'',start:todayStr(),end:'',base:'10'};
  const d=S.coach.period;
  return h('section',{class:'card'},h('h2',{class:'h2'},d.id?'Modifier la saison':'Programmer une saison'),
    h('p',{class:'muted'},'Le classement et les trophées se calculent entre la date de début et la date de fin. Chaque trophée reçoit le numéro de la saison.'),
    h('div',{class:'grid2'},
      field('Numéro de saison',tin(d,'num',{id:'per-num',inputmode:'numeric'})),
      field('Nom',tin(d,'name',{id:'per-name',placeholder:'Cycle octobre'})),
      field('Début',h('input',{id:'per-start',type:'date',value:d.start,oninput:e=>{d.start=e.target.value;}})),
      field('Fin',h('input',{id:'per-end',type:'date',value:d.end,oninput:e=>{d.end=e.target.value;}})),
      field('Points par séance (par défaut)',tin(d,'base',{id:'per-base',inputmode:'numeric'}),'Chaque séance peut avoir ses propres points.')),
    h('div',{class:'row'},
      h('button',{class:'btn primary',type:'button',onclick:async()=>{
        const b=parseNum(d.base),n=parseInt(d.num,10);
        if(!d.name.trim()||!d.start||!d.end||b===null||b<0||!(n>=1)){toast('Renseigne le numéro, le nom, les deux dates et les points.',true);return;}
        if(d.end<d.start){toast('La fin doit être après le début.',true);return;}
        const col=S.db.collection('periods');const ref=d.id?col.doc(d.id):col.doc();
        await run(async()=>{await ref.set({num:n,name:d.name.trim(),start:d.start,end:d.end,base:b});toast('Saison enregistrée');});
        S.coach.period=null;render();}},d.id?'Enregistrer la saison':'Créer la saison'),
      d.id?h('button',{class:'btn',type:'button',onclick:()=>{S.coach.period=null;render();}},'Annuler'):null));
}
function periodList(){
  const l=plist().reverse();
  return h('section',{class:'card'},h('h2',{class:'h2'},'Saisons'),
    l.length?h('ul',{class:'list'},l.map(p=>{const st=periodState(p);return h('li',{},
      h('div',{class:'l'},h('div',{class:'nm'},seasonLabel(p)+' · '+p.name),h('div',{class:'sub'},fmtShort(p.start)+' → '+fmtShort(p.end)+' · '+p.base+' pts par séance · '+(st==='live'?'en cours':st==='done'?'terminée':'à venir'))),
      h('div',{class:'row'},
        h('button',{class:'btn sm',onclick:()=>{S.coach.period={id:p.id,num:String(seasonNum(p)),name:p.name,start:p.start,end:p.end,base:String(p.base)};render();window.scrollTo(0,0);}},'Modifier'),
        S.confirm==='per-'+p.id?h('button',{class:'btn sm danger',onclick:()=>{S.confirm=null;run(async()=>{await S.db.doc('periods/'+p.id).delete();toast('Saison supprimée');});}},'Confirmer')
                                :h('button',{class:'btn sm danger',onclick:()=>{S.confirm='per-'+p.id;render();}},'Supprimer')));}))
    :h('p',{class:'muted'},'Aucune saison programmée. En attendant, toutes les séances comptent dans une saison unique.'));
}

/* ---------- connexion ---------- */
function authErr(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found/.test(c))return 'E-mail ou mot de passe incorrect.';
  if(c==='auth/email-already-in-use')return 'Un compte existe déjà avec cet e-mail. Utilise « Se connecter ».';
  if(c==='auth/weak-password')return 'Mot de passe trop court : 6 caractères minimum.';
  if(c==='auth/invalid-email')return 'Adresse e-mail invalide.';
  if(c==='auth/too-many-requests')return 'Trop d’essais. Attends quelques minutes.';
  if(c==='auth/network-request-failed')return 'Pas de connexion internet.';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';
  if(c==='auth/operation-not-allowed')return 'Cette méthode de connexion n’est pas activée dans Firebase.';
  return 'Connexion impossible, réessaie.';
}
function loginView(){
  const email=h('input',{id:'auth-email',type:'email',autocomplete:'email',placeholder:'toi@exemple.fr'});
  const pw=h('input',{id:'auth-pw',type:'password',autocomplete:'current-password',placeholder:'6 caractères minimum'});
  const msg=h('p',{class:'hint',role:'alert'});
  const attempt=async(fn)=>{msg.textContent='';try{await fn();}catch(e){msg.textContent=authErr(e);}};
  return h('div',{class:'stack'},
    h('div',{},h('p',{class:'eyebrow'},'Groupe de crossfit'),h('h1',{class:'day'},'Connexion')),
    h('form',{class:'card',onsubmit:e=>{e.preventDefault();attempt(()=>signInWithEmailAndPassword(auth,email.value.trim(),pw.value));}},
      field('E-mail',email),field('Mot de passe',pw),msg,
      h('div',{class:'row'},
        h('button',{class:'btn primary',type:'submit'},'Se connecter'),
        h('button',{class:'btn',type:'button',onclick:()=>attempt(()=>createUserWithEmailAndPassword(auth,email.value.trim(),pw.value))},'Créer mon compte')),
      h('div',{class:'row'},
        h('button',{class:'link',type:'button',onclick:()=>attempt(async()=>{
          if(!email.value.trim()){msg.textContent='Écris ton e-mail ci-dessus, puis clique à nouveau.';return;}
          await sendPasswordResetEmail(auth,email.value.trim());msg.textContent='Si ce compte existe, un e-mail de réinitialisation vient d’être envoyé.';})},'Mot de passe oublié'),
        h('button',{class:'link',type:'button',onclick:()=>attempt(()=>signInWithPopup(auth,new GoogleAuthProvider()))},'Continuer avec Google'))),
    h('p',{class:'ver'},'Version '+APP_VERSION));
}

/* ---------- démarrage ---------- */
function init(){
  setTimeout(checkVersion,1500);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion();});
  setInterval(checkVersion,600000);
  const bad=!firebaseConfig||!firebaseConfig.apiKey||String(firebaseConfig.apiKey).indexOf('COLLE')===0;
  if(bad){S.authReady=true;render();return;}
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  S.db=makeDb(getFirestore(app));
  render();
  let unsubs=[];
  onAuthStateChanged(auth,user=>{
    unsubs.forEach(u=>u());unsubs=[];
    S.loaded={periods:false,wods:false,logs:false};S.periods={};S.wods={};S.logs={};S.prof={prs:{},sex:''};
    S.coachUid=null;S.coachLoaded=false;S.owner=false;S.error=null;S.entry=null;S.redo=null;S.viewDate=null;S.confirm=null;
    S.coach={wod:null,editing:false,period:null};S.tab='today';S.authReady=true;
    if(!user){S.uid=null;render();return;}
    S.uid=user.uid;S.meName=user.displayName||(user.email||'').split('@')[0]||'';
    const fail=e=>{S.error=(e&&e.code==='permission-denied')?'Accès refusé par la base de données. Publie les règles de sécurité (voir README).':'Lecture des données impossible pour le moment.';scheduleRender();};
    const watch=(path,key)=>unsubs.push(S.db.collection(path).onSnapshot(sn=>{S[key]=Object.fromEntries(sn.docs.map(d=>[d.id,d.data()]));S.loaded[key]=true;scheduleRender();},fail));
    watch('periods','periods');watch('wods','wods');watch('logs','logs');
    unsubs.push(S.db.doc('config/coach').onSnapshot(sn=>{S.coachUid=sn.exists?(sn.data().uid||null):null;S.coachLoaded=true;S.owner=!!S.coachUid&&S.coachUid===S.uid;scheduleRender();},fail));
    unsubs.push(S.db.doc('users/'+S.uid+'/private/profile').onSnapshot(sn=>{const d=sn.exists?sn.data():null;S.prof={prs:(d&&d.prs)?JSON.parse(JSON.stringify(d.prs)):{},sex:(d&&d.sex)||''};scheduleRender();},fail));
    render();
  });
}
init();
})();
</script>
