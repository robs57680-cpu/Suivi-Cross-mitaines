<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D8321A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Box Score">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<title>Box Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600;700&family=Permanent+Marker&family=Rubik+Distressed&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600;700&family=Permanent+Marker&family=Rubik+Distressed&display=swap" rel="stylesheet"></noscript>
<style>
/* Layout: a gym whiteboard column. Barbell wordmark on top, scoreboard panel for stats, weight plates as ranks and trophies.
   Light = concrete floor, dark = rubber floor. Anton for headings and numerals, Work Sans for text, Plex Mono for scores. */
:root{
  --bg:#E2E4E6; --surface:#FFFFFF; --surface2:#F0F1F2; --ink:#0D0F12; --muted:#58606A; --line:#C3C8CD; --edge:#0D0F12;
  --accent:#D8321A; --accent-ink:#FFFFFF; --tint:#FCE4DF;
  --panel:#0D0F12; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
  --ok:#17803F; --danger:#B3261E;
  --plate-red:#D92B1F; --plate-blue:#1F55D6; --plate-yellow:#F4C400; --plate-green:#1E9B4A; --plate-black:#1B1D20; --plate-white:#F3F3F1;
  --f-display:'Anton','Impact','Arial Narrow',sans-serif;
  --f-body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C0E; --surface:#16181B; --surface2:#1E2125; --ink:#F2F2EF; --muted:#9BA2A9; --line:#2B2F34; --edge:#3A3F45;
    --accent:#FF4B27; --accent-ink:#1A0A06; --tint:#2A1B18;
    --panel:#1D2024; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
    --ok:#5CCB92; --danger:#FF8A80; --plate-black:#2A2D31;
    --wallo:1;--cardbg:rgba(11,12,14,.82);--cardbd:#8b8e93 #6a6d72 #85888d #5b5e63;--cardr:3px 7px 3px 6px/6px 3px 7px 3px;--cardsh:inset 0 0 0 1px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.6);--btnbg:rgba(255,255,255,.05);--tsh:0 1px 1px rgba(0,0,0,.85);--topbg:linear-gradient(rgba(9,9,11,.93),rgba(9,9,11,.82));--topbd:1px solid #3a3d41;--tabbg:linear-gradient(rgba(12,12,14,.9),rgba(5,5,7,.97));--tabon:#fff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --surface:#16181B; --surface2:#1E2125; --ink:#F2F2EF; --muted:#9BA2A9; --line:#2B2F34; --edge:#3A3F45;
  --accent:#FF4B27; --accent-ink:#1A0A06; --tint:#2A1B18;
  --panel:#1D2024; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
  --ok:#5CCB92; --danger:#FF8A80; --plate-black:#2A2D31;
    --wallo:1;--cardbg:rgba(11,12,14,.82);--cardbd:#8b8e93 #6a6d72 #85888d #5b5e63;--cardr:3px 7px 3px 6px/6px 3px 7px 3px;--cardsh:inset 0 0 0 1px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.6);--btnbg:rgba(255,255,255,.05);--tsh:0 1px 1px rgba(0,0,0,.85);--topbg:linear-gradient(rgba(9,9,11,.93),rgba(9,9,11,.82));--topbd:1px solid #3a3d41;--tabbg:linear-gradient(rgba(12,12,14,.9),rgba(5,5,7,.97));--tabon:#fff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.shell{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px;min-width:0}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;border-bottom:2px solid var(--edge);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:26px;letter-spacing:.06em;line-height:1}
.bb{width:58px;height:20px;color:var(--ink);flex:none}
.bb .pl{fill:var(--accent)}
.bb rect{fill:currentColor}
.bb .pl{fill:var(--accent)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day{font-family:var(--f-display);font-weight:400;font-size:46px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.wtitle{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;text-transform:uppercase;text-wrap:balance}
.h2{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.h2::after{content:"";flex:1;height:2px;background:var(--edge);opacity:.25}

/* blocs */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:4px;padding:16px;display:grid;gap:12px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--edge);border-radius:2px;padding:1px 8px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:transparent;white-space:nowrap}
.chip.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.done{color:var(--muted);border-color:var(--line)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip.load{background:var(--tint);border-color:transparent;color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px}
.chip.miss{border-style:dashed;border-color:var(--line);color:var(--muted);text-transform:none;letter-spacing:0}
.btn{border:2px solid var(--edge);background:transparent;border-radius:4px;padding:10px 16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:12px}
.capbox{display:grid;gap:8px;margin:10px 0}.capbox .caprow{display:flex;flex-wrap:wrap;gap:8px}
.capchk{padding:10px 12px;border-radius:10px;background:rgba(127,127,127,.14);border:1px solid rgba(127,127,127,.35);font-size:13px;line-height:1.45;color:inherit;text-align:left}
.capchk[hidden]{display:none}.capchk p{margin:0 0 6px}.capchk p:last-child{margin:0}.capchk ul{margin:4px 0 6px;padding-left:18px}.capchk b{font-weight:700}.capchk.err{border-color:var(--danger)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.field{display:grid;gap:4px;min-width:0}
.flabel{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;background:var(--surface2);border:2px solid var(--line);border-radius:4px;padding:10px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.link{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font-weight:600}
/* petite main à côté de chaque mot cliquable (liens, noms de mouvements, format du metcon) */
.link::after,.mv::after,.fmtbtn::after{content:'👆';display:inline-block;margin-left:3px;font-size:.72em;font-weight:400;font-style:normal;text-decoration:none;text-shadow:none;text-transform:none;letter-spacing:0;opacity:.85}
.av.noav{display:grid;place-items:center;text-align:center;padding:8px;font-size:12px;line-height:1.3;color:var(--muted);background:var(--surface2);border:2px dashed var(--line);aspect-ratio:480/968;background-image:none}
.av.noav.tap{cursor:pointer}
.feed-av .noav-dot{width:100%;height:100%;display:grid;place-items:center;font-weight:700;color:var(--muted);background:var(--surface2);cursor:pointer}
/* profil d'un autre participant : avatar pleine hauteur à gauche de la bannière */
.bn.bn-prof{padding:0;height:230px}
.bn-prof-row{display:flex;align-items:stretch;height:100%;gap:0}
.bn-prof .bn-prof-row>.av{flex:none;width:114px!important;height:230px;aspect-ratio:auto;border:0;border-right:2px solid var(--edge);border-radius:0}
.bn-prof-txt{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.bn-prof-txt h1.day{font-size:30px;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.bn-prof-txt .eyebrow{overflow-wrap:anywhere}
.ps-banner{padding:10px 12px;border:2px solid var(--line);border-radius:4px;font-weight:700}
.ps-banner.warn{border-color:var(--danger);color:var(--danger)}
.ps-banner.ok{border-color:var(--ok);color:var(--ok)}
.ps-issues{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:14px}
.ps-issues li.warn::before{content:'⚠ ';color:var(--danger)}
.ps-issues li.info{color:var(--muted)}.ps-issues li.info::before{content:'ℹ '}
.ps-hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ps-hd b{font-family:var(--f-display);text-transform:uppercase;font-size:17px}
.ps-title{font-size:18px;font-weight:700}
.ps-part{border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:grid;gap:5px;background:var(--surface2)}
.ps-lines{font-family:var(--f-mono);font-size:13px;display:grid;gap:1px;overflow-wrap:anywhere}
.ps-lv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.ps-lv .k{font-weight:700}
.varmk{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 4px;font-weight:700}
.varnote{font-size:13px;font-weight:600;color:var(--accent)}
.mvpanel{border:1px dashed var(--line);border-radius:6px;padding:10px;background:var(--surface2)}
.mvpanel .chk{display:inline-flex;margin-right:12px}
.fmtbtn{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}

/* séance, façon tableau blanc de la box */
.part{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:14px;background:var(--surface);border:2px solid var(--edge);border-radius:4px}
.plabel{font-family:var(--f-display);font-size:28px;line-height:1;display:grid;place-items:center;height:48px;background:var(--ink);color:var(--bg);border-radius:2px}
.plabel.sm{height:34px;width:48px;font-size:20px}
.metcon{border-color:var(--accent)}
.metcon .plabel,.plabel.on{background:var(--accent);color:var(--accent-ink)}
.pbody{display:grid;gap:8px;min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.phead h3{font-weight:700;font-size:17px}
.tro-h{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:44px}
.tro-h .h2{display:block}
.tro-h .chev{font-size:18px;transition:transform .2s}
.tro-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.btn-block{width:100%;min-height:52px}
/* encart « Entrer mes résultats » : fenêtre au-dessus de la page, les champs brillent quelques fois à l'ouverture */
body.modal-open{overflow:hidden}
.ov.entry-ov{z-index:35;background:var(--bg);align-items:stretch;justify-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
.sheet.entry-sheet{width:100%;max-width:820px;height:100%;max-height:none;border-radius:6px;padding:0 16px 24px;gap:14px;background:var(--surface);box-shadow:0 2px 14px rgba(0,0,0,.35)}
.ov-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;background:var(--surface);border-bottom:2px solid var(--edge)}
.ov-h .ov-t{font-family:var(--f-display);font-size:26px;line-height:1;text-transform:uppercase}
.ov-x{flex:none;width:44px;height:44px;border:2px solid var(--edge);border-radius:4px;background:var(--surface2);color:var(--ink);font:inherit;font-size:18px;cursor:pointer}
@keyframes entryGlow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 3px var(--accent),0 0 18px 5px var(--accent)}}
.entry-sheet.glow :is(input:not([type=checkbox]):not([type=radio]),textarea,select){animation:entryGlow .9s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.entry-sheet.glow :is(input,textarea,select){animation:none}}
.rw-cat{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.pbody.has-sw{position:relative;padding-right:66px;min-height:66px}
.pbody.has-sw>.sw{position:absolute;top:0;right:0}
.sw{flex:none;border:0;background:none;padding:0;width:58px;height:65px;color:var(--ink);cursor:pointer;display:block;-webkit-tap-highlight-color:transparent}
.sw svg{width:100%;height:100%;display:block}
.sw .sw-face{fill:var(--surface2);stroke:currentColor;stroke-width:4}
.sw .sw-t{font-family:var(--f-mono);font-weight:700;fill:var(--ink)}
.sw.run{color:var(--accent)}
.fmt{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.line{overflow-wrap:anywhere}
.lines{display:grid;gap:6px}
.tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pu{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pu-card{border:1px solid var(--line,#ddd);border-radius:10px;padding:8px 10px;font-size:.92em}
.pu-t{font-weight:700;margin-bottom:4px}
.pu-l{display:flex;justify-content:space-between;gap:8px}
.pu-r{margin-top:4px;font-weight:700}
.tier{font-family:var(--f-mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;padding:2px 8px}

/* disques */
.plate{--pc:var(--plate-black);--pi:#FFFFFF;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--pi);
  background:radial-gradient(circle,transparent 0 44%,rgba(0,0,0,.32) 45% 48%,transparent 49% 100%),var(--pc);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),inset 0 0 0 4px rgba(0,0,0,.28)}
.plate svg{width:26px;height:26px}
.t-goat{--pc:var(--plate-red)}
.t-regulier{--pc:var(--plate-green)}
.t-serie{--pc:var(--plate-blue)}
.t-perf{--pc:var(--plate-yellow);--pi:#14161A}
.t-fort{--pc:var(--plate-black)}
.t-cardio{--pc:var(--plate-white);--pi:#14161A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.08)}
.plate.off{filter:grayscale(1);opacity:.3}

/* classement */
.lb{list-style:none;margin:0;padding:0;border:2px solid var(--edge);border-radius:4px;background:var(--surface);overflow:hidden}
.lb li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb li.me{background:var(--tint)}
.rank{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;line-height:1;border:2px solid var(--line);color:var(--muted)}
.rank.r1,.rank.r2,.rank.r3{border-color:transparent;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),inset 0 0 0 4px rgba(0,0,0,.25);color:#FFFFFF}
.rank.r1{background:var(--plate-red)}
.rank.r2{background:var(--plate-blue)}
.rank.r3{background:var(--plate-yellow);color:#14161A}
.nm{font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.pts{font-family:var(--f-display);font-size:30px;line-height:1;text-align:right}
.pts small{display:block;font-family:var(--f-mono);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}

/* trophées */
.trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.trophy{background:var(--surface);border:2px solid var(--edge);border-radius:4px;padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.trophy .tn{font-family:var(--f-display);font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.trophy .td{font-size:12px;color:var(--muted)}
.trophy .tw{font-weight:700;overflow-wrap:anywhere;margin-top:6px}
.trophy.mine{background:var(--tint)}

/* tableau de score du profil */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));background:var(--panel);color:var(--panel-ink);border-radius:4px}
.stat{padding:14px 14px 12px;border-right:1px solid rgba(255,255,255,.14);min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1}
.stat:first-child b{color:var(--panel-accent)}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--panel-muted)}
.tally-row{display:grid;gap:6px;padding:12px 14px;border:2px solid var(--edge);border-radius:4px;background:var(--surface)}
.tally{display:flex;flex-wrap:wrap;gap:6px;color:var(--ink)}
.tally svg{display:block;height:26px;width:auto}

.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.list li:last-child{border-bottom:0}
.list .l{min-width:0;overflow-wrap:anywhere}
.pr{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr-top{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center}
.pct{display:flex;flex-wrap:wrap;gap:6px}
.pct span{font-family:var(--f-mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;padding:2px 6px}
.pedit{border:2px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:10px;background:var(--surface2)}
.pedit-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pedit-head select{width:auto;flex:1;min-width:120px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.tgroup{display:grid;gap:6px}
.trow.pend input:first-child{border-style:dashed;font-style:italic}
.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper input{width:88px;flex:0 0 88px;text-align:center}
.banner{border:2px solid var(--edge);background:var(--surface);border-radius:4px;padding:14px;display:grid;gap:10px;margin-bottom:16px}
.banner.warn{border-color:var(--accent)}
.preview{font-family:var(--f-mono);font-size:14px;font-weight:600}
.lvl-ban{border-radius:4px;padding:12px 14px;color:#fff;display:grid;gap:3px;border:2px solid rgba(0,0,0,.25)}
.lvl-ban.lv-0{background:#1F8A4C}.lvl-ban.lv-1{background:#C77700}.lvl-ban.lv-2{background:#D8321A}.lvl-ban.lv-c{background:#6B3FA0}
.lvl-ban .lb-k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}

.feed-result{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.feed-metric{background:var(--surface2);border:1px solid var(--line);padding:10px;border-radius:3px;min-width:0}
.feed-metric b{display:block;font-family:var(--f-display);font-size:23px;font-weight:400;overflow-wrap:anywhere}
.feed-metric span{display:block;font:600 10px var(--f-mono);text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
/* bulles de réactions flottant sur toutes les pages */
.bubs.rxfloat{position:fixed;inset:0;z-index:8}
.av-stage{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.av-stage .av{transform-origin:50% 50%;will-change:transform;cursor:grab}
.zbar{position:absolute;right:6px;bottom:6px;z-index:3;display:flex;align-items:center;gap:6px}
.zbar .btn{color:var(--panel-ink);border-color:var(--panel-muted);background:rgba(0,0,0,.45);min-width:44px}
.zlab{font:600 11px var(--f-mono);color:var(--panel-ink);background:rgba(0,0,0,.45);padding:4px 6px;border-radius:2px;min-width:48px;text-align:center}

/* bandeau de mise à jour : reste visible en haut même après défilement */
.banner.upd{position:sticky;top:calc(var(--toph,64px) + env(safe-area-inset-top,0px));z-index:7;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* thème Halloween : décor d'avatar élargi et habillage discret de l'appli */
.av{background-size:cover;background-position:49% center}
.av.nobg{background:transparent;border:0}
.av-world{position:relative;flex:none;height:min(100%,calc(100vw - 24px));aspect-ratio:1/1;overflow:hidden;border:2px solid var(--edge);border-radius:4px;background:#0B0C0E;transform-origin:50% 50%;will-change:transform;cursor:grab}
.av-scene{position:absolute;inset:0}
.av-world .av{height:96%!important;top:3%!important;left:49%!important}
.av-scene svg{display:block;width:100%;height:100%}
.av-stage .av-world .av{position:absolute;left:50%;top:0;height:100%;width:auto;max-width:none;transform:translateX(-50%)}
#hal-deco{position:fixed;inset:0;z-index:6;pointer-events:none}
#hal-deco svg{position:absolute;display:block;opacity:.6}
#hal-deco .hd-web{top:0;right:0;width:110px;height:110px}
#hal-deco .hd-sp{top:0;right:64px;width:26px;height:96px;transform-origin:50% 0}
#hal-deco .hd-pm{left:10px;bottom:calc(var(--tabh,62px) + 6px);width:46px;height:46px}
html[data-hal] .top{border-bottom-color:#E8710A}
@media (prefers-reduced-motion:no-preference){#hal-deco .hd-sp{animation:hdsw 6s ease-in-out infinite}}
@keyframes hdsw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* barre du bas : espaces réguliers entre les onglets, taille de police inchangée */
.tabs .in,.tabs .in.coach-tabs{display:flex;justify-content:space-evenly;align-items:stretch;gap:0;padding:0 8px;max-width:720px;margin:0 auto}
.tabs .in>.tab,.tabs .in.coach-tabs>.tab,.tabs .in.coach-tabs>.tab:first-child{flex:0 0 auto;min-width:0;width:auto;font-size:clamp(14px,4.6vw,20px);letter-spacing:.03em;padding:18px 6px 16px;white-space:nowrap}
.tabs .in>.tab-dropdown,.tabs .in.coach-tabs>.tab-dropdown{flex:0 0 auto;min-width:0;display:flex}
.tabs .in.coach-tabs>.tab-dropdown>.tab,.tabs .in>.tab-dropdown>.tab{flex:0 0 auto;width:auto;font-size:clamp(14px,4.6vw,20px);letter-spacing:.03em;padding:18px 6px 16px;white-space:nowrap}

/* bannière sportive : fond actif de l'athlète, identique sur le profil et dans le fil.
   Le fond, le cadre et le titre se branchent via le registre BN (voir JS). */
.bn{position:relative;min-width:0;width:100%;max-width:100%;padding:10px 12px;border:2px solid var(--edge);border-radius:4px;color:var(--panel-ink);overflow:hidden}
.bn-bg-base{background:linear-gradient(115deg,var(--panel) 0 72%,var(--accent) 72% 75%,var(--panel) 75% 78%,var(--accent) 78% 80%,var(--panel) 80%)}
.bn-bg-alpha{--alpha-k:1;background-color:#0a0a0b;background-image:url('assets/embedded/banniere-box-score-Alpha.png');background-size:contain;background-position:center;background-repeat:no-repeat;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);
  /* image dézoomée (contain) : on la voit en entier (barre, poids, « ALPHA SEASON »), les bords restent noirs comme l'image.
     --alpha-k règle la hauteur : 1 = hauteur exacte de l'image (plus haute), plus grand = bannière plus basse et image plus petite. */
  aspect-ratio:calc(var(--alpha-r,4.17)*var(--alpha-k));display:flex;align-items:flex-end;padding:0 14px 2% 14px;border-color:#3b3a3d}
.bn-bg-alpha>*{flex:1;min-width:0}
.bn-bg-alpha .nm,.bn-bg-alpha .link,.bn-bg-alpha h1,.bn-bg-alpha .sub,.bn-bg-alpha .eyebrow{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.bn-bg-alpha .bn-title{color:#f5a623;letter-spacing:.14em;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.bn.bn-bg-alpha .feed-av{box-shadow:0 0 0 2px #f5a623,0 0 0 4px rgba(0,0,0,.55)}
/* fond Angry Pumpkin : visuel complet (cadre qui dégouline, citrouille, chauves-souris) ; zone centrale sombre réservée au pseudo */
.bn-bg-angrypumpkin{background-color:#070b14;background-image:url('assets/embedded/cadre-halloween-entete.webp');background-size:cover;background-position:left center;background-repeat:no-repeat;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);border-color:#1b2a4a;padding-left:min(22%,84px)}
.bn-bg-angrypumpkin .nm,.bn-bg-angrypumpkin .link,.bn-bg-angrypumpkin h1,.bn-bg-angrypumpkin .sub,.bn-bg-angrypumpkin .eyebrow{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.bn-bg-angrypumpkin .bn-title,.bn-bg-angrypumpkin .eyebrow{color:#ff8a2a}
/* carte du fil habillée Angry Pumpkin : sans contour, le haut du visuel est le haut de la carte et les gouttes du bas en sont le bas */
/* publication « Angry Pumpkin » : le cadre de lave EST le bord de la publication (aucun encadré derrière).
   Deux images à fond transparent : assets/embedded/cadre-halloween-entete.webp (bandeau avec le rond de l'avatar)
   et assets/embedded/cadre-halloween-corps.webp (cadre du bas, étiré en 9 zones). Tailles en cqw = % de la largeur de la carte. */
.feed-card.th-angrypumpkin{container-type:inline-size;position:relative;overflow:visible;background:none;border:0;border-radius:0;box-shadow:none;color:#f2f4f8;padding-bottom:30px}
.feed-card.th-angrypumpkin::before{content:'';position:absolute;left:0;right:0;top:19.4cqw;bottom:0;box-sizing:border-box;border-style:solid;border-width:3.4cqw 3.4cqw 5.8cqw 3.4cqw;border-image:url('assets/embedded/cadre-halloween-corps.webp') 40 40 70 40 fill/3.4cqw 3.4cqw 5.8cqw 3.4cqw stretch;pointer-events:none;z-index:0}
.feed-card.th-angrypumpkin>*{position:relative;z-index:1}
.feed-card.th-angrypumpkin>.bn{z-index:3;align-self:start;background:url('assets/embedded/cadre-halloween-entete.webp') 0 0/100% 100% no-repeat;border:0;box-shadow:none;border-radius:0;display:block;overflow:visible;padding:0;min-height:0;aspect-ratio:1200/270}
.feed-card.th-angrypumpkin>.bn.has-badge{min-height:0}
.feed-card.th-angrypumpkin>.bn>.feed-head{position:absolute;left:calc(22.2% - 5.15cqw);top:56.5%;transform:translateY(-50%);width:52cqw;gap:2.2cqw}
.feed-card.th-angrypumpkin>.bn.has-badge .feed-meta{padding-right:0}
.feed-card.th-angrypumpkin .feed-av{width:10.3cqw;height:10.3cqw;box-shadow:none}
.feed-card.th-angrypumpkin .feed-av .av{width:10.3cqw!important;height:20.77cqw!important;min-width:0!important}
.feed-card.th-angrypumpkin .avf{width:10.3cqw;height:10.3cqw}
.feed-card.th-angrypumpkin .avf>.avf-img{width:15.9cqw;height:15.9cqw}
.feed-card.th-angrypumpkin>.bn .nm{font-size:clamp(13px,4.2cqw,20px);line-height:1.1}
.feed-card.th-angrypumpkin>.bn .bn-title{font-size:clamp(8px,2.6cqw,11px);line-height:1.2}
.feed-card.th-angrypumpkin .wtitle{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.feed-card.th-angrypumpkin .sub{color:#9aa6bf}
.feed-card.th-angrypumpkin .feed-metric{background:rgba(14,22,40,.78);border-color:#1f3157}
.feed-card.th-angrypumpkin .feed-metric b{color:#fff}
.feed-card.th-angrypumpkin .feed-metric span{color:#8e9bb7}
.feed-card.th-angrypumpkin .rxb{background:rgba(14,22,40,.78);border-color:#1f3157}
.feed-card.th-angrypumpkin .rxb[aria-pressed="true"]{border-color:#ff8a2a;background:rgba(255,138,42,.18)}
/* Angry Pumpkin, habillage « maquette » : cadres de sang, icônes, badge, pastille RX, sang du score, polices.
   Fichiers dans assets/embedded : cadre-halloween-resultat, icone-halloween-haltere, icone-halloween-chrono,
   sang-halloween-points, sang-halloween-pastille, gouttes-halloween-badge (.webp) */
.feed-card.th-angrypumpkin .nm,.feed-card.th-angrypumpkin .wtitle,.feed-card.th-angrypumpkin .feed-metric b{font-family:'Rubik Distressed','Anton',Impact,sans-serif;letter-spacing:.02em}
.feed-card.th-angrypumpkin>.bn .bn-title{font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#ff5a2a}
.feed-card.th-angrypumpkin .feed-message{font-family:'Permanent Marker','Comic Sans MS',cursive;font-size:21px;line-height:1.3;color:#fff;transform:rotate(-2deg);transform-origin:left center;text-shadow:0 2px 3px #000}
.feed-card.th-angrypumpkin .feed-result{gap:16px;padding-bottom:6px}
.feed-card.th-angrypumpkin .feed-metric{background:rgba(10,7,7,.88);border:0 solid transparent;border-width:7px 7px 20px 7px;border-image:url('assets/embedded/cadre-halloween-resultat.webp') 26 26 74 26/7px 7px 20px 7px stretch;border-radius:0;padding:8px 8px 0;overflow:visible}
.feed-card.th-angrypumpkin .feed-metric.fm-force,.feed-card.th-angrypumpkin .feed-metric.fm-mc{display:grid;grid-template-columns:44px 1fr;column-gap:10px;align-items:center}
.feed-card.th-angrypumpkin .feed-metric.fm-force::before,.feed-card.th-angrypumpkin .feed-metric.fm-mc::before{content:'';grid-row:1/3;width:44px;height:44px;background:url('assets/embedded/icone-halloween-haltere.webp') center/contain no-repeat}
.feed-card.th-angrypumpkin .feed-metric.fm-mc::before{background-image:url('assets/embedded/icone-halloween-chrono.webp')}
.feed-card.th-angrypumpkin .feed-metric.fm-force>*,.feed-card.th-angrypumpkin .feed-metric.fm-mc>*{grid-column:2}
.feed-card.th-angrypumpkin .feed-metric b{color:#fff;text-shadow:0 2px 3px #000}
.feed-card.th-angrypumpkin .feed-metric span{color:#a8a3b8}
.feed-card.th-angrypumpkin .rxb{background:rgba(10,7,7,.88);border:0 solid transparent;border-width:5px 5px 10px 5px;border-image:url('assets/embedded/cadre-halloween-resultat.webp') 26 26 74 26/5px 5px 10px 5px stretch;border-radius:0}
.feed-card.th-angrypumpkin .rxb[aria-pressed="true"]{background:rgba(255,90,30,.2);box-shadow:0 0 12px rgba(255,90,30,.75)}
.feed-card.th-angrypumpkin .rxb small{color:#fff}
.feed-card.th-angrypumpkin .rxwrap{padding-right:94px}
/* Angry Pumpkin : lune dans l'en-tête et décor en fond de publication (decor-halloween-lune / -cimetiere / -salle) */
.feed-card.th-angrypumpkin>.bn::after{content:'';position:absolute;z-index:0;left:60%;top:26%;width:17%;height:52%;background:url('assets/embedded/decor-halloween-lune.webp') center/100% 100% no-repeat;pointer-events:none}
.feed-card.th-angrypumpkin>.bn>.feed-head{z-index:1}
.feed-card.th-angrypumpkin::after{content:'';position:absolute;z-index:0;left:3.4cqw;right:3.4cqw;top:20cqw;bottom:5.8cqw;pointer-events:none;background:url('assets/embedded/decor-halloween-cimetiere.webp') right 2cqw top 5cqw/56cqw auto no-repeat,url('assets/embedded/decor-halloween-salle.webp') right 0 bottom 24cqw/78cqw auto no-repeat}
.feed-card.th-angrypumpkin .feed-pts{isolation:isolate;font-family:'Rubik Distressed','Anton',Impact,sans-serif;font-size:23px;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.7);padding:0;right:16px;bottom:14px;transform:rotate(-8deg);transform-origin:center}
.feed-card.th-angrypumpkin .feed-pts::before{content:'';position:absolute;z-index:-1;inset:auto;left:50%;top:50%;width:92px;height:100px;transform:translate(-50%,-34%);background:url('assets/embedded/sang-halloween-points.webp') center/100% 100% no-repeat}
.feed-card.th-angrypumpkin .lvsh{clip-path:none;background:url('assets/embedded/sang-halloween-pastille.webp') center/100% 100% no-repeat;padding:9px 16px;margin-left:12px;font-family:'Rubik Distressed','Anton',Impact,sans-serif;font-size:15px;letter-spacing:.04em;color:#fff;text-shadow:0 1px 2px #000}
.feed-card.th-angrypumpkin .lvsh.l0{filter:hue-rotate(100deg)}
.feed-card.th-angrypumpkin .lvsh.l1{filter:hue-rotate(190deg)}
section.feed-card.th-angrypumpkin>.feed-badge{filter:drop-shadow(0 0 8px rgba(255,50,0,.8)) drop-shadow(3px 5px 4px rgba(0,0,0,.6))}
section.feed-card.th-angrypumpkin>.feed-badge::after{content:'';position:absolute;left:-4%;right:-4%;bottom:-17px;height:40px;background:url('assets/embedded/gouttes-halloween-badge.webp') center top/100% 100% no-repeat;pointer-events:none}
/* carte du fil habillée Alpha : la bannière Alpha reste en haut, le reste de la carte est noir avec des coups de pinceau dorés */
.feed-card.th-alpha{position:relative;overflow:hidden;background:#0a0a0b;border-color:#3b3a3d;color:#f2f2f2}
.feed-card.th-alpha::after{content:'';position:absolute;right:0;bottom:0;width:26%;aspect-ratio:312/317;background:url('assets/embedded/alpha-coin-bas-droit.webp') right bottom/100% 100% no-repeat;pointer-events:none;z-index:0}
/* coups de pinceau dorés : coin bas-gauche de la carte, coin haut-gauche sous la bannière, soulignés du titre / des résultats / du message */
.feed-card.th-alpha::before{content:'';position:absolute;left:0;bottom:0;width:36%;aspect-ratio:420/380;background:url('assets/embedded/alpha-coin-bas-gauche.webp') left bottom/100% 100% no-repeat;pointer-events:none;z-index:0}
.feed-card.th-alpha>*{position:relative;z-index:1}
.feed-card.th-alpha>.bn{z-index:2}
.feed-card.th-alpha .feed-wod-head{position:relative;margin-bottom:6px}
.feed-card.th-alpha .feed-wod-head::before{content:'';position:absolute;left:-16px;top:-14px;width:96px;aspect-ratio:300/260;background:url('assets/embedded/alpha-coin-haut-gauche.webp') left top/100% 100% no-repeat;pointer-events:none;z-index:-1}
.feed-card.th-alpha .wtitle{position:relative;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.feed-card.th-alpha .wtitle::after,.feed-card.th-alpha .feed-message::after,.feed-card.th-alpha .feed-metric::before{content:'';position:absolute;left:0;height:20px;background:url('assets/embedded/alpha-trait.webp') left center/100% 100% no-repeat;pointer-events:none;z-index:-1}
.feed-card.th-alpha .wtitle::after{bottom:-12px;width:min(100%,300px)}
.feed-card.th-alpha .feed-message{position:relative}
.feed-card.th-alpha .feed-message::after{bottom:-14px;width:min(70%,260px)}
.feed-card.th-alpha .sub{color:#a9a6a0}
.feed-card.th-alpha .feed-metric{position:relative;isolation:isolate;background:rgba(10,10,10,.72);border:1px solid #b8862d;border-radius:4px;overflow:hidden}
.feed-card.th-alpha .feed-metric::before{left:6px;top:34px;width:70%;height:16px}
.feed-card.th-alpha .feed-metric>*{position:relative;z-index:1}
.feed-card.th-alpha .feed-metric b{color:#fff}
.feed-card.th-alpha .feed-metric span{color:#a9a6a0}
.feed-card.th-alpha .rxb{background:rgba(10,10,10,.72);border-color:#b8862d}
.feed-card.th-alpha .rxb[aria-pressed="true"]{border-color:#f5a623;background:rgba(245,166,35,.18)}
.bn .nm,.bn .link,.bn h1{color:var(--panel-ink)}
.bn .sub,.bn .eyebrow{color:var(--panel-muted)}
.bn h1.day{font-size:34px}
.bn .feed-av{box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.bn-title{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--panel-accent)}
.feed-card>.bn{max-width:none;width:auto;margin:-16px -16px 0;border-width:0 0 2px;border-radius:2px 2px 0 0}
.feed-wod-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0;flex-wrap:wrap}
.feed-wod-head .wtitle{min-width:0;flex:1}
.feed-wod-date{white-space:nowrap;flex:none}
.bn.bn-editable{cursor:pointer}
.bn.bn-editable:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.feed-av.lg{width:64px;height:64px}
.feed-av.lg .av{width:64px!important;height:129px!important;min-width:64px!important}

/* cadre d'avatar (récompense de saison) : affiché dans le fil uniquement.
   Le cadre est plus grand que l'avatar (68px pour 44px) et déborde sans changer la place prise dans la ligne. */
.avf{position:relative;width:44px;height:44px;flex:none}
.avf>.avf-img{position:absolute;left:50%;top:50%;width:68px;height:68px;transform:translate(-50%,-50%);max-width:none;pointer-events:none;z-index:2;user-select:none}
.bn.bn-avf{padding:12px 14px}
.avf.lg{width:64px;height:64px}
.avf.lg>.avf-img{width:99px;height:99px}
.bn.bn-avf.bn-avf-lg{padding:18px 20px}
.avf>.avf-img.avf-glow{filter:drop-shadow(0 0 2px rgba(255,255,255,.55)) drop-shadow(0 0 6px rgba(255,255,255,.25))}
.avf-thumb{width:44px;height:44px;object-fit:contain;flex:none;background:#15171B;border-radius:50%}

/* Récompenses XP de saison */
.bn .reward-frame{border:4px solid var(--panel-accent);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.bn.reward-bg{background:linear-gradient(115deg,#252A34 0 65%,var(--accent) 65% 80%,#252A34 80%)}
.xp-card{border:2px solid var(--accent);background:var(--tint);padding:14px;border-radius:4px;display:grid;gap:8px}
.xp-big{font:32px var(--f-display);line-height:1}
.reward-edit{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:8px;padding:10px;border:1px solid var(--line);background:var(--surface2);border-radius:4px}
.reward-edit .wide{grid-column:1/-1}
.reward-pop{position:fixed;inset:0;z-index:80;background:#000b;display:grid;place-items:center;padding:18px}
.reward-pop .rp-card{width:min(100%,440px);max-height:90vh;overflow:auto;background:var(--surface);color:var(--ink);border:3px solid var(--accent);border-radius:6px;padding:20px;display:grid;gap:14px;text-align:center;justify-items:center;box-shadow:0 15px 50px #0008}
.reward-pop img{max-width:100%;max-height:38vh;object-fit:contain;border-radius:4px}
.reward-art{width:120px;height:120px;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--accent);border-radius:50%;font:28px var(--f-display);overflow:hidden}
.reward-art img{width:100%;height:100%;object-fit:contain}
.avu-list{display:grid;gap:10px;width:100%;margin:0}
.avu-row{display:flex;align-items:center;gap:12px;text-align:left;padding:10px;border:2px solid var(--edge);border-radius:6px;background:var(--surface2)}
.avu-row .reward-art{width:72px;height:72px;flex:none}
.avu-row .avu-txt{display:grid;gap:3px;min-width:0;flex:1}
.avu-row .btn{flex:none}


/* icônes du fil (cloche, lettre) */
.ibtn{position:relative}
.ibdot{position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
/* message du coach : enveloppe à ouvrir */
.ann{position:fixed;inset:0;z-index:60;background:rgba(8,9,11,.88);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.ann-stage{display:grid;justify-items:center;gap:20px;width:100%;max-width:440px;min-width:0}
.ann-hint{color:#ECECE8;text-align:center;font-size:15px}
.ann-hint b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.env{position:relative;width:min(80vw,310px);aspect-ratio:3/2;border:0;background:none;padding:0;cursor:pointer;perspective:900px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.55));-webkit-tap-highlight-color:transparent}
.env svg{display:block;position:absolute;left:0;width:100%;overflow:visible}
.env-bk{top:0;height:100%}
.env-flap{top:0;height:60%;transform-origin:50% 0;z-index:3}

   Le score d'un For Time arrêté par le time cap est stocké en reps cumulées (capScore), les paliers aussi.
   Un « tour » est :
   - une ligne du schéma détecté dans le contenu (21-15-9 ou 10-9-8-…-1) : chaque nombre est un tour, pour tous les mouvements ;
   - sinon un tour identique, si « Reps par tour » est renseigné ;
   - sinon il n'y a pas de tours : le score est un simple nombre de reps.

const LADDER=/^\d+(?:\s*[-–]\s*\d+)+(?:\s|$)/;

function lineItems(m){
  const items=[];

/* ---------- reps équivalentes dans un tour (AMRAP / EMOM) ----------

     50 Single under {=5}     -> la ligne entière vaut 5 reps
   Les reps en plus saisies par l'athlète sont les reps réelles, dans l'ordre des lignes du tour. */
const WTAG=/\s*\{\s*(?:(\d+(?:[.,]\d+)?)\s*)?=\s*(\d+(?:[.,]\d+)?)\s*\}/;
const NOT_REPS=/^\d+\s*(min|minutes?|sec|secondes?|s|rounds?|tours?|'|")(\s|$)/i;
function roundModel(m){
  if(!m)return null;
  const items=[];let weighted=false;
  for(const raw of String(m.content||'').split('\n')){
    const s=raw.trim();if(!s)continue;
    const w=s.match(WTAG),clean=s.replace(WTAG,'').trim();
    if(NOT_REPS.test(clean)||/^\d+(\s*[-–\/]\s*\d+)+(\s|$)/.test(clean))continue;
    const lm=clean.match(/^(\d+)\s+\S/);
    if(!lm)continue;
    const n=+lm[1];let eq=n;
    if(w){const a=w[1]?parseNum(w[1]):null,b=parseNum(w[2]);if(b!==null&&b>=0&&(a===null||a>0)){eq=a?n*b/a:b;weighted=true;}}
    items.push({n,eq});
  }
  if(!weighted)return null;
  const raw=items.reduce((a,x)=>a+x.n,0),eqT=items.reduce((a,x)=>a+x.eq,0);
  if(!(raw>0&&eqT>0))return null;
  return {items,raw,eq:eqT};
}
const roundTotal=m=>{const md=roundModel(m);return md?md.raw:m.repsRound;};
/* reps en plus saisies en reps ÉQUIVALENTES (une ligne {10=1} : 250 m comptent pour 25 reps) <-> fraction de tour */
const eqTotal=m=>{const md=roundModel(m);return md?md.eq:m.repsRound;};
function fracOf(m,rp){return rp/eqTotal(m);}
function repsOf(m,frac){return Math.round(frac*eqTotal(m)*100)/100;}
/* anciennes versions, en reps réelles (anciens paliers du time cap) */
function repsOfRaw(m,frac){
  const md=roundModel(m);
  if(!md)return Math.round(frac*m.repsRound);
  let t=frac*md.eq,raw=0;
  for(const it of md.items){if(t>=it.eq-1e-6){raw+=it.n;t-=it.eq;}else{raw+=Math.round(t/it.eq*it.n);break;}}
  return raw;
}
function tagShow(s){
  const w=s.match(WTAG);if(!w)return s;
  const clean=s.replace(WTAG,'').trim(),lm=clean.match(/^(\d+)/);
  const b=parseNum(w[2]),a=w[1]?parseNum(w[1]):null;
  const eq=a?(lm&&a>0?+lm[1]*b/a:null):b;
  return clean+(eq!==null&&eq!==undefined?' · compte pour '+fmtN(eq)+' rep'+(eq>1?'s':''):'');
}

function roundsLabel(m,v){
  if(!(m&&m.repsRound>0))return fmtN(v)+' tours';
  const r=Math.floor(v+1e-9),rp=repsOf(m,v-r);
  return r+' tour'+(r>1?'s':'')+(rp?' + '+rp+' reps':'');
}
function scoreText(m,score,e){
  if(e&&e.cap)return 'Time cap · '+capLabel(m,capValue(m,e));
  if(score===undefined||score===null)return '';
  if(isDead(m))return 'Tenu '+fmtTime(score);
  if(m.format==='FT')return fmtTime(score);
  if(e&&e.rounds!==undefined&&!roundModel(m))return e.rounds+' tour'+(e.rounds>1?'s':'')+(e.reps?' + '+e.reps+' reps':'');
  return roundsLabel(m,score);
}

/* flamme toutes saisons confondues : la série continue de monter d'une saison à l'autre.
   Même règle qu'en saison : séances faites pendant la bonne semaine ; une semaine terminée où l'objectif
   de séances (celui de la saison de la semaine) est tenu, REDO compris, garde la flamme. */
function flameAll(lg){
  const t=todayStr(),weeks={};
  for(const w of Object.values(S.wods)){const k=mondayOf(w.date);(weeks[k]=weeks[k]||[]).push(w.date);}
  const onTime=(d,e)=>{if(!e.at)return true;const ds=dfmt(new Date(e.at)),mon=mondayOf(d);return ds>=mon&&ds<=addDays(mon,6);};
  const jk=new Set((lg.jokers&&lg.jokers.fire)||[]); /* jours de séance sauvés par un joker : la flamme ne s'éteint pas (la série des trophées, elle, n'en tient pas compte) */
  let cur=0,best=0,brk=null,extra=0;
  for(const mon of Object.keys(weeks).sort()){
    if(mon>t)break;
    const days=weeks[mon].slice().sort(),closed=addDays(mon,6)<t;
    const per=periodFor(days[0]),goal=(per&&lg.goals)?Number(lg.goals[per.id])||0:0;
    const okN=days.filter(d=>{const e=lg.entries&&lg.entries[d];return e&&onTime(d,e);}).length;
    const redoN=Object.values(lg.redos||{}).filter(x=>x.on>=mon&&x.on<=addDays(mon,6)).length;
    const kept=goal>0&&closed&&okN+redoN>=Math.min(goal,days.length);
    for(const d of days){
      const e=lg.entries&&lg.entries[d];
      if(e&&onTime(d,e)){cur++;best=Math.max(best,cur);brk=null;extra=0;}
      else if(!e&&!closed)continue;
      else if(kept)continue;
      else if(jk.has(d))continue;
      else{if(cur>0){brk={day:d,prev:cur};extra=0;}else if(brk)extra++;cur=0;}
    }
  }
  /* save : la flamme est à 0 à cause d'une seule séance ratée → un joker peut encore la sauver (2 séances ratées d'affilée : trop tard) */
  return {cur,best,save:(cur===0&&brk&&extra===0)?brk:null};
}
/* les metcons comptent dans l'ordre où l'athlète les a réellement faits (e.at = jour de validation), pas dans l'ordre des dates de séance :
   un metcon rattrapé plus tard passe donc après ceux déjà faits. Sans horodatage (anciennes entrées), on retombe sur la date de la séance. */
function topRun(lg,wods,useJoker){
  const lvMax=lv=>((lv&&lv.tiers)||[]).reduce((a,x)=>Math.max(a,x.p),0);
  const doneAt=(w,e)=>{const t=e&&e.at?Date.parse(e.at):NaN;return isNaN(t)?Date.parse(w.date+'T12:00:00'):t;};
  const list=[];
  for(const w of wods){
    const m=metconOf(w),e=lg.entries&&lg.entries[w.date];
    if(!m||!hasScore(e))continue;
    list.push({w,m,e,t:doneAt(w,e)});
  }
  list.sort((a,b)=>a.t-b.t||(a.w.date<b.w.date?-1:a.w.date>b.w.date?1:0));
  const jk=useJoker?new Set((lg.jokers&&lg.jokers.top)||[]):null; /* joker : seulement pour la flamme, jamais pour le trophée */
  let tc=0,tb=0,brk=null,extra=0;
  for(const {w,m,e} of list){
    const lvl=e.level||0,mx=lvMax(levelsOf(m)[lvl]||levelsOf(m)[0]);
    if(!(mx>0))continue;
    if(perfOf(m,e)>=0.9*mx-1e-9){tc++;tb=Math.max(tb,tc);brk=null;extra=0;}
    else if(jk&&jk.has(w.date))continue;
    else{if(tc>0){brk={day:w.date,prev:tc};extra=0;}else if(brk)extra++;tc=0;}
  }
  return {cur:tc,best:tb,save:(useJoker&&tc===0&&brk&&extra===0)?brk:null};
}
/* classement : points, puis niveau moyen (à points égaux, le niveau le plus haut passe devant) ; à points ET niveau égaux, ex æquo (même rang) */
const tot2=r=>Math.round((r.total||0)*100),lv2=r=>Math.round((r.lvlAvg||0)*100);
const tied=(a,b)=>tot2(a)===tot2(b)&&lv2(a)===lv2(b);
const rowCmp=(a,b)=>tot2(b)-tot2(a)||lv2(b)-lv2(a)||a.pseudo.localeCompare(b.pseudo);
function posList(list){const out=[];list.forEach((r,i)=>out.push(i>0&&tied(list[i-1],r)?out[i-1]:i+1));return out;}
const posOf=(list,r)=>{const i=list.indexOf(r);return i<0?0:posList(list)[i];};
function computeBoard(period){
  const allWods=Object.values(S.wods).sort((a,b)=>a.date<b.date?-1:1);
  const wods=Object.values(S.wods).filter(w=>inP(w.date,period)).sort((a,b)=>a.date<b.date?-1:1);
  const metconCount=wods.filter(metconOf).length;
  const catCount={cardio:0,gym:0,haltero:0};
  for(const w of wods){const m=metconOf(w);if(m&&catCount[m.focus]!==undefined)catCount[m.focus]++;}
  const weeks={};
  for(const w of wods){const k=mondayOf(w.date);(weeks[k]=weeks[k]||[]).push(w.date);}
  const t=todayStr(),done=periodState(period)==='done';
  const weekKeys=Object.keys(weeks).filter(k=>done||addDays(k,6)<t).sort();
  const rows=Object.entries(S.logs).map(([uid,lg])=>{
    const r={uid,pseudo:lg.pseudo||'Athlète',sessions:0,base:0,perf:0,perfN:0,strength:0,streak:0,lvlSum:0,lvlN:0,items:[],
      cat:{cardio:{sum:0,n:0},gym:{sum:0,n:0},haltero:{sum:0,n:0}}};
    const best={};let run=0;r.tonnage=0;
    for(const w of wods){
      const e=lg.entries&&lg.entries[w.date];
      if(!e){run=0;continue;}
      run++;r.streak=Math.max(r.streak,run);r.sessions++;
      const pts=wodPoints(w,e,period);r.base+=pts.base;r.perf+=pts.perf;
      const m=metconOf(w);
      if(m&&e.level!==undefined){r.lvlSum+=lvVal(e,m);r.lvlN++;}
      if(m&&hasScore(e)){r.perfN++;const c=r.cat[m.focus];if(c){c.sum+=pts.perf;c.n++;}}
      for(const p of w.parts||[]){
        if(p.kind==='force'&&p.movement&&e.loads&&e.loads[p.label]>0){const k=norm(p.movement.trim());best[k]=Math.max(best[k]||0,e.loads[p.label]);}
        /* tonnage = séries × reps × charge (sans la traction lestée) ; sans saisie de séries, on prend le schéma de la séance */
        if(p.kind==='force'&&p.movement&&!SIGNED.includes(p.movement)&&e.loads&&e.loads[p.label]>0&&!e.metconOnly){
          const sx=e.sets&&e.sets[p.label],sc=sx||forceSchema(p);
          if(sc&&sc.s>0&&sc.r>0)r.tonnage+=sc.s*sc.r*e.loads[p.label];
        }
      }
      r.items.push({w,e,pts});
    }
    r.redo=0;r.redoN=0;
    const redoWk=k=>Object.values(lg.redos||{}).filter(x=>x.on>=k&&x.on<=addDays(k,6)).length;
    for(const [wd,x] of Object.entries(lg.redos||{})){
      const rw=S.wods[wd],rm=rw&&metconOf(rw);
      if(!rm||!(lg.entries&&lg.entries[wd])||!inP(x.on,period))continue;
      const rp=redoPts(rm,lg.entries[wd],x);
      r.redo+=rp;r.redoN++;
      r.items.push({w:rw,e:x,pts:{base:0,perf:rp,total:rp},redo:true,on:x.on});
    }
    r.items.sort((a,b)=>(a.redo?a.on:a.w.date)<(b.redo?b.on:b.w.date)?-1:1);
    r.total=r.base+r.perf+r.redo;
    r.tonnage=Math.round(r.tonnage);
    r.strength=Object.values(best).reduce((a,b)=>a+b,0);
    /* poids / puissance : meilleures charges (hors traction lestée) divisées par le poids de corps */
    r.sex=lg.sex||'';
    r.ageCat=lg.ageCat||'';
    r.weight=(uid===S.uid&&Number(S.prof.weight)>0)?Number(S.prof.weight):0; /* le poids reste privé : seul le rapport charge ÷ poids est publié (logs/{uid}.ratios) */
    const relL=Object.entries(best).filter(([k])=>!SIGNED.some(s=>norm(s)===k));
    r.strengthRel=relL.reduce((a,x)=>a+x[1],0);r.ratioN=relL.length;
    r.ratio=(r.weight>0&&r.ratioN>0)?r.strengthRel/r.ratioN/r.weight:((lg.ratios&&Number(lg.ratios[period.id])>0)?Number(lg.ratios[period.id]):0);
    r.perfAvg=r.perfN?r.perf/r.perfN:0;
    r.lvlAvg=r.lvlN?r.lvlSum/r.lvlN:0;
    r.mult=r.lvlN?r.lvlAvg/LEVEL_DIV:1;
    /* seuls les points de metcon (score + REDO) sont pondérés par le niveau, pas les points de séance */
    r.weighted=Math.round((r.base+(r.perf+r.redo)*r.mult)*10)/10;
    r.perfAvgW=r.perfAvg*r.mult;
    /* série en cours : séances faites pendant la bonne semaine (lundi → dimanche de la séance).
       Une séance de la semaine encore ouverte, pas encore faite, ne casse pas la série.
       Si l'athlète a un objectif de séances par semaine inférieur au nombre de séances proposées,
       une semaine terminée où il a fait son nombre prévu (REDO compris) garde sa flamme :
       les séances non faites de cette semaine ne remettent pas la série à zéro. */
    {
      const onTime=(d,e)=>{if(!e.at)return true;const ds=dfmt(new Date(e.at)),mon=mondayOf(d);return ds>=mon&&ds<=addDays(mon,6);};
      const goalS=lg.goals?Number(lg.goals[period.id])||0:0;
      let cur=0,curBest=0;
      for(const mon of Object.keys(weeks).sort()){
        if(mon>t)break;
        const days=weeks[mon].slice().sort(),closed=addDays(mon,6)<t;
        const okN=days.filter(d=>{const e=lg.entries&&lg.entries[d];return e&&onTime(d,e);}).length;
        const need=goalS>0?Math.min(goalS,days.length):days.length;
        const kept=goalS>0&&closed&&okN+redoWk(mon)>=need;
        for(const d of days){
          const e=lg.entries&&lg.entries[d];
          if(e&&onTime(d,e)){cur++;curBest=Math.max(curBest,cur);}
          else if(!e&&!closed)continue;
          else if(kept)continue;
          else cur=0;
        }
      }
      r.cur=cur;r.curBest=curBest;
    }
    {const fa=flameAll(lg);r.flameCur=fa.cur;r.flameBest=fa.best;}
    /* temps au top : metcons d'affilée à 90 % ou plus des points max du niveau choisi.
       Seul un score saisi sous 90 % remet à zéro ; séance sans metcon ou sans score = neutre. */
    {
      /* topRun sur la saison : sert au trophée « Top niveau » (plus longue série de la saison seulement) ;
         topRun sur toutes les séances : sert à la flamme « Temps au top », qui ne se réinitialise pas entre les saisons */
      const ts=topRun(lg,wods),ta=topRun(lg,allWods,true);
      r.topCur=ts.cur;r.topBest=ts.best;
      r.flameTopCur=ta.cur;r.flameTopBest=ta.best;
    }
    const goal=lg.goals?Number(lg.goals[period.id]):0;
    r.goal=goal>0?goal:0;
    /* trophées Solo / Duo gagnant : on ne garde que les meilleures séances, à raison de « objectif » séances par semaine de la saison
       (objectif 1 sur 7 semaines = 7 meilleures séances), pondérées par le niveau moyen comme le GOAT. Faire plus de séances que prévu n'est jamais pénalisé. */
    {
      const byDate={};
      for(const it of r.items){const d=it.w.date;byDate[d]=(byDate[d]||0)+(it.pts.base||0)+((it.pts.perf||0)*r.mult);}
      const vals=Object.values(byDate).sort((a,b)=>b-a);
      const nW=Object.keys(weeks).filter(k=>k<=t).length;
      r.goalK=r.goal*nW;
      r.goalN=Math.min(r.goalK,vals.length);
      r.goalPts=Math.round(vals.slice(0,r.goalK).reduce((a,b)=>a+b,0)*10)/10;
    }
    const currentWeek=mondayOf(t),currentDays=weeks[currentWeek]||[];
    /* Le trophée reste actif uniquement tant que l'objectif de la semaine en cours est atteint. */
    r.goalMet=r.goal>0&&currentDays.length>0&&currentDays.filter(d=>lg.entries&&lg.entries[d]).length+redoWk(currentWeek)>=Math.min(r.goal,currentDays.length);
    return r;
  });
  rows.sort(rowCmp);
  return {rows,wods,metconCount,catCount,weekKeys,period};
}

 {id:'objectif',name:'Objectif tenu',desc:'Avoir tenu son nombre de séances par semaine, chaque semaine de la saison.',custom:b=>b.rows.filter(r=>r.goalMet),show:r=>r.goal+' séance'+(r.goal>1?'s':'')+' par semaine'}
];
/* Seuil de participants : un trophée « de catégorie » (cat:true) n'est décerné que si la saison a un seuil (per.minElig)
   et qu'il y a au moins ce nombre d'athlètes éligibles actifs dans le groupe. Les saisons sans per.minElig (dont la Bêta, verrouillée)
   n'ont aucun seuil : la règle n'est jamais rétroactive. Les nouvelles saisons reçoivent MIN_ELIGIBLE par défaut (modifiable à la création). */
const MIN_ELIGIBLE=3;
/* seuil effectif : valeur explicite de la saison si elle existe (0 = pas de seuil, choisi par le coach) ;
   saison sans valeur enregistree (creee avant l'ajout du seuil) = seuil par defaut, sauf saisons verrouillees ou Alpha/Beta (resultats deja figes) */
const minEligOf=per=>{
  if(!per)return 0;
  if(per.minElig!==undefined&&per.minElig!==null&&per.minElig!=='')return Math.max(0,Number(per.minElig)||0);
  if(per.locked||/alpha|beta/.test(norm(per.name||'')))return 0;
  return MIN_ELIGIBLE;
};
function eligCount(t,board){return board.rows.filter(r=>r.sessions>0&&(!t.elig||t.elig(r,board))).length;}
/* nombre d'éligibles quand le seuil bloque le trophée, sinon 0 */
function trophyShort(t,board,gid){
  if(!t.cat)return 0;
  const min=minEligOf(board.period);if(!min)return 0;
  if(gid!==undefined)board=Object.assign({},board,{rows:board.rows.filter(r=>inScope(r.uid,gid,board.period))});
  const n=eligCount(t,board);return n>0&&n<min?n:0;
}
function winners(t,board,gid){
  if(gid!==undefined)board=Object.assign({},board,{rows:board.rows.filter(r=>inScope(r.uid,gid,board.period))});
  if(t.custom)return t.custom(board).filter(r=>r.sessions>0);
  {const min=t.cat?minEligOf(board.period):0;if(min&&eligCount(t,board)<min)return [];}
  const pool=board.rows.filter(r=>r.sessions>0&&(!t.elig||t.elig(r,board))&&t.key(r)[0]>0);
  if(!pool.length)return [];
  pool.sort((a,b)=>cmpKey(t.key(b),t.key(a)));
  const top=t.key(pool[0]);
  return pool.filter(r=>cmpKey(t.key(r),top)===0);
}

/* ---------- pourcentages et PR (parties force) ---------- */
function prFor(name){const e=S.prof.prs||{};for(const k of Object.keys(e)){if(norm(k)===norm(name))return e[k];}return null;}
function findMove(text){
  const t=norm(text);const list=[];
  for(const [c,al] of MOVES)for(const a of al)list.push([c,a]);
  for(const k of Object.keys(S.prof.prs||{}))list.push([k,norm(k)]);
  list.sort((x,y)=>y[1].length-x[1].length);
  for(const [c,a] of list){
    const re=new RegExp('(^|[^a-z0-9])'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])');
    if(re.test(t))return c;
  }
  return null;
}
const PU_STEP=0.5;
function pullupCalc(bw,rm,pct){
  /* charge totale du 1 RM = poids de corps + lest (négatif = déleste) ; lest conseillé = charge totale × % − poids de corps.
     Un résultat négatif est un déleste (assistance), pas « sans lest ». */
  const total1=bw+rm,target=total1*pct/100,lest=target-bw,r=Math.round(lest/PU_STEP)*PU_STEP,rounded=r===0?0:r;
  return {total1,target,lest,rounded};
}
function pullupBlock(text,nums){
  const bw=parseNum(S.prof&&S.prof.weight);
  const pr=prFor('Traction lestée');
  if(!(bw>0))return h('div',{class:'chips'},h('span',{class:'chip miss'},'Renseigne ton poids de corps dans ton profil pour calculer le lest'));
  if(!pr||!isFinite(pr.kg))return h('div',{class:'chips'},h('span',{class:'chip miss'},'Enregistre ton 1 RM de Traction lestée dans ton profil'));
  /* lest = (poids de corps + 1 RM lesté) × % − poids de corps ; affichage : seulement le lest conseillé, comme les autres mouvements de force */
  return h('div',{class:'chips'},nums.map(n=>{const c=pullupCalc(bw,pr.kg,n);
    return h('span',{class:'chip load'},n+' % = '+(c.rounded>0?'lest +'+fmtN(c.rounded)+' kg':c.rounded<0?'déleste −'+fmtN(-c.rounded)+' kg':'sans lest'));}));
}
function renderLine(text){
  const line=h('div',{class:'line'},h('span',{},glossSegs(text)));
  const m=text.match(PCT_RE);
  if(m){
    const nums=m[1].split(/\s*[\/–-]\s*/).map(Number).filter(n=>n>0&&n<=200);
    const canon=findMove(text);
    if(canon&&nums.length){
      if(SIGNED.includes(canon)){line.append(pullupBlock(text,nums));return line;}
      const pr=prFor(canon);
      if(!(pr&&pr.kg<=0))line.append(pr?h('div',{class:'chips'},nums.map(n=>h('span',{class:'chip load'},n+' % = '+fmtKg(pr.kg*n/100))))
                    :h('div',{class:'chips'},h('span',{class:'chip miss'},'Renseigne ton PR de '+canon+' dans ton profil')));
    }
  }
  return line;
}
/* charge prévue d'une partie force : la plus lourde des charges calculées par les pourcentages des lignes (même calcul que dans la séance).
   null si rien n'est calculable (pas de %, PR ou poids de corps manquant). */
/* séries × reps prévues par la séance (ex. « 5 x 5 Back Squat à 75 % ») : préremplissent le formulaire, modifiables */
function forceSchema(p){
  if(!p||p.kind!=='force')return null;
  const re=/(\d{1,2})\s*(?:x|×|\*)\s*(?:(\d{1,3})(?!\d)|max\b)/i;let first=null; /* « 1 x max » : 1 série, reps libres (r = null) */
  for(const raw of String(p.content||'').split('\n')){
    const m=raw.match(re);if(!m)continue;
    const o={s:+m[1],r:m[2]?+m[2]:null};
    const canon=findMove(raw);
    if(p.movement&&canon===p.movement)return o;
    if(!first)first=o;
  }
  return first;
}
function forceDefault(p){
  if(!p||p.kind!=='force')return null;
  const bw=parseNum(S.prof&&S.prof.weight),cands=[];
  for(const raw of String(p.content||'').split('\n')){
    const text=raw.trim();if(!text)continue;
    const m=text.match(PCT_RE);if(!m)continue;
    const canon=findMove(text);if(!canon)continue;
    const pr=prFor(canon);if(!pr||!isFinite(pr.kg))continue;
    const nums=m[1].split(/\s*[\/–-]\s*/).map(Number).filter(n=>n>0&&n<=200);
    for(const n of nums){
      let v;
      if(SIGNED.includes(canon)){if(!(bw>0))continue;v=pullupCalc(bw,pr.kg,n).rounded;}
      else{if(!(pr.kg>0))continue;v=Math.round(pr.kg*n/100*2)/2;}
      cands.push({canon,v});
    }
  }
  const mine=p.movement?cands.filter(c=>c.canon===p.movement):[];
  const use=mine.length?mine:cands;
  return use.length?Math.max(...use.map(c=>c.v)):null;
}
const plainLine=text=>h('div',{class:'line'},glossSegs(text));
const metLine=text=>plainLine(tagShow(text));

function glossSegs(text){
  const t=norm(text);
  if(t.length!==text.length)return [text];
  const hits=[],cand=[];
  for(const [al,gi] of GLOSS_AL){
    for(let i=t.indexOf(al);i>=0;i=t.indexOf(al,i+1)){
      const e=i+al.length;
      if(/^rowing?s?$|^rows?$/.test(al)&&(/(ring|pendlay|barbell|bent over|bent-over|dumbbell|db|kb|inverted|renegade|seal|trx|upright|cable)\s+$/.test(t.slice(0,i))||/^\s*(rings?|trx)\b/.test(t.slice(e))))continue; /* Ring Row, Pendlay Row… ne sont pas le rameur */
      if((i===0||!/[a-z0-9]/.test(t[i-1]))&&(e>=t.length||!/[a-z0-9]/.test(t[e])))cand.push({s:i,e,g:gi});
    }
  }
  cand.sort((a,b)=>(b.e-b.s)-(a.e-a.s)||a.s-b.s); /* le plus long alias gagne */
  for(const x of cand)if(!hits.some(y=>x.s<y.e&&x.e>y.s))hits.push(x);
  hits.sort((a,b)=>a.s-b.s);
  const out=[];let c=0;
  for(const x of hits){
    if(x.s>c)out.push(text.slice(c,x.s));
    out.push(h('button',{type:'button',class:'mv',onclick:()=>openGloss(x.g)},text.slice(x.s,x.e)));
    c=x.e;
  }
  if(c<text.length)out.push(text.slice(c));
  return out;
}

/* vidéo du mouvement (7e élément de l'entrée GLOSS) : plein écran, lue en boucle dès l'ouverture */
function openMoveVideo(g){

  const esc=e=>{if(e.key==='Escape'){e.stopPropagation();close();}};

    try{if(document.fullscreenElement)document.exitFullscreen();}catch(x){}

  document.addEventListener('keydown',esc,true);
  try{const r=ov.requestFullscreen&&ov.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}catch(x){}
  vid.play().catch(()=>{});
}

/* ---------- écritures ---------- */
let chain=Promise.resolve();
function run(fn){chain=chain.then(fn).catch(e=>{toast(errMsg(e),true);});return chain;}
const saveProf=()=>run(async()=>{await S.db.doc('users/'+S.uid+'/private/profile').set({prs:S.prof.prs||{},sex:S.prof.sex||'',birth:S.prof.birth||'',genEx:S.prof.genEx||null,genAll:S.prof.genAll||null,words:S.prof.words||[],mvcfg:S.prof.mvcfg||{},revd:S.prof.revd||{},intf:S.prof.intf||{},pace:S.prof.pace||{},spread:S.prof.spread||{},weight:Number(S.prof.weight)>0?Number(S.prof.weight):0});});
const needPseudo=()=>S.uid&&S.loaded.logs&&!(S.logs[S.uid]&&S.logs[S.uid].pseudo);
/* groupes : un seul document config/groups {list:[{id,name}], of:{uid:idDuGroupe}}, écrit par le coach seul */
const groupsList=()=>(S.groups&&S.groups.list)||[];
const groupOf=uid=>(S.groups&&S.groups.of&&S.groups.of[uid])||'';
const groupName=id=>{const g=groupsList().find(x=>x.id===id);return g?g.name:'';};
const grpTxt=uid=>{const n=groupName(groupOf(uid));return n?' · '+n:'';};
/* trophées et badges par groupe : '' = athlètes sans groupe (ou tout le monde si aucun groupe n'existe).
   Une saison terminée utilise les groupes figés à sa fin (config/groups.snap[periodId]) ; sinon les groupes actuels. */
const snapOf=per=>{const sn=per&&!per.virtual&&S.groups&&S.groups.snap&&S.groups.snap[per.id];return sn&&periodState(per)==='done'?sn:null;};
const gListFor=per=>{const sn=snapOf(per);return sn?sn.list:groupsList();};
const gOfFor=(uid,per)=>{const sn=snapOf(per);return sn?((sn.of&&sn.of[uid])||''):groupOf(uid);};
const scopeOf=(uid,per)=>{const g=gOfFor(uid,per);return gListFor(per).some(x=>x.id===g)?g:'';};
const inScope=(uid,gid,per)=>!gListFor(per).length||scopeOf(uid,per)===gid;
const scopeName=(gid,per)=>{const l=gListFor(per);if(!l.length)return '';if(!gid)return 'Sans groupe';const g=l.find(x=>x.id===gid);return g?g.name:'';};
function scopeIds(per){
  const l=gListFor(per);
  if(!l.length)return [''];
  const ids=l.map(g=>g.id);
  if(Object.keys(S.logs).some(u=>!scopeOf(u,per)))ids.push('');
  return ids;
}
/* fige les groupes de chaque saison terminée qui n'a pas encore de photo */
function freezeSnap(){
  const snap=Object.assign({},(S.groups&&S.groups.snap)||{});let ch=false;
  for(const per of plist()){
    if(periodState(per)!=='done'||snap[per.id])continue;
    snap[per.id]={list:groupsList().map(g=>({id:g.id,name:g.name})),of:Object.assign({},(S.groups&&S.groups.of)||{})};ch=true;
  }
  return ch?snap:null;
}
function maybeFreeze(){
  if(!S.owner||!ready()||!S.groups||!S.groups.loaded||S._freezing)return;
  const snap=freezeSnap();if(!snap)return;
  S._freezing=true;
  S.db.doc('config/groups').set({list:groupsList(),of:S.groups.of||{},snap}).catch(()=>{S._freezing=false;});
}
const saveGroups=(list,of,msg)=>run(async()=>{const snap=freezeSnap()||(S.groups&&S.groups.snap)||{};await S.db.doc('config/groups').set({list,of,snap});if(msg)toast(msg);});
/* Poids de corps privé : il vit dans users/{uid}/private/profile. Chaque athlète publie seulement son rapport charge ÷ poids, par saison
   (logs/{uid}.ratios), que les autres lisent pour le classement « Poids / puissance ». Comme le coach peut corriger des résultats sans connaître
   le poids, l'athlète recalcule et republie son rapport à l'ouverture de l'appli si besoin. Cette fonction migre aussi l'ancien poids public. */
function myRatios(){
  const out={};
  if(!S.uid||!(Number(S.prof.weight)>0))return out;
  for(const p of [...Object.values(S.periods),ALL]){
    const row=computeBoard(p).rows.find(r=>r.uid===S.uid);
    if(row&&row.weight>0&&row.ratio>0)out[p.id]=Math.round(row.ratio*100)/100;
  }
  return out;
}
function selfSync(){
  clearTimeout(S._sst);
  S._sst=setTimeout(async()=>{
    if(S._sy||!S.uid||!S.db||!ready()||!S.profLoaded)return;
    const lg=S.logs[S.uid];if(!lg)return;
    S._sy=true;
    try{
      if(Number(lg.weight)>0){ /* ancien poids public : copié dans le profil privé, puis retiré du journal */
        if(!(Number(S.prof.weight)>0))S.prof.weight=Number(lg.weight);
        await saveProf();await saveLog({});
        return;
      }
      const mine=myRatios(),pub=lg.ratios||{};
      let diff=false;
      for(const k of new Set([...Object.keys(mine),...Object.keys(pub)])){if(Math.abs((mine[k]||0)-(Number(pub[k])||0))>0.004){diff=true;break;}}
      if(diff)await saveLog({ratios:mine});
    }catch(e){}finally{S._sy=false;}
  },1500);
}
/* uid facultatif : le coach peut écrire dans le journal d'un autre athlète (règles Firestore à adapter, voir README) */
function saveLog(patch,msg,uid){
  uid=uid||S.uid;
  return run(async()=>{
    const cur=S.logs[uid]||{};
    const data={
      pseudo:patch.pseudo!==undefined?patch.pseudo:(cur.pseudo||''),
      entries:patch.entries||cur.entries||{},
      goals:patch.goals||cur.goals||{}
    };
    const rd=patch.redos||cur.redos;
    if(rd&&Object.keys(rd).length)data.redos=rd;
    const rt=patch.ratios!==undefined?patch.ratios:cur.ratios;
    if(rt&&Object.keys(rt).length)data.ratios=rt; /* rapport charge ÷ poids par saison (le poids, lui, est privé) */
    const sx=patch.sex!==undefined?patch.sex:(cur.sex||(uid===S.uid?S.prof.sex:'')||'');
    if(sx)data.sex=sx;
    const ac=patch.ageCat!==undefined?patch.ageCat:(cur.ageCat||'');
    if(ac)data.ageCat=ac;
    const bd=patch.badge!==undefined?patch.badge:cur.badge;
    if(bd)data.badge=bd;
    const av=patch.avatar!==undefined?patch.avatar:cur.avatar;
    if(av&&Object.keys(av).length)data.avatar=av;
    const bn=patch.banner!==undefined?patch.banner:cur.banner;
    if(bn&&Object.keys(bn).length)data.banner=bn;
    const annS=patch.annSeen!==undefined?patch.annSeen:cur.annSeen;
    if(Array.isArray(annS)&&annS.length)data.annSeen=annS;
    const seen=patch.rewardSeen!==undefined?patch.rewardSeen:cur.rewardSeen;
    if(Array.isArray(seen))data.rewardSeen=seen;
    const owned=patch.rewardOwned!==undefined?patch.rewardOwned:cur.rewardOwned;
    if(Array.isArray(owned))data.rewardOwned=owned;
    const avS=patch.avSeen!==undefined?patch.avSeen:cur.avSeen;
    if(Array.isArray(avS))data.avSeen=avS;
    const jkr=patch.jokers!==undefined?patch.jokers:cur.jokers;
    if(jkr&&((jkr.fire&&jkr.fire.length)||(jkr.top&&jkr.top.length)))data.jokers={fire:jkr.fire||[],top:jkr.top||[]};
    await S.db.doc('logs/'+uid).set(data);
    // Keep the local log synchronized so the reward popup does not reopen.
    S.logs[uid]=Object.assign({},cur,data);delete S.logs[uid].weight;
    if(msg)toast(msg);
    // Rafraîchir immédiatement la bannière après changement d'équipement.
    if(uid===S.uid)render();
  });
}

/* ---------- message du coach (enveloppe) ----------
   Document unique config/announcement = {id, title, text, at, active, notify}. notify:true = une notification push part pour ce message (tâche GitHub Actions, une seule fois par id). Un nouveau message a un nouvel id.
   « Vu » enregistre l'id dans logs/{uid}.annSeen (et dans le navigateur par sécurité) : le message ne revient jamais.
   L'enveloppe s'ouvre seulement au lancement de l'appli (jamais en direct, jamais pendant le minuteur) ;
   la lettre du fil permet de le relire. */
const annKey=()=>'bs-ann-'+S.uid;
/* adresses http(s):// ou www. d'un message du coach : cliquables (ouvertes dans un nouvel onglet) ; le reste reste du texte brut */
function linkText(text){
  const out=[],re=/(?:https?:\/\/|www\.)[^\s<>"']+|\b(?:[a-z0-9-]+\.)+(?:com|fr|org|net|io|dev|app|be|ch|ca|eu|info|me|co|uk|de|es|it|tv|pages\.dev)\b(?:\/[^\s<>"']*)?/gi;let last=0,m;
  const s=String(text||'');
  while((m=re.exec(s))){
    if(m.index>0&&s[m.index-1]==='@')continue;
    let url=m[0],tail='';
    const t=url.match(/[.,;:!?)\]]+$/);if(t){tail=t[0];url=url.slice(0,-tail.length);}
    if(m.index>last)out.push(s.slice(last,m.index));
    out.push(h('a',{href:/^https?:\/\//i.test(url)?url:'https://'+url,target:'_blank',rel:'noopener noreferrer',style:'text-decoration:underline;overflow-wrap:anywhere'},url));
    if(tail)out.push(tail);
    last=m.index+m[0].length;
  }
  if(last<s.length)out.push(s.slice(last));
  return out;
}
function annIsSeen(a){
  if(!a)return true;
  if(((S.logs[S.uid]||{}).annSeen||[]).includes(a.id))return true;
  try{return JSON.parse(localStorage.getItem(annKey())||'[]').includes(a.id);}catch(e){return false;}

   nouvelle séance (à tous les athlètes sauf le coach), message du coach (config/announcement, notify:true, à tous les athlètes sauf le coach) et réaction reçue (au destinataire seulement). */
const VAPID_PUBLIC='BDA1Z_RZ-siu2ygyWOGTzbVpPu-m-OIok7gxoZt9ZrJcXfzcfc_-Wp0c9G5t-P3-CgbuOsygEofEldWU7SWdNwg';

let lastCheck=0;
async function checkVersion(force){
  if(!/^https?:$/.test(location.protocol))return;
  if(force!==true&&Date.now()-lastCheck<30000)return;
  lastCheck=Date.now();
  try{
    const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok){lastCheck=0;return;}
    const m=(await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(m&&m[1]!==APP_VERSION&&S.newVersion!==m[1]){S.newVersion=m[1];scheduleRender();}
  }catch(e){lastCheck=0;}
}
async function applyUpdate(){
  try{
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>{const u=(x.active||x.waiting||x.installing||{}).scriptURL||'';return /push-sw\.js$/.test(u)?x.update():x.unregister();}));} /* on garde le service worker des notifications : le désinscrire supprimerait l'abonnement */
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>!/^boxscore-/.test(k)).map(k=>caches.delete(k)));} /* on garde le cache hors ligne (boxscore-*) : il se met à jour tout seul */
  }catch(e){}
  /* on récupère la dernière version directement (sans cache) et on remplace la page ; sinon rechargement classique */
  try{
    const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});
    if(r.ok){
      const t=await r.text(),m=t.match(/APP_VERSION\s*=\s*'([^']+)'/);

}

function fireworks(host){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return null;
  const cv=document.createElement('canvas'),dpr=window.devicePixelRatio||1,W=host.clientWidth,H=host.clientHeight;
  cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2';
  cv.width=W*dpr;cv.height=H*dpr;host.append(cv);
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const ps=[],cols=['#FF5A36','#F4C400','#4D86FF','#3DDC84','#FFFFFF','#FF6FB5'];
  let stop=false,t0=0,last=0,nextB=0;
  const burst=()=>{const x=W*(.15+Math.random()*.7),y=H*(.12+Math.random()*.35),c=cols[Math.floor(Math.random()*cols.length)];
    for(let k=0;k<46;k++){const a=Math.PI*2*k/46+Math.random()*.2,v=1.5+Math.random()*3.2;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c});}};
  const loop=now=>{
    if(stop)return;
    const dt=Math.min(32,now-last)/16.7,el=now-t0;last=now;
    if(el>=nextB&&el<3600){burst();nextB=el+350+Math.random()*350;}
    g.clearRect(0,0,W,H);
    for(let k=ps.length-1;k>=0;k--){
      const q=ps[k];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.045*dt;q.vx*=.99;q.l-=.011*dt;
      if(q.l<=0){ps.splice(k,1);continue;}
      g.globalAlpha=q.l;g.fillStyle=q.c;g.beginPath();g.arc(q.x,q.y,2.2,0,6.283);g.fill();
    }
    if(el>3600&&!ps.length){cv.remove();return;}
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(t=>{t0=t;last=t;loop(t);});
  return ()=>{stop=true;cv.remove();};
}

function wuClean(x,i){
  x=x||{};

  t=Math.min(t,mode==='time'?3600:500);
  return {id:String(x.id||'wu-'+i).slice(0,40),name:String(x.name||'Exercice').slice(0,60),desc:String(x.desc||'').slice(0,300),
    steps:Array.isArray(x.steps)?x.steps.map(s=>String(s).slice(0,200)).filter(s=>s.trim()).slice(0,12):[],
    mode,target:t,perSide:mode==='reps'&&!!x.perSide,note:String(x.note||'').slice(0,160)};
}
const wuItems=()=>{const l=S.wu&&S.wu.cfg&&Array.isArray(S.wu.cfg.items)?S.wu.cfg.items:WU_DEFAULT;return l.slice(0,WU_MAX).map(wuClean);};
const wuObj=x=>x.mode==='time'?x.target+' s':x.target+' rép.'+(x.perSide?'/côté':'');
const wuObjFull=x=>x.mode==='time'?x.target+' secondes':x.target+' répétition'+(x.target>1?'s':'')+(x.perSide?' par côté ('+x.target*2+' au total)':'');

function wuArmed(btn,txt,fn){let t=null;const orig=btn.textContent;return ()=>{if(t){clearTimeout(t);t=null;btn.textContent=orig;fn();return;}btn.textContent=txt;t=setTimeout(()=>{t=null;btn.textContent=orig;},3000);};}
/* première utilisation : le coach crée la configuration, une seule fois (jamais si elle existe déjà) */
