          ?h('button',{class:'btn sm danger',onclick:()=>removeSession(date,uid)},'Confirmer')
          :h('button',{class:'btn sm danger',onclick:()=>{S.confirm=key;render();}},'Retirer')):null));
  })));
  return sec;
}
/* groupes : le coach crée des groupes et place chaque athlète dans le sien (les séances restent les mêmes pour tous) */
function groupsCard(){
  const list=groupsList(),of=Object.assign({},(S.groups&&S.groups.of)||{});
  const sec=h('section',{class:'card'},h('h2',{class:'h2'},'Groupes'),
    h('p',{class:'muted'},'Crée tes groupes puis place chaque athlète dans le sien. Les séances restent les mêmes pour tous les groupes : le groupe sert à filtrer les classements.'));
  const nameIn=h('input',{id:'grp-new',type:'text',maxlength:'30',placeholder:'Lundi 18h'});
  sec.append(h('form',{class:'row',onsubmit:e=>{
      e.preventDefault();const n=nameIn.value.trim();
      if(!n){toast('Donne un nom au groupe',true);return;}
      if(list.some(x=>norm(x.name)===norm(n))){toast('Ce groupe existe déjà',true);return;}
      saveGroups(list.concat([{id:'g'+Date.now().toString(36),name:n}]),of,'Groupe créé');nameIn.value='';}},
    h('div',{style:'flex:1;min-width:160px'},field('Nouveau groupe',nameIn)),
    h('button',{class:'btn primary',type:'submit'},'Ajouter')));
  const members=id=>Object.values(of).filter(x=>x===id).length;
  if(list.length)sec.append(h('ul',{class:'list'},list.map(x=>h('li',{},
    h('div',{class:'l',style:'flex:1'},
      h('input',{type:'text',maxlength:'30',value:x.name,'aria-label':'Nom du groupe',onchange:e=>{
        const n=e.target.value.trim();if(!n){render();return;}
        saveGroups(list.map(y=>y.id===x.id?{id:y.id,name:n}:y),of,'Groupe renommé');}}),
      h('div',{class:'sub'},members(x.id)+' athlète'+(members(x.id)>1?'s':''))),
    S.confirm==='grp-'+x.id
      ?h('button',{class:'btn sm danger',type:'button',onclick:()=>{S.confirm=null;const o={};for(const [u,g] of Object.entries(of))if(g!==x.id)o[u]=g;saveGroups(list.filter(y=>y.id!==x.id),o,'Groupe supprimé');}},'Confirmer')
      :h('button',{class:'btn sm danger',type:'button',onclick:()=>{S.confirm='grp-'+x.id;render();}},'Supprimer')))));
  else sec.append(h('p',{class:'muted'},'Aucun groupe pour l’instant.'));
  /* athlètes */
  const ath=Object.entries(S.logs).filter(([u,l])=>l&&l.pseudo).map(([uid,l])=>({uid,pseudo:l.pseudo})).sort((a,b)=>a.pseudo.localeCompare(b.pseudo));
  const gf=S.coach.gf||'all';
  const shown=ath.filter(a=>gf==='all'||(gf==='none'?!groupName(of[a.uid]):of[a.uid]===gf));
  const none=ath.filter(a=>!groupName(of[a.uid])).length;
  if(list.length&&ath.length){
    sec.append(h('div',{class:'flabel'},'Placer les athlètes'),
      field('Afficher',sel([['all','Tous les athlètes'],['none','Sans groupe ('+none+')']].concat(list.map(x=>[x.id,x.name])),gf,v=>{S.coach.gf=v;render();},{id:'grp-filter'})),
      shown.length?h('ul',{class:'list'},shown.map(a=>h('li',{},
        h('div',{class:'l',style:'flex:1'},h('div',{class:'nm'},a.pseudo+(a.uid===S.uid?' (toi)':''))),
        h('div',{style:'min-width:150px'},sel([['','Aucun groupe']].concat(list.map(x=>[x.id,x.name])),groupName(of[a.uid])?of[a.uid]:'',v=>{
          const o=Object.assign({},of);if(v)o[a.uid]=v;else delete o[a.uid];
          saveGroups(list,o);},{'aria-label':'Groupe de '+a.pseudo,id:'grp-'+a.uid}))))):h('p',{class:'muted'},'Personne dans cette liste.'));
  }else if(list.length)sec.append(h('p',{class:'muted'},'Les athlètes apparaîtront ici dès qu’ils auront choisi leur pseudo.'));
  return sec;
}
function nextSeasonNum(){const l=plist();return String(l.reduce((m,p)=>Math.max(m,seasonNum(p)),0)+1);}
function avPick(d){
  const items=AV_ITEMS.filter(x=>!avOff(x)),on=new Set((d.av||[]).filter(id=>AV_BY[id])),boxes=[];
  const cnt=h('p',{class:'hint'});
  const upd=()=>{d.av=[...on];cnt.textContent=on.size+' objet'+(on.size>1?'s':'')+' gagnable'+(on.size>1?'s':'')+' sur '+items.length+(on.size?'':' : aucun objet ne pourra être gagné cette saison');};
  const all=v=>()=>{boxes.forEach(([id,cb])=>{cb.checked=v;v?on.add(id):on.delete(id);});upd();};
  upd();
  return h('div',{class:'stack'},h('div',{class:'flabel'},'Objets d’avatar gagnables cette saison'),
    h('p',{class:'hint'},'Seuls les objets cochés peuvent être débloqués sur cette saison. Rien de coché : aucun objet. Les athlètes voient les conditions via le ? de l’inventaire.'),
    h('div',{class:'row'},h('button',{class:'btn sm',type:'button',onclick:all(true)},'Tout cocher'),h('button',{class:'btn sm',type:'button',onclick:all(false)},'Tout décocher')),
    AV_SLOTS.filter(([k])=>!AV_OFF.has(k)).map(([k,l])=>h('div',{},h('div',{class:'flabel'},l),
      items.filter(x=>x.slot===k).map(x=>{const cb=h('input',{type:'checkbox',checked:on.has(x.id),'aria-label':x.name,onchange:e=>{e.target.checked?on.add(x.id):on.delete(x.id);upd();}});boxes.push([x.id,cb]);
        const all=plist(),n=all.filter(p=>(p.avItems||[]).includes(x.id)).length;
        const tip=h('div',{class:'tip',style:'display:none',role:'note'},
          h('div',{},h('span',{class:'flabel',style:'color:var(--panel-muted)'},'Condition pour le remporter'),h('div',{},AV_OBJ[x.id].d)),
          h('div',{class:'sub'},'Gagnable sur '+n+' saison'+(n>1?'s':'')+' sur '+all.length+' programmée'+(all.length>1?'s':'')+'.'));
        const q=h('button',{type:'button',class:'qbtn','aria-label':'Conditions pour '+x.name,'aria-expanded':'false',onclick:()=>{const o=tip.style.display==='none';tip.style.display=o?'grid':'none';q.setAttribute('aria-expanded',o?'true':'false');}},'?');
        return h('div',{},h('div',{style:'display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)'},h('label',{class:'chk',style:'flex:1;min-width:0;border-bottom:0'},cb,h('span',{style:'min-width:0;overflow-wrap:anywhere'},x.name)),q),tip);}))),cnt);
}
function periodEditor(){
  if(!S.coach.period)S.coach.period={id:null,num:nextSeasonNum(),name:'',start:todayStr(),end:'',base:'10',av:[]};
  const d=S.coach.period;
  return h('section',{class:'card'},h('h2',{class:'h2'},d.id?'Modifier la saison':'Programmer une saison'),
    h('p',{class:'muted'},'Le classement et les trophées se calculent entre la date de début et la date de fin. Chaque trophée reçoit le numéro de la saison.'),
    h('div',{class:'grid2'},
      field('Numéro de saison',tin(d,'num',{id:'per-num',inputmode:'numeric'})),
      field('Nom',tin(d,'name',{id:'per-name',placeholder:'Cycle octobre'})),
      field('Début',h('input',{id:'per-start',type:'date',value:d.start,oninput:e=>{d.start=e.target.value;}})),
      field('Fin',h('input',{id:'per-end',type:'date',value:d.end,oninput:e=>{d.end=e.target.value;}})),
      field('Points par séance (par défaut)',tin(d,'base',{id:'per-base',inputmode:'numeric'}),'Chaque séance peut avoir ses propres points.')),
    avPick(d),
    h('div',{class:'row'},
      h('button',{class:'btn primary',type:'button',onclick:async()=>{
        const b=parseNum(d.base),n=parseInt(d.num,10);
        if(!d.name.trim()||!d.start||!d.end||b===null||b<0||!(n>=1)){toast('Renseigne le numéro, le nom, les deux dates et les points.',true);return;}
        if(d.end<d.start){toast('La fin doit être après le début.',true);return;}
        const col=S.db.collection('periods');const ref=d.id?col.doc(d.id):col.doc();
        await run(async()=>{await ref.set(Object.assign({num:n,name:d.name.trim(),start:d.start,end:d.end,base:b,avItems:d.av||[]},d.id&&S.periods[d.id]&&S.periods[d.id].locked?{locked:true}:{}));toast('Saison enregistrée');});
        S.coach.period=null;render();}},d.id?'Enregistrer la saison':'Créer la saison'),
      d.id?h('button',{class:'btn',type:'button',onclick:()=>{S.coach.period=null;render();}},'Annuler'):null));
}
function periodList(){
  const l=plist().reverse();
  return h('section',{class:'card'},h('h2',{class:'h2'},'Saisons'),
    l.length?h('ul',{class:'list'},l.map(p=>{const st=periodState(p);return h('li',{},
      h('div',{class:'l'},h('div',{class:'nm'},seasonLabel(p)+' · '+p.name),h('div',{class:'sub'},fmtShort(p.start)+' → '+fmtShort(p.end)+' · '+p.base+' pts par séance · '+(p.avItems||[]).length+' objet'+((p.avItems||[]).length>1?'s':'')+' d’avatar · '+(st==='live'?'en cours':st==='done'?'terminée'+(snapOf(p)?' · groupes figés':''):'à venir')+(p.locked?' · 🔒 verrouillée':''))),
      h('div',{class:'row'},
        h('button',{class:'btn sm'+(p.locked?' primary':''),type:'button',id:'lock-'+p.id,onclick:()=>run(async()=>{const d=Object.assign({},S.periods[p.id]);if(p.locked)delete d.locked;else d.locked=true;await S.db.doc('periods/'+p.id).set(d);toast(p.locked?'Saison déverrouillée':'Saison verrouillée');})},p.locked?'Déverrouiller':'Verrouiller'),
        h('button',{class:'btn sm',type:'button',onclick:()=>openCeremony(p.id)},'Aperçu remise'),
        h('button',{class:'btn sm',onclick:()=>{S.coach.period={id:p.id,num:String(seasonNum(p)),name:p.name,start:p.start,end:p.end,base:String(p.base),av:(p.avItems||[])};render();window.scrollTo(0,0);}},'Modifier'),
        S.confirm==='per-'+p.id?h('button',{class:'btn sm danger',onclick:()=>{S.confirm=null;run(async()=>{await S.db.doc('periods/'+p.id).delete();toast('Saison supprimée');});}},'Confirmer')
                                :h('button',{class:'btn sm danger',onclick:()=>{S.confirm='per-'+p.id;render();}},'Supprimer')));}))
    :h('p',{class:'muted'},'Aucune saison programmée. En attendant, toutes les séances comptent dans une saison unique.'));
}

/* ---------- connexion ---------- */
function authErr(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found/.test(c))return 'E-mail ou mot de passe incorrect.';
  if(c==='auth/email-already-in-use')return 'Un compte existe déjà avec cet e-mail. Utilise « Se connecter ».';
  if(c==='auth/weak-password')return 'Mot de passe trop court : 6 caractères minimum.';
  if(c==='auth/invalid-email')return 'Adresse e-mail invalide.';
  if(c==='auth/too-many-requests')return 'Trop d’essais. Attends quelques minutes.';
  if(c==='auth/network-request-failed')return 'Pas de connexion internet.';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';
  if(c==='auth/operation-not-allowed')return 'Cette méthode de connexion n’est pas activée dans Firebase.';
  return 'Connexion impossible, réessaie.';
}
function loginView(){
  const email=h('input',{id:'auth-email',type:'email',autocomplete:'email',placeholder:'toi@exemple.fr'});
  const pw=h('input',{id:'auth-pw',type:'password',autocomplete:'current-password',placeholder:'6 caractères minimum'});
  const msg=h('p',{class:'hint',role:'alert'});
  const attempt=async(fn)=>{msg.textContent='';try{await fn();}catch(e){msg.textContent=authErr(e);}};
  return h('div',{class:'stack'},
    h('div',{},h('p',{class:'eyebrow'},'Groupe de crossfit'),h('h1',{class:'day'},'Connexion')),
    h('form',{class:'card',onsubmit:e=>{e.preventDefault();attempt(()=>signInWithEmailAndPassword(auth,email.value.trim(),pw.value));}},
      field('E-mail',email),field('Mot de passe',pw),msg,
      h('div',{class:'row'},
        h('button',{class:'btn primary',type:'submit'},'Se connecter'),
        h('button',{class:'btn',type:'button',onclick:()=>attempt(()=>createUserWithEmailAndPassword(auth,email.value.trim(),pw.value))},'Créer mon compte')),
      h('div',{class:'row'},
        h('button',{class:'link',type:'button',onclick:()=>attempt(async()=>{
          if(!email.value.trim()){msg.textContent='Écris ton e-mail ci-dessus, puis clique à nouveau.';return;}
          await sendPasswordResetEmail(auth,email.value.trim());msg.textContent='Si ce compte existe, un e-mail de réinitialisation vient d’être envoyé.';})},'Mot de passe oublié'),
        h('button',{class:'link',type:'button',onclick:()=>attempt(()=>signInWithPopup(auth,new GoogleAuthProvider()))},'Continuer avec Google'))),
    h('p',{class:'ver'},'Version '+APP_VERSION));
}

/* ---------- démarrage ---------- */
function init(){
  setTimeout(checkVersion,1500);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion();});
  setInterval(checkVersion,600000);
  const bad=!firebaseConfig||!firebaseConfig.apiKey||String(firebaseConfig.apiKey).indexOf('COLLE')===0;
  if(bad){S.authReady=true;render();return;}
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  S.db=makeDb(getFirestore(app));
  render();
  let unsubs=[];
  onAuthStateChanged(auth,user=>{
    unsubs.forEach(u=>u());unsubs=[];
    S.loaded={periods:false,wods:false,logs:false};S.periods={};S.wods={};S.logs={};S.prof={prs:{},sex:''};
    S.sexSync=null;S.coachUid=null;S.coachLoaded=false;S.owner=false;S.error=null;S.entry=null;S.redo=null;S.viewDate=null;S.confirm=null;S.cerAuto=false;S._aw=null;S.groups={list:[],of:{},snap:{}};S._freezing=false;S.boardGroup=undefined;S.comments={};S.reactions={};
    S.coach={wod:null,editing:false,period:null,resDate:null};S.profView=null;S.viewUser=null;S.tip=null;S.tab='today';S.authReady=true;
    if(!user){S.uid=null;render();return;}
    S.uid=user.uid;S.meName=user.displayName||(user.email||'').split('@')[0]||'';
    const fail=e=>{S.error=(e&&e.code==='permission-denied')?'Accès refusé par la base de données. Publie les règles de sécurité (voir README).':'Lecture des données impossible pour le moment.';scheduleRender();};
    const watch=(path,key)=>unsubs.push(S.db.collection(path).onSnapshot(sn=>{S[key]=Object.fromEntries(sn.docs.map(d=>[d.id,d.data()]));S.loaded[key]=true;scheduleRender();},fail));
    watch('periods','periods');watch('wods','wods');watch('logs','logs');
    unsubs.push(S.db.doc('config/coach').onSnapshot(sn=>{S.coachUid=sn.exists?(sn.data().uid||null):null;S.coachLoaded=true;S.owner=!!S.coachUid&&S.coachUid===S.uid;scheduleRender();},fail));
    /* les groupes ne bloquent jamais l'appli : si les règles ne sont pas encore publiées, on ignore l'erreur */
    unsubs.push(S.db.doc('config/groups').onSnapshot(sn=>{const d=sn.exists?sn.data():null;S.groups={list:(d&&Array.isArray(d.list))?d.list:[],of:(d&&d.of&&typeof d.of==='object')?d.of:{},snap:(d&&d.snap&&typeof d.snap==='object')?d.snap:{},loaded:true};S._freezing=false;scheduleRender();},()=>{}));
    /* messages de la remise des trophées : si les règles ne sont pas publiées, on ignore l'erreur */
    unsubs.push(S.db.collection('comments').onSnapshot(sn=>{S.comments=Object.fromEntries(sn.docs.map(d=>[d.id,d.data()]));if(S.cerRefresh)S.cerRefresh();},()=>{}));
    /* réactions emoji : si les règles ne sont pas publiées, on ignore l'erreur */
    unsubs.push(S.db.collection('reactions').onSnapshot(sn=>{S.reactions=Object.fromEntries(sn.docs.map(d=>[d.id,d.data()]));scheduleRender();},()=>{}));
    unsubs.push(S.db.doc('users/'+S.uid+'/private/profile').onSnapshot(sn=>{const d=sn.exists?sn.data():null;S.prof={prs:(d&&d.prs)?JSON.parse(JSON.stringify(d.prs)):{},sex:(d&&d.sex)||'',genEx:(d&&Array.isArray(d.genEx))?d.genEx:null,genAll:(d&&Array.isArray(d.genAll))?d.genAll:null,words:(d&&Array.isArray(d.words))?d.words:[]};scheduleRender();},fail));
    render();
  });
}
init();
})();
