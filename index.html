/* écran plein format : mode libre (clic) ou mode guidé (timer) */
function openWarmup(mode,start){
  if(document.getElementById('tm-ov'))return;
  const items=wuItems(),n=items.length;
  if(!n){toast('Aucun exercice dans l’échauffement.',true);return;}
  /* phase : run (compte à rebours en cours) · wait (répétitions ou mode libre, action manuelle) · paused · done · closed */
  const st={mode,idx:Math.min(Math.max(0,start||0),n-1),phase:mode==='guided'?'run':'wait',endAt:0,rem:0,tid:null,gen:0,muted:tmMuted(),ac:null,wake:null,vid:null,lastK:-1,done:0,shown:-1,infoIdx:-1};
  try{st.ac=new (window.AudioContext||window.webkitAudioContext)();if(st.ac.resume)st.ac.resume();}catch(e){}
  const beep=(f,ms)=>{
    if(!st.muted&&st.ac){try{const o=st.ac.createOscillator(),g=st.ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(st.ac.destination);o.start();o.stop(st.ac.currentTime+ms/1000);}catch(e){}}
    try{if(navigator.vibrate)navigator.vibrate(ms>300?[200,80,200]:ms>150?120:40);}catch(e){}
  };
  const lock=async()=>{
    try{if(navigator.wakeLock&&!st.wake){st.wake=await navigator.wakeLock.request('screen');st.wake.addEventListener('release',()=>{st.wake=null;});}}catch(e){}
    if(!st.wake&&!st.vid){
      try{
        const v=document.createElement('video');
        v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.setAttribute('muted','');v.muted=true;v.loop=true;
        v.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:.02;pointer-events:none';
        v.src=NOSLEEP_MP4;document.body.append(v);st.vid=v;
        const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{});
      }catch(e){}
    }
  };
  const release=()=>{try{if(st.wake)st.wake.release();}catch(e){}st.wake=null;if(st.vid){try{st.vid.pause();st.vid.remove();}catch(e){}st.vid=null;}};
  const cur=()=>items[st.idx];
  const clearT=()=>{clearTimeout(st.tid);st.tid=null;st.gen++;};
  const ov=h('div',{class:'tm wu',id:'tm-ov',role:'dialog','aria-modal':'true','aria-label':'Échauffement'});
  let timeEl=null,barEl=null;

  /* Un seul minuteur à la fois : st.tid. Il ne sert qu'à réveiller l'écran à la prochaine seconde ou à la fin
     de l'exercice ; le temps restant est toujours recalculé à partir de st.endAt (heure réelle). */
  function schedule(){
    clearTimeout(st.tid);st.tid=null;
    if(st.phase!=='run')return;
    const g=st.gen,left=st.endAt-Date.now();
    const delay=left<=0?0:left-(Math.ceil(left/1000)-1)*1000+15;
    st.tid=setTimeout(()=>{if(g===st.gen&&st.phase==='run')sync();},delay);
  }
  /* recale l'état sur l'heure réelle : enchaîne tous les exercices chronométrés écoulés (retour d'arrière-plan compris) */
  function sync(){
    if(st.phase!=='run')return;
    const now=Date.now();let moved=false;
    while(st.phase==='run'&&now>=st.endAt){
      st.done=Math.max(st.done,st.idx+1);
      if(st.idx>=n-1){finish(true);return;}
      st.idx++;moved=true;st.lastK=-1;
      if(items[st.idx].mode==='time')st.endAt+=items[st.idx].target*1000;
      else st.phase='wait';
    }
    if(moved){beep(880,200);draw();}else upd();
    schedule();
  }
  function startItem(){
    clearT();st.lastK=-1;
    const x=cur();
    if(st.mode==='guided'&&x.mode==='time'){
      if(st.phase==='paused')st.rem=x.target*1000;
      else{st.phase='run';st.endAt=Date.now()+x.target*1000;}
    }else st.phase='wait';
    draw();schedule();
  }
  function next(){
    st.done=Math.max(st.done,st.idx+1);
    if(st.idx>=n-1){finish(true);return;}
    st.idx++;startItem();
  }
  function prev(){if(st.idx>0){st.idx--;startItem();}}
  function pause(){if(st.phase!=='run')return;st.rem=Math.max(0,st.endAt-Date.now());st.phase='paused';clearT();draw();}
  function resume(){if(st.phase!=='paused')return;st.endAt=Date.now()+st.rem;st.phase='run';lock();draw();schedule();}
  function finish(full){clearT();st.phase='done';if(full)st.done=n;beep(880,full?700:200);release();drawDone();}
  function restart(){st.idx=0;st.done=0;st.shown=-1;st.phase=st.mode==='guided'?'run':'wait';lock();startItem();}
  function toGuided(){st.mode='guided';st.phase='wait';lock();startItem();}
  const onVis=()=>{
    if(document.hidden||st.phase==='closed')return;
    if(st.phase!=='done')lock();
    try{if(st.ac&&st.ac.state==='suspended'&&st.ac.resume)st.ac.resume();}catch(e){}
    if(st.phase==='run')sync();
  };
  function close(){
    st.phase='closed';clearT();
    document.removeEventListener('visibilitychange',onVis);window.removeEventListener('pageshow',onVis);window.removeEventListener('focus',onVis);
    release();try{if(st.ac&&st.ac.close)st.ac.close();}catch(e){}
    ov.remove();
  }

  const top=()=>{
    const mute=h('button',{type:'button',class:'btn sm'},st.muted?'Son coupé':'Son activé');
    mute.addEventListener('click',()=>{st.muted=!st.muted;setTmMuted(st.muted);mute.textContent=st.muted?'Son coupé':'Son activé';});
    const q=h('button',{type:'button',class:'btn sm','aria-label':'Quitter l’échauffement'},'✕');
    q.addEventListener('click',st.phase==='done'?close:wuArmed(q,'Quitter ?',close));
    return h('div',{class:'tm-top'},h('span',{class:'chip'+(st.mode==='guided'?' live':'')},st.mode==='guided'?'Mode guidé':'Mode libre'),h('div',{class:'row'},mute,q));
  };
  /* mise à jour légère (temps restant, barre, bips des 3 dernières secondes) : ne reconstruit pas l'écran */
  function upd(){
    if(!timeEl)return;
    const x=cur();
    const left=st.phase==='run'?Math.max(0,st.endAt-Date.now()):st.rem;
    const k=Math.ceil(left/1000);
    timeEl.textContent=wuMMSS(k);
    barEl.style.width=Math.max(0,Math.min(100,100*(1-left/(x.target*1000))))+'%';
    ov.classList.toggle('alert',st.phase==='run'&&k>0&&k<=3);
    if(st.phase==='run'&&k!==st.lastK){st.lastK=k;if(k>0&&k<=3&&!document.hidden)beep(660,120);}
  }
  function draw(){
    if(st.phase==='done'||st.phase==='closed')return;
    const x=cur(),timed=st.mode==='guided'&&x.mode==='time',paused=st.phase==='paused',last=st.idx>=n-1;
    ov.className='tm wu'+(paused?' prep':'');
    const anim=st.shown!==st.idx;st.shown=st.idx;
    timeEl=null;barEl=null;
    const mid=h('div',{class:'tm-mid'+(anim?' wu-anim':'')},
      h('p',{class:'eyebrow tm-eb','aria-live':'polite'},'Exercice '+(st.idx+1)+' / '+n),
      h('div',{class:'wu-seg',role:'img','aria-label':'Progression : exercice '+(st.idx+1)+' sur '+n},items.map((_,i)=>h('i',{class:i<st.idx?'on':i===st.idx?'cur':''}))),
      h('h1',{class:'wu-name'},x.name));
    if(timed){
      timeEl=h('div',{class:'tm-time wu-time'},'');barEl=h('i',{});
      mid.append(timeEl,h('div',{class:'bar wu-bar'},barEl));
      if(paused)mid.append(h('p',{class:'tm-sub'},'En pause'));
    }else{
      mid.append(h('div',{class:'wu-obj'},x.mode==='time'?String(x.target):String(x.target),
        h('small',{},x.mode==='time'?'secondes · sans chrono en mode libre':x.perSide?'répétitions par côté ('+x.target*2+' au total)':'répétitions')));
      if(st.mode==='guided')mid.append(h('p',{class:'tm-sub'},'Touche « '+(last?'Terminer l’échauffement':'Exercice suivant')+' » quand tu as fini.'));
    }
    if(x.note)mid.append(h('p',{class:'wu-note'},x.note));
    const img=wuImg(x),hasInfo=!!(img||x.desc||x.steps.length);
    if(hasInfo){
      const open=st.infoIdx===st.idx;
      mid.append(h('button',{class:'btn wu-info-b',type:'button',id:'wu-info-btn','aria-expanded':open?'true':'false','aria-controls':'wu-info',onclick:()=>{
        st.infoIdx=open?-1:st.idx;draw();
        if(!open)setTimeout(()=>{const e=document.getElementById('wu-info');if(e&&e.scrollIntoView)e.scrollIntoView({block:'nearest',behavior:'smooth'});},40);
      }},open?'Masquer les infos':'Voir les infos'));
      if(open){
        const box=h('div',{class:'wu-info',id:'wu-info'});
        if(img)box.append(h('img',{class:'wu-img',src:img,alt:'Illustration : '+x.name,loading:'lazy',onerror:function(){this.remove();}}));
        if(x.desc)box.append(h('p',{class:'wu-desc'},x.desc));
        if(x.steps.length)box.append(h('ol',{class:'wu-steps'},x.steps.map(s=>h('li',{},s))));
        mid.append(box);
      }
    }
    const prevB=h('button',{class:'btn',type:'button',disabled:st.idx===0,onclick:prev},'← Précédent');
    const endB=h('button',{class:'btn',type:'button'},'Terminer l’échauffement');
    endB.addEventListener('click',wuArmed(endB,'Terminer ?',()=>finish(false)));
    let bot;
    if(timed){
      bot=[h('button',{class:'btn primary wu-main',type:'button',id:'wu-pause',onclick:paused?resume:pause},paused?'Reprendre':'Pause'),
        h('div',{class:'wu-two'},prevB,h('button',{class:'btn',type:'button',id:'wu-next',onclick:next},last?'Terminer':'Suivant →')),
        last?null:endB];
    }else{
      bot=[h('button',{class:'btn primary wu-main',type:'button',id:'wu-next',onclick:next},last?'Terminer l’échauffement':'Exercice suivant'),
        h('div',{class:'wu-two'},prevB,last?h('span',{}):endB)];
      if(st.mode==='manual')bot.push(h('button',{class:'btn sm',type:'button',id:'wu-toguided',onclick:toGuided},'Lancer le mode guidé à partir d’ici'));
    }
    ov.replaceChildren(top(),mid,h('div',{class:'tm-bot'},bot));
    upd();
  }
  function drawDone(){
    ov.className='tm wu';timeEl=null;barEl=null;
    const full=st.done>=n;
    ov.replaceChildren(top(),
      h('div',{class:'tm-mid wu-end wu-anim'},
        h('div',{class:'wu-check','aria-hidden':'true'},'✓'),
        h('p',{class:'eyebrow tm-eb'},full?'Échauffement complet':st.done+' / '+n+' exercices'),
        h('h1',{class:'wu-name'},full?'Bien joué !':'Échauffement terminé'),
        h('p',{class:'tm-sub'},full?'Les '+n+' exercices sont faits. Tu es prêt(e) pour la séance.':'Tu as fait '+st.done+' exercice'+(st.done>1?'s':'')+' sur '+n+'. Tu peux relancer l’échauffement quand tu veux.')),
      h('div',{class:'tm-bot'},h('button',{class:'btn primary wu-main',type:'button',id:'wu-restart',onclick:restart},'Recommencer l’échauffement'),h('button',{class:'btn wu-main',type:'button',onclick:close},'Fermer')));
  }
  document.body.append(ov);
  document.addEventListener('visibilitychange',onVis);window.addEventListener('pageshow',onVis);window.addEventListener('focus',onVis);
  lock();
  startItem();
  if(mode==='guided')beep(880,150);
}

  if(!S.wu.loaded){toast('Chargement de l’échauffement… réessaie dans un instant.',true);return;}
  if(S.wu.err){toast('Lecture impossible : publie d’abord les règles Firestore de l’échauffement.',true);return;}

function tally(n){

  const w=h('div',{class:'tally',role:'img','aria-label':n+' séances'});

  const ahead=ranked.slice(0,idx).reverse().slice(0,4);
  const behind=ranked.slice(idx+1).filter(r=>r.sessions>0).slice(0,3);
  const msgs=[],fallback=[],passed=new Set();

       - s'il ne le fait pas, valider la séance (points de participation) suffit dès que base > d : message « valide ce WOD » ;
       - sinon, s'il le fait aussi, la participation s'annule et il faut faire mieux que lui d'au moins d points au metcon.
     Égalité de points : départage comme au classement (séances, puis pseudo), avec une séance de plus pour moi une fois le WOD validé. */
  if(W)for(const R of ahead){
    const rDid=doneBy(R.uid,W),d=rd(R.total-tU),sR=rDid?R.sessions:R.sessions+1;
    const fav=(sU+1>sR)||(sU+1===sR&&mePs.localeCompare(R.pseudo)<0);
    const ok=v=>fav?v>=d-RV_E:v>d+RV_E;
    let text,sub=null,ratio;
    if(rDid){
      if(ok(bd.base)){ratio=0;text='Valide '+wt+opens+' : les '+fmtN(bd.base)+' pts de la séance suffisent pour passer devant '+R.pseudo+'.';}
      else if(bd.mp>0&&ok(bd.max)){ratio=(d-bd.base)/bd.mp;if(ratio>0.8)continue;text=R.pseudo+' a déjà fait '+wt+opens+'. Marque '+lead(!fav)+fmtN(d)+' pts sur ce WOD pour passer devant.';}

    }else{

        sub=R.pseudo+' ne l’a pas encore réalisé : '+pSi(R.uid)+' le fait aussi, l’écart se rejouera sur le score du metcon.';
      }else{

      if(m.redo===false)continue;
      const mp=B(w).mp;if(!(mp>0))continue;

      if(passed.has(R.uid))continue;
      const d=rd(R.total-tU);
      const fav=(sU>R.sessions)||(sU===R.sessions&&mePs.localeCompare(R.pseudo)<0);
      const ok=v=>fav?v>=d-RV_E:v>d+RV_E;
      let best=null;
      for(const x of redoable)if(ok(x.gain)&&(!best||x.gain>best.gain))best=x;
      if(!best)continue;
      const ratio=Math.max(0,d)/best.gain;if(ratio>0.8)continue;
      const wr='« '+trunc(best.w.title,26)+' »',byD=rd(Math.max(0,d)+best.oldPts),minNew=0,need=Math.max(byD,minNew);
      const word=(!fav&&d>RV_E&&byD>=minNew-RV_E)?'plus de ':'au moins ';
      const text=d<=RV_E
        ?'Vous êtes à égalité de points'+(R.sessions===sU?' et de séances':'')+' : '+(best.oldPts>0?'améliore ton REDO de ':'un REDO de ')+wr+' te fait passer devant '+R.pseudo+'.'
        :'Refais '+wr+' en REDO : '+word+fmtN(need)+' pts de REDO (1 point si tu fais moins bien que ton premier résultat, 2 si tu l’égales en points, 3 si tu l’améliores) te font passer devant '+R.pseudo+'.';
      const sub=(hasScore(best.e)?'Ton premier résultat à battre : '+lvlLab(best.m,best.e)+' · '+scoreText(best.m,best.e.score,best.e)+'. ':'')+(best.oldPts>0?'Il remplace ton REDO actuel ('+fmtN(best.oldPts)+' pts). ':'')+R.pseudo+' peut aussi marquer des points : le classement peut encore bouger.';
      passed.add(R.uid);
      msgs.push({kind:'redo',ic:'redo',pri:1,s:1+ratio+0.01*ahead.indexOf(R),uid:R.uid,h:'Un REDO pour passer devant '+R.pseudo,text,sub,act:{label:'Faire le REDO',date:best.w.date}});

  }
  /* 2. risque : un adversaire derrière moi n'a pas encore fait un WOD de la semaine que j'ai déjà validé */

          sub:'Trophée de la saison : il se décerne à la fin, tout peut encore bouger.'});
      }else if(lw.length===1){
        let bestR=null;
        for(const R of ranked){
          if(R.uid===uid||!R.sessions)continue;
          const dist=L-R.sessions,nr=remOf(R.uid).length;
          if(dist<=1&&nr>=dist+1&&(!bestR||dist<bestR.dist))bestR={R,dist};
        }
        if(bestR)msgs.push({kind:'trophy',ic:'trophy',pri:2,s:bestR.dist*0.3,uid:bestR.R.uid,h:bestR.R.pseudo+' peut te reprendre un trophée',
          text:pIl(bestR.R.uid)+' est à '+bestR.dist+' séance'+(bestR.dist>1?'s':'')+' de te reprendre « '+tr.name+' » : continue de valider tes WODs.',
          sub:'Trophée de la saison : il se décerne à la fin.'});

  }
  /* sélection : 3 messages maximum, un seul par adversaire, 2 par catégorie */

  if(!per.virtual&&Array.isArray(per.rewards)){

    }

function readRounds(m,st){
  const a=String(st.rounds||'').trim(),b=String(st.reps||'').trim();
  if(a===''&&b==='')return {empty:true};
  const rn=a===''?0:parseNum(a),rp=b===''?0:parseNum(b);
  if(rn===null||rp===null||rn<0||rp<0||rn%1||rp%1)return {bad:true};
  if(rp>=eqTotal(m)-1e-9)return {over:true,max:fmtN(eqTotal(m))};
  return {v:Math.round((rn+fracOf(m,rp))*10000)/10000,rounds:rn,reps:rp};
}
function readScore(m,st){
  if(m.format==='FT'){
    if(st.capped){ /* time cap atteint : tours + reps (si le WOD a des tours), sinon nombre de reps */
      const pl=planOf(m);
      if(pl){
        const a=String(st.rounds||'').trim(),b=String(st.reps||'').trim();
        if(a===''&&b==='')return {empty:true};
        const rn=a===''?0:parseNum(a),rp=b===''?0:parseNum(b);
        if(rn===null||rp===null||rn<0||rp<0||rn%1||rp%1)return {bad:true,capBad:true};
        if(pl.sizes&&rn>=pl.sizes.length)return {many:true};
        const sz=sizeAt(pl,rn);
        const rr=eqToRaw(pl,rn,rp);
        if(rr>=sz)return {over:true,max:pl.lines?fmtN(pl.items[rn].eq):(pl.rm?fmtN(pl.rm.eq):sz)};
        return {v:planCum(pl,rn,rr),cap:true,rounds:rn,reps:rr};
      }
      const s=String(st.creps||'').trim();if(s==='')return {empty:true};
      const cv=parseNum(s);return (cv===null||cv<0||cv%1)?{bad:true,capBad:true}:{v:cv,cap:true,reps:cv};
    }
    if(String(st.score||'').trim()==='')return {empty:true};
    const v=parseTime(st.score);return v===null?{bad:true}:{v};
  }
  if(isDead(m)){const t=String(st.score||'').trim();if(t==='')return {empty:true};const v=parseHold(t),d=metDuration(m);return (v===null||v<0||(d&&v>d+0.5))?{bad:true,hold:true}:{v};}
  if(m.repsRound>0)return readRounds(m,st);
  if(String(st.score||'').trim()==='')return {empty:true};
  const v=parseNum(st.score);return (v===null||v<0)?{bad:true}:{v};
}
function scoreErr(m,r){
  if(r.hold)return 'Temps tenu illisible ou supérieur au time cap. Écris-le comme 14:00 (14 minutes) ou 14.';
  if(r.many)return 'Tu as indiqué plus de tours que le WOD n’en contient. Si tu as tout terminé, choisis « Terminé dans le temps ».';
  if(r.over)return 'Les reps en plus doivent être inférieures à '+(r.max||roundTotal(m))+' (le tour en cours).';
  if(r.capBad)return 'Score illisible. Écris des nombres entiers.';
  if(m.format==='FT')return 'Temps illisible. Écris-le comme 12:45.';
  return m.repsRound>0?'Score illisible. Écris des nombres entiers de tours et de reps.':'Score illisible. Écris un nombre de tours.';
}
function splitScore(m,e){
  if(e.rounds!==undefined&&!roundModel(m))return [e.rounds,e.reps||0];
  const r=Math.floor(e.score+1e-9);return [r,repsOf(m,e.score-r)];
}
/* consigne affichée sous les champs de score, pour un résultat au time cap avec tours */
function capGuide(pl){
  if(pl.lines)return 'Chaque ligne du WOD = 1 tour. Indique les lignes COMPLÈTES terminées, puis ce que tu as fait sur la ligne en cours (en reps ; si la ligne est pondérée, ex. {10=1}, compte en reps équivalentes : 600 m avec {10=1} = 60). Exemple : 4 + 60 = 4 lignes terminées + 600 m sur la ligne 5.';
  const n=pl.sizes?Math.max(1,Math.min(5,pl.sizes.length-1)):5;
  if(pl.rm&&pl.lns&&pl.lns.length===pl.rm.items.length){
    const eqs=pl.lns.map(it=>it.n+' '+it.rest+' = '+capS(it.eq,'rep')).join(' ; ');
    const ex=Math.max(1,Math.min(Math.round(pl.rm.eq*0.6),Math.ceil(pl.rm.eq)-1));
    let left=mdEqToRaw(pl.rm,ex);const d=[];
    for(const it of pl.lns){const k=Math.min(left,it.n);if(k>0)d.push(fmtN(k)+' '+it.rest);left-=k;if(left<=0)break;}
    return 'Un tour = '+fmtN(pl.rm.eq)+' reps équivalentes ('+eqs+'). Indique les tours COMPLETS terminés, puis les reps équivalentes faites dans le tour en cours, dans l’ordre des lignes. Exemple : 2 tours + '+ex+' = 2 tours complets, puis '+d.join(' et ')+'.';
  }
  const intro=pl.sizes
    ?'Schéma '+pl.nums.join('-')+(pl.k>1?' ('+pl.k+' mouvements par ligne)':'')+' : un tour terminé = une ligne du schéma. '
    :'Un tour = '+pl.size+' reps. ';
  return intro+'Indique les tours COMPLETS terminés, puis les reps faites dans le tour en cours (tous mouvements confondus, dans l’ordre). Exemple : '+n+' tours + 4 reps'+(pl.sizes?' = tours '+pl.nums.slice(0,n).join('-')+' terminés + 4 reps du tour suivant.':'.');
}
/* ---------- aide à la saisie au time cap : « Comment calculer le nombre de reps » et « Vérifier » ---------- */
/* lignes de reps d'un tour : nombre, reps équivalentes (pondération {a=b}) et texte du mouvement */
function capLines(m){
  const out=[];
  for(const raw of String(m.content||'').split('\n')){
    const s=raw.trim();if(!s)continue;
    const w=s.match(WTAG),clean=s.replace(WTAG,'').trim();
    if(NOT_REPS.test(clean)||/^\d+(\s*[-–\/]\s*\d+)+(\s|$)/.test(clean))continue;
    const lm=clean.match(/^(\d+)\s+(\S.*)$/);if(!lm)continue;
    const n=+lm[1];let eq=n;
    if(w){const a=w[1]?parseNum(w[1]):null,b=parseNum(w[2]);if(b!==null&&b>=0&&(a===null||a>0))eq=a?n*b/a:b;}
    out.push({n,eq,rest:lm[2]});
  }
  return out;
}
const capEqTxt=(it,k)=>{const e=it.eq*k/it.n;return Math.abs(it.eq-it.n)>1e-9?' (compte pour '+fmtN(e)+' rep'+(e>1?'s':'')+')':'';};
const capPart=(it,k)=>fmtN(k)+' '+it.rest+capEqTxt(it,k);
const capS=(n,w)=>fmtN(n)+' '+w+(n>1?'s':'');
/* ce que l'appli a compris de la saisie : {ok:'…'} ou {err:'…'} */
function capExplain(m,st){
  const r=readScore(m,st);
  if(r.empty)return {err:'Remplis d’abord tes tours et tes reps, puis clique sur Vérifier.'};
  if(r.bad||r.over||r.many)return {err:scoreErr(m,r)};
  const pl=planOf(m);
  if(!pl)return {ok:'Tu as fait '+capS(r.reps,'rep')+' au total, tous mouvements confondus.'};
  const rn=r.rounds,rr=r.reps,lns=capLines(m);
  const none='Tu n’as encore compté aucun tour ni aucune rep.';
  if(pl.lines){
    const ok=lns.length===pl.items.length;
    const parts=[];
    if(rn>0)parts.push(capS(rn,'ligne')+' terminée'+(rn>1?'s':'')+(ok?' ('+lns.slice(0,rn).map(it=>it.n+' '+it.rest).join(', ')+')':''));
    if(rr>0)parts.push((ok?capPart(lns[rn],rr):capS(rawToEq(pl,rn,rr),'rep équivalente'))+' sur la ligne en cours');
    return {ok:parts.length?'Tu as fait '+parts.join(', puis ')+'.':none};
  }
  if(pl.sizes){
    const L=String(m.content||'').split('\n').map(x=>x.replace(WTAG,'').trim()).filter(Boolean);
    const li=L.findIndex(x=>LADDER.test(x)),movs=L.slice(li+1).filter(x=>!LADDER.test(x));
    const parts=[];
    if(rn>0)parts.push(rn===1?'le tour de '+pl.nums[0]+' en entier':'les tours '+pl.nums.slice(0,rn).join('-')+' en entier');
    if(rr>0){
      const N=pl.nums[rn];let left=rr;const d=[];
      for(const mv of movs){const k=Math.min(left,N);if(k>0)d.push(fmtN(k)+' '+mv);left-=k;if(left<=0)break;}
      parts.push('dans le tour de '+N+' : '+d.join(' et '));
    }
    return {ok:parts.length?'Tu as terminé '+parts.join(', puis ')+'.':none};
  }
  const tot=lns.reduce((a,x)=>a+x.n,0),good=lns.length>0&&tot===pl.size;
  const parts=[];
  if(rn>0)parts.push(rn+' tour'+(rn>1?'s':'')+' complet'+(rn>1?'s':'')+(good?' (un tour = '+lns.map(it=>it.n+' '+it.rest).join(' + ')+')':''));
  if(rr>0){
    if(good){let left=rr;const d=[];for(const it of lns){const k=Math.min(left,it.n);if(k>0)d.push(capPart(it,k));left-=k;if(left<=0)break;}parts.push('dans le tour suivant : '+d.join(' et '));}
    else parts.push(capS(rr,'rep')+' dans le tour suivant');
  }
  return {ok:parts.length?'Tu as fait '+parts.join(', puis ')+'.':none};
}
/* fenêtre dépliable « Comment calculer le nombre de reps » : consigne de saisie + équivalences du WOD */
function capHelpKids(m){
  const pl=planOf(m),lns=capLines(m),kids=[];
  kids.push(h('p',{},pl?capGuide(pl):'Indique le nombre total de reps faites quand le time cap a sonné, tous mouvements confondus. Exemple : 81.'));
  const weighted=lns.some(it=>Math.abs(it.eq-it.n)>1e-9);
  if(lns.length&&pl&&(weighted||pl.lines)){
    kids.push(h('p',{},h('b',{},'Équivalences du WOD')));
    kids.push(h('ul',{},lns.map(it=>h('li',{},it.n+' '+it.rest+' → '+(Math.abs(it.eq-it.n)>1e-9?'compte pour '+fmtN(it.eq)+' rep'+(it.eq>1?'s':''):capS(it.n,'rep'))))));
    if(weighted&&!pl.lines)kids.push(h('p',{},'Compte en reps équivalentes, dans l’ordre des lignes (par exemple 250 m de rameur = 25 reps) : l’appli retrouve les mètres toute seule.'));
  }
  kids.push(h('p',{},'Un doute ? Clique sur « Vérifier » : l’appli t’indique ce qu’elle a compris.'));
  return kids;
}
/* boutons « Comment calculer » + « Vérifier » ; get() renvoie la saisie courante ({capped:true,rounds,reps} ou {capped:true,creps}) ; box.reset() masque le dernier résultat */
function capTools(m,get){
  const help=h('div',{class:'capchk',hidden:true},capHelpKids(m));
  const res=h('div',{class:'capchk',role:'status','aria-live':'polite',hidden:true});
  const bH=h('button',{type:'button',class:'btn sm','aria-expanded':'false',onclick:()=>{const o=help.hidden;help.hidden=!o;bH.setAttribute('aria-expanded',o?'true':'false');}},'Comment calculer le nombre de reps');
  const bV=h('button',{type:'button',class:'btn sm',onclick:()=>{
    const x=capExplain(m,get());
    res.className='capchk'+(x.err?' err':'');
    res.replaceChildren(...(x.err?[h('p',{},x.err)]:[h('p',{},h('b',{},'Ce que l’appli a compris')),h('p',{},x.ok),h('p',{},'C’est bien ça ? Sinon, corrige tes champs avant d’enregistrer.')]));
    res.hidden=false;
  }},'Vérifier');
  const box=h('div',{class:'capbox'},h('div',{class:'caprow'},bH,bV),help,res);
  box.reset=()=>{res.hidden=true;};
  return box;
}
const scaleKg=(t,f)=>String(t||'').replace(/(\d+(?:[.,]\d+)?)(\s*(?:kg|lb)s?)/gi,(x,n,u)=>fmtN(Math.round(parseNum(n)*f*2)/2)+u);

/* résumé du niveau choisi (nom, couleur, charge, variante) : sert au bandeau de saisie et à la fenêtre de confirmation */
function lvlInfo(m,st){

  if(!Number.isInteger(st.level))return {none:true};
  const rank=lvRank(m,st.level),base=levelName(m,st.level);
  return {cls:k?'lv-c':'lv-'+rank,label:k?base+' '+(k>0?'+':'−')+Math.abs(k)+' kg':base,
    load:loadsText(k?customLoad(m,st):lv),note:lvNote(lv),kg:k};

/* ouvre la confirmation seulement si une saisie valide de metcon va être enregistrée ; sinon la validation normale affiche son message d'erreur */
function needConfirm(m,st){
  if(!m||st.skip||st.coach)return false;
  if((st.custom||kgOf(st))&&!kgOf(st))return false;
  if(!Number.isInteger(st.level))return false; /* pas de niveau : la validation affiche l'erreur */
  const r=readScore(m,st);
  return !(r.bad||r.over||r.many||r.empty);
}

      'Dead by : écris combien de temps tu as tenu, en minutes:secondes (14:00 = 14 minutes) ou en minutes seules (14). Compte les intervalles de '+fmtN(iv)+' min que tu as réussis en entier'+(d?', jusqu’au time cap de '+mmss(d):'')+'. Plus tu tiens, plus tu marques de points.')]);
  }

    h('input',{id:pre+'-score',type:'text',inputmode:ft?'text':'decimal',placeholder:ft?'12:45':'7,5',value:st.score||'',oninput:bind('score')}),

function fillState(m,st,e){
  if(!m||!e)return;
  if(e.cap){
    st.capped=true;
    const pl=planOf(m),v=capValue(m,e);
    if(pl){const x=cumToRounds(pl,v);st.rounds=String(x.r);st.reps=String(rawToEq(pl,x.r,x.rp));}
    else st.creps=String(v);
    return;
  }
  if(e.score===undefined||e.score===null)return;
  st.score=(m.format==='FT'||isDead(m))?fmtTime(e.score):String(e.score).replace('.',',');
  if(m.format!=='FT'&&!isDead(m)&&m.repsRound>0){const sp=splitScore(m,e);st.rounds=String(sp[0]);st.reps=String(sp[1]);}
}
function metSig(m){
  const c=String(m.content||'').split('\n').map(x=>norm(x).trim()).filter(Boolean).join('|');
  return c?m.format+'|'+c:'';
}
function prevBlock(w,date,cur){
  const m=metconOf(w),sig=m&&metSig(m);
  if(!sig)return null;
  const lg=S.logs[S.uid]||{},en=lg.entries||{},rows=[];
  for(const w2 of Object.values(S.wods)){
    const m2=metconOf(w2);
    if(!m2||w2.date===date||metSig(m2)!==sig)continue;
    const e=en[w2.date];if(hasScore(e))rows.push({d:w2.date,e,tag:''});
    const rd=(lg.redos||{})[w2.date];if(hasScore(rd))rows.push({d:rd.on,e:rd,tag:' · REDO'});
  }
  if(!rows.length)return null;
  rows.sort((a,b)=>a.d<b.d?1:-1);
  const delta=pv=>{
    if(!cur||cur.cap||pv.cap||cur.score===undefined||(cur.level||0)!==(pv.level||0))return '';
    const d=cur.score-pv.score;
    if(Math.abs(d)<0.0001)return ' · même résultat qu’ici';
    return ' · ici '+(m.format==='FT'?(d<0?'−':'+')+fmtTime(Math.abs(d)):(d>0?'+':'−')+(isDead(m)?fmtTime(Math.abs(d)):roundsLabel(m,Math.abs(d))));
  };
  return h('div',{class:'lines'},h('span',{class:'flabel'},'Déjà fait sur ce metcon'),
    h('ul',{class:'list'},rows.map(r=>h('li',{},h('div',{class:'l'},h('div',{class:'nm'},cap(fmtShort(r.d))+r.tag),
      h('div',{class:'sub'},lvlLab(m,r.e)+' · '+scoreText(m,r.e.score,r.e)+delta(r.e)))))));
}

/* ---------- résultats inhabituels ----------
   Metcon : points à plus de 30 % de l'écart avec ses habitudes sur le même niveau (3 résultats minimum), ou passage à un niveau supérieur
   en marquant autant de points ou plus que d'habitude. Force : charge en hausse de plus de 25 % sur son record dans la saisie, charge ou reps absurdes.
   Seuls les résultats antérieurs à la séance servent de référence. */
const UN_DAYS=45,UN_MIN=3;
const r1=x=>Math.round(x*10)/10;
function metHistory(lg){
  const out=[];
  for(const [d,ent] of Object.entries((lg&&lg.entries)||{})){
    const w=S.wods[d],m=w&&metconOf(w);
    if(!m||!ent||!hasScore(ent))continue;
    let pts=0;try{pts=perfOf(m,ent);}catch(x){continue;}
    out.push({d,m,e:ent,pts,lv:lvVal(ent,m),lvl:ent.level||0,kg:kgOf(ent)});
  }
  return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function metFlags(hist,cur,athlete){
  const prior=hist.filter(x=>x.d<cur.d),out=[];
  if(prior.length<UN_MIN)return out;
  const same=prior.filter(x=>x.lvl===cur.lvl&&x.kg===cur.kg);
  if(same.length>=UN_MIN){
    const avg=mean(same.map(x=>x.pts)),diff=cur.pts-avg;
    if(avg>0&&Math.abs(diff)>.3*avg&&Math.abs(diff)>=1.5)
      out.push({t:'pts',msg:'Points '+(diff>0?'bien au-dessus':'bien en dessous')+' de ses habitudes : '+fmtN(r1(cur.pts))+' pts contre '+fmtN(r1(avg))+' en moyenne au niveau '+lvTag(cur.lv)+' ('+(diff>0?'+':'−')+Math.round(Math.abs(diff)/avg*100)+' %).'});
  }
  if(!athlete){ /* l'athlète n'est pas interrogé sur un changement de niveau (il le confirme déjà) */
    const cnt={};prior.slice(-5).forEach(x=>{const k=Math.round(x.lv*4)/4;cnt[k]=(cnt[k]||0)+1;});
    const usual=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]||b-a)[0];
    if(cur.lv-usual>=.45){
      const old=prior.filter(x=>Math.abs(x.lv-usual)<.13),avg=mean(old.map(x=>x.pts));
      if(cur.pts>=avg*.95-1e-9)
        out.push({t:'lvl',msg:'Passe de '+lvTag(usual)+' à '+lvTag(cur.lv)+' en marquant autant de points ou plus que d’habitude : '+fmtN(r1(cur.pts))+' pts contre '+fmtN(r1(avg))+' en moyenne au niveau précédent.'});
    }
  }
  return out;
}
function forceFlags(lg,date,w,e){
  const out=[];
  for(const p of (w.parts||[])){
    if(p.kind!=='force')continue;
    const ld=e.loads&&e.loads[p.label],sx=e.sets&&e.sets[p.label];
    if(sx&&Number(sx.r)>100)out.push({t:'force',msg:p.label+' : '+sx.r+' répétitions par série, c’est improbable.'});
    if(ld===undefined||ld===null)continue;
    const kg=Number(ld);if(!isFinite(kg))continue;
    if(kg>400)out.push({t:'force',msg:p.label+' : charge de '+fmtN(kg)+' kg, vérifie qu’il n’y a pas d’erreur de saisie.'});
    else if(p.movement&&!SIGNED.includes(p.movement)){
      let best=0;
      for(const [d,pe] of Object.entries((lg&&lg.entries)||{})){
        if(d>=date||!pe||!pe.loads)continue;
        const pw=S.wods[d];if(!pw)continue;
        for(const q of (pw.parts||[]))if(q.kind==='force'&&q.movement===p.movement&&pe.loads[q.label]!==undefined)best=Math.max(best,Number(pe.loads[q.label])||0);
      }
      if(best>0&&kg>1.25*best)out.push({t:'force',msg:p.label+' · '+p.movement+' : '+fmtN(kg)+' kg contre '+fmtN(best)+' kg au plus lourd avant (+'+Math.round((kg/best-1)*100)+' %).'});
    }
  }
  return out;
}
function unusualOne(uid,date,hist,e0){
  const lg=S.logs[uid],e=e0||(lg&&lg.entries&&lg.entries[date]),w=S.wods[date];
  if(!lg||!e||!w)return [];
  const out=[],m=metconOf(w);
  if(m&&hasScore(e)){
    const h0=hist||metHistory(lg);
    const cur=h0.find(x=>x.d===date)||(()=>{try{return {d:date,m,e,pts:perfOf(m,e),lv:lvVal(e,m),lvl:e.level||0,kg:kgOf(e)};}catch(x){return null;}})();
    if(cur)out.push(...metFlags(h0,cur));
  }
  out.push(...forceFlags(lg,date,w,e));
  return out;
}
const unRevd=(uid,d)=>!!(S.prof&&S.prof.revd&&S.prof.revd[uid+'|'+d]);
/* tous les résultats à vérifier (coach seulement) : séances des UN_DAYS derniers jours, pas encore marquées « vérifié » */
function unusualAll(){
  if(!S.owner)return [];
  if(S._un)return S._un;
  const cut=addDays(todayStr(),-UN_DAYS),out=[];
  for(const [uid,lg] of Object.entries(S.logs)){
    if(!lg||!lg.entries)continue;
    const hist=metHistory(lg);
    for(const d of Object.keys(lg.entries)){
      if(d<cut||unRevd(uid,d))continue;
      const fl=unusualOne(uid,d,hist);
      if(fl.length)out.push({uid,date:d,flags:fl});
    }
  }
  out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  return S._un=out;
}

function submitEntryNow(w){
  if(!S.entry.coach&&lockedDate(S.entry.date)){toast(LOCKMSG,true);return;}
  const uid=S.entry.uid||S.uid,coach=!!S.entry.coach;
  const prevE=((S.logs[uid]||{}).entries||{})[S.entry.date];
  /* Date réelle de validation : l'horodatage doit refléter le moment où la séance est enregistrée, même si le coach saisit les résultats pour l'athlète. */
  const atNew=new Date().toISOString();
  const m=metconOf(w),e={at:(prevE&&prevE.at)||atNew};
  if(m){
    if(!S.entry.skip){
      if(S.entry.custom&&!kgOf(S.entry)){toast('Choisis ton niveau personnalisé (par exemple Rx +10 kg).',true);return;}
      if(!Number.isInteger(S.entry.level)){toast('Sélectionnez un niveau pour le metcon.',true);return;} /* aucun niveau par défaut */
    }
    if(Number.isInteger(S.entry.level)){S.entry.level=okLvl(m,S.entry.level);e.level=S.entry.level;if(kgOf(S.entry))e.kg=kgOf(S.entry);}
    const r=S.entry.skip?{empty:true}:readScore(m,S.entry);
    if(S.entry.skip)e.noMetcon=true;
    if(r.bad||r.over||r.many){toast(scoreErr(m,r),true);return;}
    if(S.entry.only){if(r.empty){toast('Indique ton résultat du metcon.',true);return;}e.metconOnly=true;}
    if(!r.empty){
      if(r.cap){e.cap=true;e.capScore=r.v;if(r.rounds!==undefined)e.rounds=r.rounds;e.reps=r.reps;}
      else{e.score=r.v;if(r.rounds!==undefined){e.rounds=r.rounds;e.reps=r.reps;}}
    }
  }
  const loads={};
  for(const [k,raw] of (S.entry.only&&m?[]:Object.entries(S.entry.loads))){if(String(raw).trim()==='')continue;const v=parseNum(raw),pm=(w.parts||[]).find(q=>q.label===k);if(!prOk(pm&&pm.movement,v)){toast('Charge illisible pour '+k,true);return;}loads[k]=v;}
  if(!coach&&uid===S.uid&&!(S.entry.only&&m))for(const p of (w.parts||[])){
    if(p.kind!=='force'||loads[p.label]!==undefined)continue;
    const d=forceDefault(p);if(d!==null&&prOk(p.movement,d))loads[p.label]=d;
  }
  if(Object.keys(loads).length)e.loads=loads;
  /* séries × reps : enregistrés avec la charge (tonnage) */
  const setsO={};
  for(const p of (w.parts||[])){
    if(p.kind!=='force'||SIGNED.includes(p.movement)||loads[p.label]===undefined)continue;
    const sx=S.entry.sets&&S.entry.sets[p.label],sc=forceSchema(p);
    let n=sc?Math.max(1,Math.min(sc.s,parseInt(sx&&sx.s,10)||sc.s)):(sx&&String(sx.s).trim()!==''?parseInt(sx.s,10):NaN),rr=sx&&String(sx.r).trim()!==''?parseInt(sx.r,10):(sc?sc.r:NaN);
    if(!(n>0&&n<=99&&rr>0&&rr<=999)){const typed=sx&&(sc?String(sx.r).trim()!=='':(String(sx.s).trim()!==''||String(sx.r).trim()!==''));if(typed){toast('Séries et reps illisibles pour '+p.label,true);return;}continue;}
    setsO[p.label]={s:n,r:rr};
  }

  const prs={};
  if(!(S.entry.only&&m))for(const p of (w.parts||[])){
    if(p.kind!=='force'||!p.movement||loads[p.label]===undefined)continue;
    const sc=forceSchema(p),reps=setsO[p.label]?setsO[p.label].r:(sc&&sc.r?sc.r:NaN);

    const fl=unusualOne(uid,S.entry.date,null,e).filter(x=>x.t!=='lvl').map(x=>x.msg);

      h('div',{class:'ar-tag'},(p.virtual?'Toutes les séances':seasonLabel(p)+' · '+p.name)+' · '+(st==='live'?'En cours':st==='done'?'Terminée':'À venir')))));
  const ctl=h('div',{class:'row',style:'align-items:end'});
  if(l.length)ctl.append(h('div',{style:'flex:1;min-width:150px'},field('Saison',sel(l.map(x=>[x.id,seasonLabel(x)+' · '+x.name]),p.id,v=>{S.periodId=v;S.trophyGroup=undefined;render();},{id:'period-select'}))));
  if(ids.length>1)ctl.append(h('div',{style:'flex:1;min-width:150px'},field('Groupe',sel(ids.map(id=>[id,scopeName(id,p)||'Groupe']),tg,v=>{S.trophyGroup=v;render();},{id:'trophy-group'}))));
  if(ctl.childNodes.length)el.append(ctl);
  el.append(h('div',{},h('h2',{class:'h2'},'Trophées'+(scopeName(tg,p)?' · '+scopeName(tg,p):'')),
    gl.length?h('p',{class:'muted'},'Les trophées se jouent à l’intérieur de chaque groupe.'+(snapOf(p)?' Groupes figés à la fin de la saison.':'')):null,
    h('p',{class:'muted'},st==='done'?'Décernés à la fin de la saison.':st==='soon'?'La saison n’a pas commencé.':'Provisoires, ils sont attribués à la date de fin ('+(p.virtual?'à définir par le coach':fmtShort(p.end))+').')));

  el.append(groupSection(board,scope));
  el.append(h('section',{class:'card'},h('h2',{class:'h2'},'Athlètes'),
    field('Trier par trophée',sel(TROPHIES.map(x=>[x.id,x.name]),t.id,v=>{S.sort=v;render();},{id:'sort-select'}),t.desc),
    rows.length?h('ol',{class:'lb'},rows.map((r,i)=>h('li',{class:r.uid===S.uid?'me':''},
      h('div',{class:'rank'+(i<3&&ok(r)?' r'+(i+1):'')},i+1),
      h('div',{},h('div',{class:'nm'},nameBtn(r),badgeMini(r.uid),lvPill(r)),h('div',{class:'sub'},fmtPts(r.total)+' pts · '+r.sessions+' séance'+(r.sessions>1?'s':''))),
      h('div',{class:'pts vsm'},ok(r)?t.show(r):'–')))):h('p',{class:'muted'},'Aucun athlète pour l’instant.')));
  return el;
}

/* ---------- thème Halloween (cosmétique) ----------
   Objet « Décor » : acquis en participant à au moins un WOD d'octobre. Équipé, il habille le fond de l'avatar
   (décor de box en plein écran) et ajoute quelques décorations discrètes à l'appli (toile, araignée, citrouille). */
const webPath=R=>{let d='';const A=[0,22.5,45,67.5,90].map(a=>a*Math.PI/180);
  for(const a of A)d+='M0 0L'+(R*Math.cos(a)).toFixed(1)+' '+(R*Math.sin(a)).toFixed(1);
  for(const f of [.32,.56,.8]){const r=R*f;for(let i=0;i<4;i++){const a=A[i],b=A[i+1],m=(a+b)/2,c=r*.9;
    d+='M'+(r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1)+'Q'+(c*Math.cos(m)).toFixed(1)+' '+(c*Math.sin(m)).toFixed(1)+' '+(r*Math.cos(b)).toFixed(1)+' '+(r*Math.sin(b)).toFixed(1);}}
  return d;};

/* zoom de l'avatar : pincer, molette, double-tap ou boutons + / − ; un doigt déplace l'image quand elle est agrandie */
function addZoom(stage,el){
  let sc=1,tx=0,ty=0,d0=0,sc0=1,lastTap=0,moved=0;
  const ptr=new Map();
  const lab=h('span',{class:'zlab'},'100 %');
  const apply=()=>{
    sc=Math.max(1,Math.min(6,sc));
    const mx=el.offsetWidth*(sc-1)/2,my=el.offsetHeight*(sc-1)/2;
    tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty));
    el.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
    lab.textContent=Math.round(sc*100)+' %';
  };
  const zoomAt=(ns,cx,cy)=>{
    ns=Math.max(1,Math.min(6,ns));
    const r=stage.getBoundingClientRect(),px=cx-(r.left+r.width/2),py=cy-(r.top+r.height/2);
    tx=px-(px-tx)*ns/sc;ty=py-(py-ty)*ns/sc;sc=ns;apply();
  };
  const mid=()=>{const r=stage.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
  const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;};
  stage.addEventListener('pointerdown',e=>{
    if(e.target.closest&&e.target.closest('.zbar'))return;
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
    if(ptr.size===2){d0=dist();sc0=sc;}
  });
  stage.addEventListener('pointermove',e=>{
    const p=ptr.get(e.pointerId);if(!p)return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    if(ptr.size===2){const a=[...ptr.values()];zoomAt(sc0*dist()/d0,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);}
    else if(sc>1){tx+=dx;ty+=dy;apply();}
  });
  const up=e=>{
    if(!ptr.has(e.pointerId))return;
    const single=ptr.size===1;ptr.delete(e.pointerId);
    if(single&&moved<8&&e.type==='pointerup'){
      const now=Date.now();
      if(now-lastTap<320){lastTap=0;if(sc>1){sc=1;tx=0;ty=0;apply();}else zoomAt(2.6,e.clientX,e.clientY);}else lastTap=now;
    }
    if(ptr.size===1){sc0=sc;d0=0;}
  };
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(sc*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY);},{passive:false});
  const bt=(t,l,fn)=>h('button',{class:'btn sm',type:'button','aria-label':l,onclick:fn},t);
  stage.append(h('div',{class:'zbar'},bt('−','Dézoomer',()=>{const c=mid();zoomAt(sc/1.5,c[0],c[1]);}),lab,bt('+','Zoomer',()=>{const c=mid();zoomAt(sc*1.5,c[0],c[1]);}),bt('1×','Taille normale',()=>{sc=1;tx=0;ty=0;apply();})));
}

function muscleScore(texts){
  const sc={};MUSCLES.forEach(m=>{sc[m[0]]=0;});
  for(const tx of texts){
    const t=norm(tx),hits=[];
    for(const [al,w] of MUS_AL){
      for(let i=t.indexOf(al);i>=0;i=t.indexOf(al,i+1)){
        const e=i+al.length;
        if((i===0||!/[a-z0-9]/.test(t[i-1]))&&(e>=t.length||!/[a-z0-9]/.test(t[e]))&&!hits.some(x=>i<x.e&&e>x.s))hits.push({s:i,e,w});
      }
    }
    for(const x of hits)for(const tok of x.w.split(' ')){const m=tok.match(/^([a-z]+)(\d)$/);if(m)sc[m[1]]+=+m[2];}
  }
  return sc;
}
function wodMuscles(parts){
  const tot={};MUSCLES.forEach(m=>{tot[m[0]]=0;});
  for(const p of parts||[]){
    let sc=muscleScore(String(p.content||'').split('\n'));
    if(!Object.values(sc).some(v=>v>0))sc=muscleScore([p.name||'',p.movement||'']);
    for(const k in sc)tot[k]+=sc[k];
  }
  return tot;
}

  const ivPref=S.coach.genIv||'auto',ivN=fmt==='EMOM'?(ivPref==='auto'?rnd([1,1,2,2,3]):(Number(ivPref)||1)):1;
  const n=Math.min(pool.length,fmt==='FT'?rnd([2,2,3]):fmt==='EMOM'?(ivN===1?rnd([1,2]):ivN===2?2:rnd([2,3])):3);

  for(const x of sh)if(mv.length<n&&!mv.includes(x))mv.push(x);
  const nm=x=>(x[6]?x[6]+' ':'')+x[0];

    const mkRounds=rounds=>{const reps=mv.map(repsFor),sum=reps.reduce((a,b)=>a+b,0);

      c=cands.reduce((bst,x)=>Math.abs(x.T*1.2-target)<Math.abs(bst.T*1.2-target)?x:bst);
    }else c=(ladderOk&&Math.random()<.7)?mkLadder(rnd(LADS)):mkRounds(rnd([3,4,5]));

  }else if(fmt==='EMOM'){
    const dd=capMin?Math.max(ivN*2,Math.ceil(capMin/ivN)*ivN):rnd(ivN===1?[10,12,15]:ivN===2?[12,16,20]:[15,18,24]);
    D=dd;durMin=dd;
    /* le travail d'un intervalle doit tenir en 65 % de sa durée pour laisser de la marge */
    const budget=ivN*60*.65;let reps=mv.map(repsFor);const work0=mv.reduce((a,x,i)=>a+reps[i]*x[5],0);

  }else{

  const mkTiers=()=>{

    if(fmt==='FT'){const b=capMin?capMin*60:T/.75;return spreadTimes(b*.55,b*.95).map((t,j)=>({t:fmtTime(t),p:String(10-j)}));}

  });

  const focus=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  return Object.assign(blankPart('metcon'),{name:'Metcon',content,format:fmt,detail,repsRound,dur:String(durMin),focus,levels},fmt==='EMOM'?{interval:String(ivN),deadBy:true}:{});
}

/* ---------- intensité du metcon et calcul automatique des paliers ---------- */
/* allures des distances (réglages du coach) et écarts entre paliers par type de metcon */
const PACE_DEF={row:125,run:300},PACE_UNIT={row:500,run:1000};
function paceSpm(kind){
  const raw=String(((S.prof&&S.prof.pace)||{})[kind]??'').trim();let v=null;
  if(raw){v=parseTime(raw);if(v===null){const n=parseNum(raw);if(n!==null&&n>0)v=n;}}
  if(!(v>=20&&v<=1800))v=PACE_DEF[kind];
  return v/PACE_UNIT[kind];
}
const SPREAD={
  FT:{l:'For Time',d:6,min:1,max:30,h:'Écart entre deux paliers consécutifs, en % du temps du palier à 10 points. 6 % : 10:00 devient 10:36, puis 11:12…'},
  AMRAP:{l:'AMRAP',d:4,min:1,max:10,h:'Écart entre deux paliers consécutifs, en % du palier à 10 points, arrondi à la rep près. 5 % : 247 reps, puis 235, 222…'},
  DEAD:{l:'EMOM Dead by',d:null,min:1,max:50,h:'Écart entre deux paliers consécutifs, en % du time cap (arrondi à l’intervalle). Vide = un intervalle par point, ou plusieurs si le cap en compte plus de 10.'},
  CAP:{l:'For Time : palier time cap',d:90,min:10,max:100,h:'Pourcentage des reps totales à atteindre au time cap pour marquer 1 point (arrondi à la fin d’un exercice).'}
};
const spreadPct=k=>{const D=SPREAD[k],v=parseNum(String(((S.prof&&S.prof.spread)||{})[k]??''));return(v!==null&&v>=D.min&&v<=D.max)?v:D.d;};
/* repères d'un time cap : reps cumulées (réelles) à la fin de chaque exercice, dans l'ordre où l'athlète les enchaîne */
function capBoundaries(cm,e){
  const pl=planOf(cm),b=[];
  if(pl&&pl.lines&&pl.sizes){let c=0;pl.sizes.forEach(n=>{c+=n;b.push(c);});return b;}
  if(pl&&pl.nums){let c=0;pl.nums.forEach(n=>{for(let j=0;j<pl.k;j++){c+=n;b.push(c);}});return b;}
  const sizes=capLines(cm).map(x=>x.n),sum=sizes.reduce((a,x)=>a+x,0),round=pl&&pl.size?pl.size:sum,rounds=Math.max(1,(e&&e.rounds)||1);
  if(!(round>0))return b;
  for(let r=0;r<rounds;r++){
    let c=r*round;
    if(sizes.length>1&&Math.abs(sum-round)<1e-9)sizes.forEach(n=>{c+=n;b.push(c);});else b.push((r+1)*round);
  }
  return b;
}
/* palier time cap : pct % des reps totales, arrondi à la fin du dernier exercice terminé, dans l'unité du score des athlètes */
function capTierValue(p,e,pct){
  const cm={format:p.format,content:p.content,repsRound:Number(p.repsRound)||0,lineRounds:p.format==='FT'&&!!p.lineRounds};
  const b=capBoundaries(cm,e);
  if(!b.length)return String(Math.max(1,Math.round(e.R*pct/100)));
  const target=b[b.length-1]*pct/100;let v=b[0];
  for(const x of b)if(x<=target+1e-9)v=x;
  return String(v);
}
/* ---------- paliers : toujours 10 paliers, de 10 à 1 point, points entiers (jamais de 0,5) ---------- */
function spreadTimes(lo,hi){ /* 10 temps croissants, multiples de 5 s */
  lo=Math.max(5,Math.round(lo/5)*5);hi=Math.floor(hi/5)*5;
  if(hi-lo<45)lo=Math.max(5,hi-45);
  if(hi-lo<45)hi=lo+45;
  const st=Math.max(5,Math.floor((hi-lo)/9/5)*5);
  return Array.from({length:10},(_,j)=>lo+j*st);
}
function spreadRounds(top,bottom){ /* 10 nombres de tours décroissants, au quart de tour */
  const t=Math.max(2.5,Math.round(top*4)/4),st=Math.max(.25,Math.round((t-bottom)/9*4)/4);
  return Array.from({length:10},(_,j)=>t-j*st);
}
const tourTxt=v=>String(v).replace('.',',');
/* AMRAP : 10 paliers en reps entières. Le palier à 10 points = tours estimés (au quart de tour) en reps, puis chaque palier est x % plus bas que le palier à 10 points, arrondi à la rep (ex. 247 reps, puis 235 à 5 %). */
function amrapRepTiers(est,pct,rr){
  const top=Math.max(1,Math.floor(Math.max(2.5,Math.round(est*4)/4)*rr+1e-9)),stp=top*pct/100,out=[];let prev=Infinity;
  for(let j=0;j<10;j++){let v=Math.round(top-j*stp);if(v>=prev)v=prev-1;if(v<1)break;out.push(v);prev=v;}
  return out;
}
const repsTxt=(v,tot)=>{const q=Math.floor(v/tot),r=v%tot;return r?q+'+'+r:String(q);};
function deadTiers(D,iv,pct){ /* Dead by : temps tenu décroissant depuis le time cap ; les points s'étalent de 10 à 1 */
  const n=Math.max(1,Math.floor(D/iv)),k=pct?Math.max(1,Math.round(D*pct/100/iv)):Math.ceil(n/10),times=[];
  for(let j=0;j<10;j++){const t=D-j*k*iv;if(t<=0)break;times.push(t);}
  const c=times.length;
  return times.map((t,j)=>({t:fmtTime(Math.round(t*60)),p:String(c>1?Math.round(10-9*j/(c-1)):10)}));
}
/* f = multiplicateur appliqué au temps « pur » (reps x secondes par rep) : transitions, fatigue, respirations */
const INTENS={max:{l:'À fond',f:1.2,d:'Tu pousses du début à la fin.'},allure:{l:'Gestion d’allure',f:1.45,d:'Tu gardes un rythme régulier, sans te vider.'},cool:{l:'Pas à fond',f:1.8,d:'Séance tranquille : tu gardes de la marge.'}};
const intF=k=>{const v=parseNum(String((S.prof&&S.prof.intf&&S.prof.intf[k])??''));return (v!==null&&v>=0.5&&v<=5)?v:INTENS[k].f;};
const SEC_EXTRA={'Back Squat':3.5,'Bench Press':3,'Shoulder Press':3,'Jerk':4,'Down Up':3,'Crunch mains sur les cuisses':2,'Sauts sans corde':.5,'Pompes sur genoux':2,'Snatch':4,'Clean':4};
const SEC_MAP={'Snatch':'Power Snatch','Row (rameur)':'Rameur'};
let _secAl=null;
function secAliases(){
  if(_secAl)return _secAl;
  const out=[];
  GEN.forEach(x=>{const n=norm(x[0]);out.push([n,x[5],x[0]],[n+'s',x[5],x[0]]);});
  GLOSS_AL.forEach(([al,gi])=>{
    const nm=GLOSS[gi][0],g=GEN.find(x=>x[0]===(SEC_MAP[nm]||nm));
    if(g)out.push([al,g[5],nm]);else if(SEC_EXTRA[nm]!==undefined)out.push([al,SEC_EXTRA[nm],nm]);
  });
  return _secAl=out.sort((a,b)=>b[0].length-a[0].length);
}
/* secondes par rep d'une ligne de mouvement (null si le mouvement n'est pas reconnu) */
function secOf(txt){
  const cfg=(S.prof&&S.prof.mvcfg)||{};
  if(Object.keys(cfg).length){ /* temps par rep réglé par le coach */
    for(const sp of mvSpans(txt)){const v=parseNum(String((cfg[sp.name]||{}).sec??''));if(v!==null&&v>0)return {sec:v,nm:sp.name};}
  }
  const t=norm(txt);
  for(const [al,sec,nm] of secAliases()){
    const i=t.indexOf(al);if(i<0)continue;
    const e=i+al.length;
    if((i===0||!/[a-z0-9]/.test(t[i-1]))&&(e>=t.length||!/[a-z0-9]/.test(t[e])))return {sec,nm};
  }
  return null;

/* lit le contenu d'un metcon : temps « pur » de tout le travail, reps totales, temps d'un tour */
function metEstimate(p){
  const lines=String(p.content||'').split('\n').map(s=>s.replace(WTAG,'').trim()).filter(Boolean);
  let rounds=1,nums=null;const items=[],unknown=[];
  for(const s of lines){
    if(LADDER.test(s)){nums=s.match(/^\d+(?:\s*[-–]\s*\d+)+/)[0].match(/\d+/g).map(Number);continue;}
    const rm=s.match(/^(\d+)\s*(?:rounds?|tours?|rft)\b/i);
    if(rm){rounds=+rm[1];continue;}
    if(NOT_REPS.test(s))continue;
    const dm=s.match(/^(\d+(?:[.,]\d+)?)\s*(km|m)\b\s*(.*)$/i);
    let n=null,txt=s,sec=null,nm=s;
    if(dm){ /* distance : allures réglables (défaut rameur 2:05 aux 500 m, course 5:00 au km) */
      const meters=parseNum(dm[1])*(dm[2].toLowerCase()==='km'?1000:1);
      const row=/ram|row|ski/i.test(dm[3]);
      items.push({n:1,sec:meters*paceSpm(row?'row':'run'),nm:dm[3]||'Distance',fixed:true});continue;
    }
    const m=s.match(/^(\d+)\s*(?:x\s*)?(.+)$/i);
    if(m){n=+m[1];txt=m[2];}
    else if(!nums)continue; /* ligne sans nombre hors schéma : titre ou consigne */
    const f=secOf(txt);
    if(f){sec=f.sec;nm=f.nm;}else{sec=3;unknown.push(txt);}
    items.push({n,sec,nm});
  }
  if(!items.length)return null;
  let T=0,R=0,roundTime=0,roundReps=0;
  if(nums){
    const sum=nums.reduce((a,b)=>a+b,0);
    items.forEach(it=>{
      if(it.fixed){T+=it.sec*nums.length;R+=nums.length;}
      else if(it.n===null){T+=sum*it.sec;R+=sum;}
      else{T+=nums.length*it.n*it.sec;R+=nums.length*it.n;}
    });
    roundTime=T/nums.length;roundReps=R/nums.length;
  }else{
    items.forEach(it=>{const n=it.fixed?1:it.n;roundTime+=n*it.sec;roundReps+=n;});
    T=roundTime*rounds;R=roundReps*rounds;
  }
  return {T,R,roundTime,roundReps,rounds,unknown};
}
/* remplit les paliers du metcon (Rx, puis les autres niveaux adaptés) à partir de l'intensité choisie */
function calcTiers(p){
  if(p.format==='EMOM'){
    const D=parseNum(p.dur||''),iv=parseNum(String(p.interval||'1'))||1;
    if(!(D>0)){toast('Indique le time cap (min) pour calculer les paliers.',true);return;}
    const tiers=deadTiers(D,iv,spreadPct('DEAD'));
    p.levels.forEach((lv,k)=>{if(k<2&&(lv.mode==='off'||lv.mode==='same'||p.syncTiers))return;lv.tiers=tiers.map(x=>({...x}));lv.pend=null;});
    p.levels[2].tiers=tiers.map(x=>({...x}));p.levels[2].pend=null;
    p.estInfo='Palier max (10 pts) : tenir '+tiers[0].t+' (tout le time cap), 1 point pour '+tiers[tiers.length-1].t+'. Mêmes paliers pour tous les niveaux.';
    render();return;
  }
  const I0=INTENS[p.intensity],I=I0?Object.assign({},I0,{f:intF(p.intensity)}):I0;
  if(!I){toast('Choisis d’abord l’intensité du metcon.',true);return;}
  const e=metEstimate(p);
  if(!e||!(e.T>0)){toast('Je ne trouve pas de reps ni de mouvement dans le contenu.',true);return;}
  const ft=p.format==='FT',dur=parseNum(p.dur||'');
  if(!ft&&!(dur>0)){toast('Indique la durée de l’AMRAP (min) pour calculer les paliers.',true);return;}
  /* mêmes paliers pour tous les niveaux : ce sont les variantes d'exercices qui font la différence */
  const build=k=>{
    const out=[];
    if(ft){
      const base=e.T*I.f,cap=dur>0?dur*60:0;
      spreadTimes(base,cap>0?Math.min(base*(1+9*spreadPct('FT')/100),cap):base*(1+9*spreadPct('FT')/100)).forEach((t,j)=>out.push({t:fmtTime(t),p:String(10-j)}));
    }else{
      const est=dur*60/(e.roundTime*I.f);
      const tot=eqTotal(amrapModel(p)),rr=(tot>0)?tot:e.roundReps;
      if(rr>0&&Number.isInteger(rr)){ /* paliers calculés en reps entières : même écart en % entre chaque palier, arrondi à la rep près */
        amrapRepTiers(est,spreadPct('AMRAP'),rr).forEach((v,j)=>out.push({t:(tot>0&&Number.isInteger(tot))?repsTxt(v,tot):tourTxt(Math.round(v/rr*100)/100),p:String(10-j)}));
      }else spreadRounds(est,est*(1-9*spreadPct('AMRAP')/100)).forEach((v,j)=>out.push({t:tourTxt(v),p:String(10-j)}));
    }
    return out;
  };
  p.levels.forEach((lv,k)=>{
    if(k<2&&(lv.mode==='off'||lv.mode==='same'||p.syncTiers))return;
    lv.tiers=build(k);lv.pend=null;
  });
  p.levels[2].tiers=build(2);p.levels[2].pend=null;
  if(ft){ /* palier time cap recalculé, comme les autres paliers, dans l'unité des scores (reps réelles cumulées) */
    const ct=[{t:capTierValue(p,e,spreadPct('CAP')),p:'1'}];
    p.levels.forEach((lv,k)=>{if(k===2||(lv.mode==='custom'&&!p.syncTiers))lv.capTiers=blankCapTiers().map((c,i)=>ct[i]||c);});
  }
  const top=p.levels[2].tiers[0];
  p.estInfo=(ft?'Palier max (10 pts) : '+top.t+' pour tous les niveaux, '+I.l.toLowerCase()+'.':'Palier max (10 pts) : '+top.t+' tours pour tous les niveaux, '+I.l.toLowerCase()+'.')
    +' Temps pur estimé '+fmtTime(Math.round(e.T))+' ('+fmtN(Math.round(e.R))+' reps)'+(ft?'':' par tour : '+fmtTime(Math.round(e.roundTime)))
    +(e.unknown.length?' · Mouvement non reconnu (3 s par rep supposées) : '+e.unknown.join(', '):'')+'. À ajuster à ta façon de coacher.';
  render();
}

function draftToWod(d){

      if(p.customLvl===false)o.customLvl=false;
      if(p.format==='FT'&&p.lineRounds)o.lineRounds=true;
      if(p.format==='EMOM'){
        const iv=parseNum(String(p.interval||'1').trim()||'1');
        if(iv===null||iv<=0)throw new Error('Intervalle illisible ('+o.label+') : écris 1 pour un EMOM, 2 pour un E2MOM, 3 pour un E3MOM…');
        o.interval=iv;

          if(!(o.dur>0)&&!metDuration({format:'EMOM',detail:p.detail,content:p.content}))throw new Error('Dead by ('+o.label+') : indique le time cap dans « Durée / time cap (min) ».');

          if(t===null||pts===null)throw new Error('Palier illisible ('+o.label+', '+name+')'+(p.format==='FT'?' : écris le temps comme 12:00.':(p.format==='EMOM'&&p.deadBy)?' : écris le temps tenu comme 14:00 (ou 14 pour 14 minutes).':' : écris un nombre de tours (ou « tours+reps », par exemple 6+7, si « Reps par tour » est renseigné).'));

/* ---------- réglage rapide des paliers ----------

   - changer l'intervalle ne touche pas aux paliers déjà remplis ;
   - un palier ajouté dans le désordre (le 18 oublié entre le 19 et le 17) se range tout seul : les scores glissent d'un cran, les POINTS restent à leur place. */

}
function stepParse(p,s){

    const x=t.match(/^(\d+)?\s*\+\s*(\d+)$/);
    if(x)return roundTotal(amrapModel(p))>0?{tours:+(x[1]||0),reps:+x[2]}:null;
    return /^\d+$/.test(t)?{tours:+t,reps:0}:null;

  if(k==='dead'){const v=parseHold(txt);if(v===null)return null;const n=v-st.sec;return n<0?null:fmtTime(n);}

function reslotTiers(rows,parse,asc){
  const idx=[],vals=[];
  for(let j=0;j<rows.length;j++){
    const s=String(rows[j].t).trim();if(s==='')continue;
    const v=parse(s);if(v===null)return false;
    idx.push(j);vals.push({s:rows[j].t,v,n:vals.length});
  }
  const sorted=vals.slice().sort((x,y)=>((asc?x.v-y.v:y.v-x.v)||x.n-y.n));
  let changed=false;
  idx.forEach((j,n)=>{if(rows[j].t!==sorted[n].s){rows[j].t=sorted[n].s;changed=true;}});

  const idx=[],vals=[];

    const s=String(rows[j].p).trim();if(s==='')continue;
    const v=parseNum(s);if(v===null)return false;
    idx.push(j);vals.push({s:rows[j].p,v,n:vals.length});
  }
  const sorted=vals.slice().sort((x,y)=>(y.v-x.v)||x.n-y.n);

const kgNum=t=>{const m=String(t||'').trim().match(/^(\d+(?:[.,]\d+)?)\s*kg$/i);return m?parseFloat(m[1].replace(',','.')):null;};
function wodIssues(w,editing){
  const out=[],W=(t)=>out.push({k:'warn',t}),I=(t)=>out.push({k:'info',t});
  const today=todayStr(),old=S.wods[w.date];
  if(!editing&&old)W('Une séance existe déjà ce jour-là (« '+old.title+' ») : elle sera remplacée.');
  if(!editing&&w.date<today)W('La date est dans le passé ('+cap(fmtShort(w.date))+').');
  if(w.date>dfmt(new Date(Date.now()+45*864e5)))W('La date est dans plus de 45 jours : vérifie le mois et l’année.');
  if(!periodFor(w.date))W('Aucune saison ne couvre cette date : la séance ne comptera pour aucune saison.');
  if(!w.parts.some(p=>p.kind==='metcon'))I('Aucun metcon : pas de points de performance ce jour-là.');
  w.parts.forEach(p=>{
    const L=p.label+' · '+(p.name||KIND[p.kind]);
    if(!p.name)W(p.label+' : la partie n’a pas de nom.');
    if(!p.content)W(L+' : le contenu est vide.');
    if(p.kind==='force'&&!p.movement)W(L+' : le mouvement de force n’est pas indiqué.');
    if(p.kind!=='metcon')return;
    if(!FOCUS[p.focus])W(L+' : la catégorie (cardio, gym ou haltéro) n’est pas choisie.');
    const dur=metDuration(p);
    if(p.format!=='FT'&&!dur)W(L+' : pas de durée ni de time cap.');
    if(p.format==='FT'&&!dur)I(L+' : pas de time cap.');
    if(p.format==='EMOM'&&dur&&Math.abs(dur/60/emomIv(p)-Math.round(dur/60/emomIv(p)))>1e-6)I(L+' : le time cap n’est pas un multiple de l’intervalle de '+fmtN(emomIv(p))+' min.');
    const lvs=p.levels||[];
    lvs.forEach((l,k)=>{
      const nm=LEVEL_NAMES[k];
      if(!l.tiers||!l.tiers.length)W(L+' · '+nm+' : aucun palier, donc pas de points de performance.');
      else for(let j=1;j<l.tiers.length;j++)if(l.tiers[j].p>l.tiers[j-1].p){W(L+' · '+nm+' : un moins bon score rapporte plus de points (paliers incohérents).');break;}
      if(!!l.loadF!==!!l.loadH)W(L+' · '+nm+' : charge '+(l.loadF?'hommes':'femmes')+' manquante.');
      const f=kgNum(l.loadF),hh=kgNum(l.loadH);
      if(f!==null&&hh!==null&&f>hh)W(L+' · '+nm+' : la charge femmes ('+l.loadF+') dépasse la charge hommes ('+l.loadH+').');
      if(k<2&&lvs[2]){
        const rf=kgNum(lvs[2].loadF),rh=kgNum(lvs[2].loadH);
        if(f!==null&&rf!==null&&f>rf)W(L+' · '+nm+' : charge femmes supérieure à celle du Rx.');
        if(hh!==null&&rh!==null&&hh>rh)W(L+' · '+nm+' : charge hommes supérieure à celle du Rx.');
      }
    });
    if(lvs[2]&&(lvs[2].loadF||lvs[2].loadH))lvs.forEach((l,k)=>{if(k<2&&!l.loadF&&!l.loadH)I(L+' · '+LEVEL_NAMES[k]+' : aucune charge indiquée.');});
    const skip=/^(\d+([-–]\d+)*|\d+\s*rounds?|rest.*|repos.*|puis|then|amrap.*|emom.*|for time.*)$/i;
    const unk=String(p.content||'').split('\n').map(x=>x.replace(WTAG,'').trim()).filter(x=>x&&!skip.test(x)&&!mvSpans(x).length);
    if(unk.length)I(L+' : mouvement non reconnu (pas de fiche cliquable) : '+unk.slice(0,3).map(x=>'« '+x+' »').join(', ')+(unk.length>3?'…':'')+'.');
  });
  return out;
}
function tierSum(p,tiers){

  const f=t=>p.format==='FT'?'≤ '+fmtTime(t.t):dead?'≥ '+fmtTime(t.t):'≥ '+roundsLabel(p,t.t);

function maybeRewardPopup(){
  if(!S.uid||!ready()||S._rewardPopupOpen)return;
  const per=periodFor(todayStr())||activePeriod();
  if(!per||per.virtual||periodState(per)==='soon'||!Array.isArray(per.rewards)||!per.rewards.length)return;
  const xp=seasonXp(S.uid,per),lg=S.logs[S.uid]||{},seen=new Set(lg.rewardSeen||[]);
  const rw=per.rewards.find(r=>Number(r.xp)>=0&&xp>=Number(r.xp)&&!seen.has(per.id+':'+r.id));
  if(!rw)return;
  S._rewardPopupOpen=true;
  const pop=h('div',{class:'reward-pop',role:'dialog','aria-modal':'true','aria-label':'Récompense débloquée'});
  const finish=async(equip=false)=>{
    // Fermer immédiatement la fenêtre, mais garder le verrou pendant la sauvegarde
    // pour empêcher un autre rendu de rouvrir la même récompense.
    pop.remove();
    const key=per.id+':'+rw.id;
    const curLog=S.logs[S.uid]||{};
    const next=[...new Set([...(curLog.rewardSeen||[]),key])];
    const owned=[...new Set([...(curLog.rewardOwned||[]),key])];
    const patch={rewardSeen:next,rewardOwned:owned};
    // Enregistrer localement dès maintenant : la récompense ne doit pas réapparaître
    // pendant que Firestore sauvegarde. Elle n'est équipée que si le bouton le demande.
    S.logs[S.uid]=Object.assign({},curLog,{rewardSeen:next,rewardOwned:owned});
    // Débloquer une récompense ne l'équipe jamais automatiquement : seule l'action « Équiper » modifie l'apparence.
    if(equip&&rw.type==='avatar'&&rw.asset&&AV_BY[rw.asset]){
      const cur=curLog.avatar||{};
      patch.avatar=Object.assign({},cur,{[AV_BY[rw.asset].slot]:rw.asset});
    }else if(equip&&['title','frame','bg','avframe'].includes(rw.type)){
      const cur=curLog.banner||{};
      const nextBanner=Object.assign({},cur);
      if(rw.type==='title'){BN.title[rw.id]={text:rw.name||'Champion'};nextBanner.title=rw.id;}
      if(rw.type==='frame'){BN.frame[rw.id]={name:rw.name||'Encadré',cls:'reward-frame'};nextBanner.frame=rw.id;}
      if(rw.type==='bg'){BN.bg[rw.id]={name:rw.name||'Fond de bannière',cls:bgRewardClass(rw)};nextBanner.bg=rw.id;}
      if(rw.type==='avframe'){BN.avframe[rw.id]={name:rw.name||'Cadre d’avatar',src:avfSrc(rw)};nextBanner.avframe=rw.id;}
      patch.banner=nextBanner;
    }
    if(patch.avatar)S.logs[S.uid].avatar=patch.avatar;
    if(patch.banner)S.logs[S.uid].banner=patch.banner;
    try{await saveLog(patch);}finally{
      S._rewardPopupOpen=false;
      S._ob=null;S._aw=null;render();
    }
  };
  const close=()=>finish(false),equip=()=>finish(true);
  pop.append(h('div',{class:'rp-card'},h('p',{class:'eyebrow'},'Récompense débloquée'),
    rewardImage(rw),h('h2',{class:'wtitle'},rw.name||'Nouvelle récompense'),
    h('p',{class:'muted'},(rw.type==='avatar'?'Cosmétique avatar':rw.type==='title'?'Titre':rw.type==='frame'?'Encadré de bannière':rw.type==='avframe'?'Cadre d’avatar (fil)':rw.type==='joker'?'Joker':'Fond de bannière')+' · '+rw.xp+' XP'),
    h('p',{},rw.type==='joker'?'Tu gagnes un joker ! Il sauve une flamme (série ou temps au top) qui s’éteint à cause d’une seule séance ratée. Retrouve-le dans « Mes flammes », sur ton profil.':'Tu viens de débloquer cette récompense !'),
    h('div',{class:'row',style:'justify-content:center'},
      rw.type==='joker'?h('button',{class:'btn primary',type:'button',onclick:close},'Super !'):h('button',{class:'btn',type:'button',onclick:close},'Fermer'),
      rw.type==='joker'?null:h('button',{class:'btn primary',type:'button',onclick:equip},'Équiper'))));
  document.body.append(pop);
}

/* ---------- fenêtre « Nouvel objet d'avatar débloqué » ----------
   Les objets d'avatar sont calculés (avState), jamais stockés : on mémorise donc ceux déjà annoncés dans logs/{uid}.avSeen.
   Tout objet acquis qui n'y figure pas est présenté dans une fenêtre (nom, emplacement, condition, bouton Équiper).
   Les objets venant d'une récompense de saison à XP ont déjà leur propre fenêtre (maybeRewardPopup) : ils ne sont pas annoncés deux fois.
   Le coach est concerné comme les athlètes : on se base sur les objets réellement acquis (avState().earned), pas sur l'accès de test à tous les cosmétiques.
   AV_SEED_SILENT=true : à la première ouverture après la mise à jour, les objets déjà possédés ne sont pas annoncés (seuls les suivants le seront). */
const AV_SEED_SILENT=false;

    S.logs[S.uid]=Object.assign({},cur,{avSeen:next});

      S.logs[S.uid]=Object.assign({},cur,{avatar:av});

    return h('div',{class:'avu-row'},art,
      h('div',{class:'avu-txt'},h('div',{class:'nm'},it.name),h('div',{class:'sub'},slotName(it)),h('div',{class:'sub'},'Condition : '+cond(id))),btn);
  };
  pop.append(h('div',{class:'rp-card'},
    h('p',{class:'eyebrow'},fresh.length>1?'Nouveaux objets débloqués':'Nouvel objet débloqué'),
    h('h2',{class:'wtitle'},fresh.length>1?fresh.length+' objets pour ton avatar':fresh.length===1?AV_BY[fresh[0]].name:''),
    h('div',{class:'avu-list'},fresh.map(row)),

    h('div',{class:'row',style:'justify-content:center'},h('button',{class:'btn primary',type:'button',id:'avu-ok',onclick:close},'Super !'))));
  document.body.append(pop);
}

function authErr(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found/.test(c))return 'E-mail ou mot de passe incorrect.';
  if(c==='auth/email-already-in-use')return 'Un compte existe déjà avec cet e-mail. Utilise « Se connecter ».';
  if(c==='auth/weak-password')return 'Mot de passe trop court : 6 caractères minimum.';
  if(c==='auth/invalid-email')return 'Adresse e-mail invalide.';
  if(c==='auth/too-many-requests')return 'Trop d’essais. Attends quelques minutes.';
  if(c==='auth/network-request-failed')return 'Pas de connexion internet.';
  if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';
  if(c==='auth/operation-not-allowed')return 'Cette méthode de connexion n’est pas activée dans Firebase.';
  return 'Connexion impossible, réessaie.';
}

    if(document.hidden){hiddenAt=Date.now();return;}
    if(hiddenAt&&Date.now()-hiddenAt>30*60*1000&&!document.getElementById('tm-ov')){S._annDone=false;annTries=0;setTimeout(maybeAnnouncement,800);}
    hiddenAt=0;
  });
  if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='go'&&GO_TABS.includes(d.go)&&S.uid){if(d.go==='today')S.viewDate=null;go(d.go);}});
  setTimeout(()=>checkVersion(true),1500);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion();});
  setInterval(checkVersion,300000);
  window.addEventListener('focus',()=>checkVersion());
  window.addEventListener('online',()=>checkVersion(true));
  window.addEventListener('pageshow',()=>checkVersion(true));
  /* démarrage : la page est dessinée tout de suite ; Firebase se branche dès que son SDK est là.
     Sans réponse au bout de 3 s, on affiche les dernières données enregistrées sur l'appareil (mode cache). */
  let launched=false;
  const launch=()=>{if(launched)return;launched=true;S.snapMode=false;startFirebase();};
  sdkPromise.then(launch,()=>{S.sdkFail=true;if(!S.uid&&!enterSnapMode())render();window.addEventListener('online',()=>{if(!launched)location.reload();},{once:true});});
  setTimeout(()=>{if(S.authReady)return;S.slow=true;if(!enterSnapMode())render();},3000);
  render();
}
function startFirebase(){
  const bad=!firebaseConfig||!firebaseConfig.apiKey||String(firebaseConfig.apiKey).indexOf('COLLE')===0;
  if(bad){S.cacheMode=false;S.authReady=true;render();return;}
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  let fdb,persist=true;
  try{fdb=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}
  catch(e){persist=false;fdb=getFirestore(app);} /* navigateur sans stockage local : l'appli marche, mais sans mode hors ligne */
  S.db=makeDb(fdb);
  /* mode cache : si les données ne sont pas là après 3 s, on coupe le réseau de Firestore pour qu'il serve tout de suite son cache local,
     puis on le rallume : la mise à jour se fait en arrière-plan dès que le réseau répond */
  let cacheT=null;
  const backOnline=()=>{if(!S._netOff)return;S._netOff=false;try{enableNetwork(fdb).catch(()=>{});}catch(e){}};
  const goCache=()=>{if(S._netOff)return;S._netOff=true;S.cacheMode=true;try{disableNetwork(fdb).catch(()=>{});}catch(e){S._netOff=false;}scheduleRender();setTimeout(backOnline,2500);};
  netState.onChange=scheduleRender;
  netState.onLateError=e=>toast('Une saisie faite hors ligne a été refusée : '+errMsg(e),true);
  window.addEventListener('offline',scheduleRender);
  window.addEventListener('online',scheduleRender);
  /* service worker pour tout le monde (mode hors ligne) : le même fichier que celui des notifications */
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))setTimeout(()=>{navigator.serviceWorker.register(PUSH_SW).catch(()=>{});},1500);
  render();
  let unsubs=[];
  onAuthStateChanged(auth,user=>{
    unsubs.forEach(u=>u());unsubs=[];
    S.loaded={periods:false,wods:false,logs:false};S.periods={};S.wods={};S.logs={};S.prof={prs:{},sex:'',weight:0};S.profLoaded=false;
    S.sexSync=null;S.coachUid=null;S.coachLoaded=false;S.owner=false;S.error=null;S.entry=null;S.redo=null;S.viewDate=null;S.confirm=null;S.cerAuto=false;S._annDone=false;S.ann=null;S.annLoaded=false;S._aw=null;S.groups={list:[],of:{},snap:{}};S._freezing=false;S.boardGroup=undefined;S.comments={};S.cacheMode=false;S.snapMode=false;S._srv={};S._netOff=false;clearTimeout(cacheT);S.reactions={};S.wu={cfg:null,loaded:false,list:false};
    S.coach={wod:null,editing:false,period:null,resDate:null};S.avisFor=null;S.profView=null;S.viewUser=null;S.tip=null;S.tab=user?takeInitialTab():'feed';S.authReady=true;
    if(!user){S.uid=null;try{localStorage.removeItem(SNAP_KEY);}catch(e){}render();return;}
    S.uid=user.uid;setTimeout(pushSync,2500);S.meName=user.displayName||(user.email||'').split('@')[0]||'';
    const fail=e=>{S.error=(e&&e.code==='permission-denied')?'Accès refusé par la base de données. Publie les règles de sécurité (voir README).':'Lecture des données impossible pour le moment.';scheduleRender();};
    const watch=(path,key)=>unsubs.push(S.db.collection(path).onSnapshot(sn=>{S[key]=Object.fromEntries(sn.docs.map(d=>[d.id,d.data()]));S.loaded[key]=true;S._srv[key]=!sn.fromCache;
      if(S._netOff&&ready())backOnline();
      if(S.cacheMode&&S._srv.periods&&S._srv.wods&&S._srv.logs)S.cacheMode=false;
      if(!S.cacheMode)snapSave();
      scheduleRender();if(key==='logs')selfSync();},fail,true));
    watch('periods','periods');watch('wods','wods');watch('logs','logs');
    if(persist)cacheT=setTimeout(()=>{if(S.uid===user.uid&&!ready()&&snapRead()&&snapRead().uid===user.uid)goCache();},3000);
    unsubs.push(S.db.doc('config/coach').onSnapshot(sn=>{S.coachUid=sn.exists?(sn.data().uid||null):null;S.coachLoaded=true;S.owner=!!S.coachUid&&S.coachUid===S.uid;wuMaybeSeed();scheduleRender();},fail));
    /* les groupes ne bloquent jamais l'appli : si les règles ne sont pas encore publiées, on ignore l'erreur */
    unsubs.push(S.db.doc('config/groups').onSnapshot(sn=>{const d=sn.exists?sn.data():null;S.groups={list:(d&&Array.isArray(d.list))?d.list:[],of:(d&&d.of&&typeof d.of==='object')?d.of:{},snap:(d&&d.snap&&typeof d.snap==='object')?d.snap:{},loaded:true};S._freezing=false;scheduleRender();},()=>{}));
    /* message du coach : si les règles ne sont pas publiées, on ignore l'erreur */
    unsubs.push(S.db.doc('config/announcement').onSnapshot(sn=>{S.ann=sn.exists?sn.data():null;S.annLoaded=true;scheduleRender();},()=>{S.annLoaded=true;scheduleRender();}));
    /* échauffement guidé : si les règles ne sont pas publiées, l'appli utilise la version intégrée et ne tente aucune écriture */
    unsubs.push(S.db.doc('config/warmup').onSnapshot(sn=>{const d=sn.exists?sn.data():null;S.wu.cfg=(d&&Array.isArray(d.items))?d:null;S.wu.loaded=true;S.wu.err=false;S.wu.fromCache=!!sn.fromCache;wuMaybeSeed();scheduleRender();},()=>{S.wu.loaded=true;S.wu.err=true;scheduleRender();}));
    /* messages de la remise des trophées : si les règles ne sont pas publiées, on ignore l'erreur */
    unsubs.push(S.db.collection('comments').onSnapshot(sn=>{S.comments=Object.fromEntries(sn.docs.map(d=>[d.id,d.data()]));if(S.cerRefresh)S.cerRefresh();},()=>{}));
    /* réactions emoji : si les règles ne sont pas publiées, on ignore l'erreur */
    unsubs.push(S.db.collection('reactions').onSnapshot(sn=>{S.reactions=Object.fromEntries(sn.docs.map(d=>[d.id,d.data()]));scheduleRender();},()=>{}));
    unsubs.push(S.db.doc('users/'+S.uid+'/private/profile').onSnapshot(sn=>{const d=sn.exists?sn.data():null;S.prof={prs:(d&&d.prs)?JSON.parse(JSON.stringify(d.prs)):{},sex:(d&&d.sex)||'',birth:(d&&typeof d.birth==='string')?d.birth:'',genEx:(d&&Array.isArray(d.genEx))?d.genEx:null,genAll:(d&&Array.isArray(d.genAll))?d.genAll:null,words:(d&&Array.isArray(d.words))?d.words:[],mvcfg:(d&&d.mvcfg&&typeof d.mvcfg==='object')?JSON.parse(JSON.stringify(d.mvcfg)):{},revd:(d&&d.revd&&typeof d.revd==='object')?JSON.parse(JSON.stringify(d.revd)):{},intf:(d&&d.intf&&typeof d.intf==='object')?JSON.parse(JSON.stringify(d.intf)):{},pace:(d&&d.pace&&typeof d.pace==='object')?JSON.parse(JSON.stringify(d.pace)):{},spread:(d&&d.spread&&typeof d.spread==='object')?JSON.parse(JSON.stringify(d.spread)):{},weight:(d&&Number(d.weight)>0)?Number(d.weight):0};S.profLoaded=true;scheduleRender();selfSync();},fail));
    render();
  });
}
init();
})();
