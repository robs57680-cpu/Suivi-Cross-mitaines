<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D8321A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Box Score">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Box Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a gym whiteboard column. Barbell wordmark on top, scoreboard panel for stats, weight plates as ranks and trophies.
   Light = concrete floor, dark = rubber floor. Anton for headings and numerals, Work Sans for text, Plex Mono for scores. */
:root{
  --bg:#E2E4E6; --surface:#FFFFFF; --surface2:#F0F1F2; --ink:#0D0F12; --muted:#58606A; --line:#C3C8CD; --edge:#0D0F12;
  --accent:#D8321A; --accent-ink:#FFFFFF; --tint:#FCE4DF;
  --panel:#0D0F12; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
  --ok:#17803F; --danger:#B3261E;
  --plate-red:#D92B1F; --plate-blue:#1F55D6; --plate-yellow:#F4C400; --plate-green:#1E9B4A; --plate-black:#1B1D20; --plate-white:#F3F3F1;
  --f-display:'Anton','Impact','Arial Narrow',sans-serif;
  --f-body:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0C0E; --surface:#16181B; --surface2:#1E2125; --ink:#F2F2EF; --muted:#9BA2A9; --line:#2B2F34; --edge:#3A3F45;
    --accent:#FF4B27; --accent-ink:#1A0A06; --tint:#2A1B18;
    --panel:#1D2024; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
    --ok:#5CCB92; --danger:#FF8A80; --plate-black:#2A2D31;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --surface:#16181B; --surface2:#1E2125; --ink:#F2F2EF; --muted:#9BA2A9; --line:#2B2F34; --edge:#3A3F45;
  --accent:#FF4B27; --accent-ink:#1A0A06; --tint:#2A1B18;
  --panel:#1D2024; --panel-ink:#F4F4F1; --panel-muted:#9AA3AB; --panel-accent:#FF5A36;
  --ok:#5CCB92; --danger:#FF8A80; --plate-black:#2A2D31;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.shell{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px;min-width:0}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;border-bottom:2px solid var(--edge);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:26px;letter-spacing:.06em;line-height:1}
.bb{width:58px;height:20px;color:var(--ink);flex:none}
.bb .pl{fill:var(--accent)}
.bb rect{fill:currentColor}
.bb .pl{fill:var(--accent)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day{font-family:var(--f-display);font-weight:400;font-size:46px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.wtitle{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;text-transform:uppercase;text-wrap:balance}
.h2{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.h2::after{content:"";flex:1;height:2px;background:var(--edge);opacity:.25}

/* blocs */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:4px;padding:16px;display:grid;gap:12px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--edge);border-radius:2px;padding:1px 8px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:transparent;white-space:nowrap}
.chip.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.done{color:var(--muted);border-color:var(--line)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip.load{background:var(--tint);border-color:transparent;color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px}
.chip.miss{border-style:dashed;border-color:var(--line);color:var(--muted);text-transform:none;letter-spacing:0}
.btn{border:2px solid var(--edge);background:transparent;border-radius:4px;padding:10px 16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:12px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.field{display:grid;gap:4px;min-width:0}
.flabel{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;background:var(--surface2);border:2px solid var(--line);border-radius:4px;padding:10px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.link{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font-weight:600}

/* séance, façon tableau blanc de la box */
.part{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:14px;background:var(--surface);border:2px solid var(--edge);border-radius:4px}
.plabel{font-family:var(--f-display);font-size:28px;line-height:1;display:grid;place-items:center;height:48px;background:var(--ink);color:var(--bg);border-radius:2px}
.plabel.sm{height:34px;width:48px;font-size:20px}
.metcon{border-color:var(--accent)}
.metcon .plabel,.plabel.on{background:var(--accent);color:var(--accent-ink)}
.pbody{display:grid;gap:8px;min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.phead h3{font-weight:700;font-size:17px}
.fmt{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.line{overflow-wrap:anywhere}
.lines{display:grid;gap:6px}
.tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tier{font-family:var(--f-mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;padding:2px 8px}

/* disques */
.plate{--pc:var(--plate-black);--pi:#FFFFFF;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--pi);
  background:radial-gradient(circle,transparent 0 44%,rgba(0,0,0,.32) 45% 48%,transparent 49% 100%),var(--pc);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.2),inset 0 0 0 4px rgba(0,0,0,.28)}
.plate svg{width:26px;height:26px}
.t-goat{--pc:var(--plate-red)}
.t-regulier{--pc:var(--plate-green)}
.t-serie{--pc:var(--plate-blue)}
.t-perf{--pc:var(--plate-yellow);--pi:#14161A}
.t-fort{--pc:var(--plate-black)}
.t-cardio{--pc:var(--plate-white);--pi:#14161A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.08)}
.plate.off{filter:grayscale(1);opacity:.3}

/* classement */
.lb{list-style:none;margin:0;padding:0;border:2px solid var(--edge);border-radius:4px;background:var(--surface);overflow:hidden}
.lb li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb li.me{background:var(--tint)}
.rank{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;line-height:1;border:2px solid var(--line);color:var(--muted)}
.rank.r1,.rank.r2,.rank.r3{border-color:transparent;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),inset 0 0 0 4px rgba(0,0,0,.25);color:#FFFFFF}
.rank.r1{background:var(--plate-red)}
.rank.r2{background:var(--plate-blue)}
.rank.r3{background:var(--plate-yellow);color:#14161A}
.nm{font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.pts{font-family:var(--f-display);font-size:30px;line-height:1;text-align:right}
.pts small{display:block;font-family:var(--f-mono);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}

/* trophées */
.trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.trophy{background:var(--surface);border:2px solid var(--edge);border-radius:4px;padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.trophy .tn{font-family:var(--f-display);font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.trophy .td{font-size:12px;color:var(--muted)}
.trophy .tw{font-weight:700;overflow-wrap:anywhere;margin-top:6px}
.trophy.mine{background:var(--tint)}

/* tableau de score du profil */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));background:var(--panel);color:var(--panel-ink);border-radius:4px}
.stat{padding:14px 14px 12px;border-right:1px solid rgba(255,255,255,.14);min-width:0}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1}
.stat:first-child b{color:var(--panel-accent)}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--panel-muted)}
.tally-row{display:grid;gap:6px;padding:12px 14px;border:2px solid var(--edge);border-radius:4px;background:var(--surface)}
.tally{display:flex;flex-wrap:wrap;gap:6px;color:var(--ink)}
.tally svg{display:block;height:26px;width:auto}

.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.list li:last-child{border-bottom:0}
.list .l{min-width:0;overflow-wrap:anywhere}
.pr{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr-top{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center}
.pct{display:flex;flex-wrap:wrap;gap:6px}
.pct span{font-family:var(--f-mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;padding:2px 6px}
.pedit{border:2px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:10px;background:var(--surface2)}
.pedit-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pedit-head select{width:auto;flex:1;min-width:120px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.banner{border:2px solid var(--edge);background:var(--surface);border-radius:4px;padding:14px;display:grid;gap:10px;margin-bottom:16px}
.banner.warn{border-color:var(--accent)}
.preview{font-family:var(--f-mono);font-size:14px;font-weight:600}
.empty{border:2px dashed var(--line);border-radius:4px;padding:20px;display:grid;gap:10px;color:var(--muted)}

/* navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;background:none;border:0;border-top:5px solid transparent;margin-top:-2px;padding:12px 4px 10px;font-family:var(--f-display);font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;z-index:20;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:4px;padding:10px 14px;font-weight:700;max-width:100%}
.toast.bad{background:var(--danger);color:#fff}
@media (max-width:420px){.day{font-size:38px}.pr-top{grid-template-columns:minmax(0,1fr) 90px}.pr-top .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .08s}.btn:active{transform:scale(.98)}}

/* ajouts : saisons, niveaux, objectif */
.brand span{white-space:nowrap}
.tab{font-size:clamp(13px,4.2vw,17px);letter-spacing:.03em;min-width:0;padding-inline:2px;white-space:nowrap}
.ttop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ttop .tn{flex:1;min-width:0}
.stamp{flex:none;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--accent);color:var(--accent);padding:1px 6px;border-radius:2px;transform:rotate(-4deg);white-space:nowrap}
.t-mcardio{--pc:#F07A18}
.t-mgym{--pc:#8B929A;--pi:#14161A}
.t-mhaltero{--pc:var(--plate-white);--pi:#14161A;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.08)}
.t-objectif{--pc:#7B3FC4}
.t-ratio{--pc:#C2185B}
.levels{display:grid;gap:8px}
.lvl{border:1.5px solid var(--line);border-radius:4px;padding:10px;display:grid;gap:6px;background:var(--surface2)}
.lvl-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.lvl-load{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--accent)}
.lvl-edit{border:2px solid var(--line);border-radius:4px;padding:10px;display:grid;gap:10px;background:var(--surface)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg .btn{padding:8px 2px;font-size:11px;letter-spacing:0}
.seg .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--edge)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip.lv{margin-left:8px;background:var(--tint);border-color:transparent;color:var(--ink);vertical-align:middle;text-transform:none;letter-spacing:0;font-size:12px}
.t-points{--pc:#0E8A8A}
.mv{background:none;border:0;padding:0;font:inherit;font-weight:700;color:inherit;text-decoration:none;cursor:pointer;text-align:left}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:grid;align-items:end;justify-items:center}
.sheet{background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:4px 4px 0 0;width:100%;max-width:720px;max-height:85vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet ul{margin:4px 0 0;padding-left:20px;display:grid;gap:4px}
.gok{color:var(--ok)}.gno{color:var(--danger)}
.chip.under{color:var(--plate-blue);border-color:var(--plate-blue)}
.bar{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%}
.mrow{display:grid;gap:4px;min-width:0}
.pts.vsm{font-family:var(--f-mono);font-size:13px;font-weight:600;max-width:130px}

/* flammes : série en cours et temps au top */
.t-top{--pc:#5B86C9}
.t-lagoat{--pc:#B5179E}
.t-lafort{--pc:#8E2C7A}
.flames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fbox{display:grid;gap:4px;justify-items:center;text-align:center;align-content:end;padding:12px 8px;border:2px solid var(--edge);border-radius:4px;background:var(--surface2);min-width:0}
.fstage{height:92px;display:flex;align-items:flex-end;justify-content:center}
.flame{position:relative;flex:none}
.flame svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%}
.fnum{position:absolute;left:0;right:0;top:72%;transform:translateY(-50%);text-align:center;font-family:var(--f-display);line-height:1;color:#4A0E00;text-shadow:0 1px 2px rgba(255,255,255,.5)}
.flame.plat .fnum{color:#0F2A5C}
.flame.off{filter:grayscale(1);opacity:.35}
.flame.fire svg{animation:flick 1.7s ease-in-out infinite,shimF 4.5s ease-in-out infinite}
.flame.plat svg{animation:flick 2.3s ease-in-out infinite,shimP 5s ease-in-out infinite}
.flame .sheen{animation:sheen 3.2s ease-in-out infinite}
.flame.off svg,.flame.off .sheen{animation:none}
.flame.off .sheen{opacity:0}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.97,1.04) skewX(-1.5deg)}50%{transform:scale(1.03,.98) skewX(1deg)}75%{transform:scale(.98,1.03) skewX(1.5deg)}}
@keyframes shimF{0%,100%{filter:hue-rotate(-14deg) brightness(1) drop-shadow(0 0 6px rgba(255,110,0,.55))}50%{filter:hue-rotate(24deg) brightness(1.15) drop-shadow(0 0 13px rgba(255,200,0,.85))}}
@keyframes shimP{0%,100%{filter:hue-rotate(-10deg) brightness(1) drop-shadow(0 0 6px rgba(120,170,255,.55))}50%{filter:hue-rotate(12deg) brightness(1.18) drop-shadow(0 0 14px rgba(220,235,255,.95))}}
@keyframes sheen{0%{transform:translateX(-24px) skewX(-18deg);opacity:0}15%{opacity:1}60%{opacity:1}100%{transform:translateX(80px) skewX(-18deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.flame svg,.flame .sheen{animation:none!important}}

/* infobulles, bouton d'info, minuteur FT */
.tip{background:var(--panel);color:var(--panel-ink);border-radius:4px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:grid;gap:8px;font-size:14px;margin-top:8px}
.tip .sub{color:var(--panel-muted)}
.tip .tier{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--panel-ink)}
.tip .lvl-load{color:var(--panel-accent)}
.tipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qbtn{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--edge);background:var(--surface);font-family:var(--f-display);font-size:17px;line-height:1;cursor:pointer;padding:0;display:grid;place-items:center}
.qbtn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tm-tap.sm{min-height:22vh}
.tm-end{width:100%;min-height:72px;font-size:20px}
.fbox .fhead{display:none}
/* badges et remise des trophées */
#toast{z-index:50}
.badge{display:inline-block;flex:none;vertical-align:middle;border-radius:50%;line-height:0}
.badge svg{display:block;width:100%;height:100%;overflow:visible}
.badge.mini{margin-left:6px;vertical-align:-.4em}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.bsel{display:grid;justify-items:center;align-content:start;gap:4px;padding:12px 8px;border:2px solid var(--line);border-radius:4px;background:var(--surface2);color:var(--ink);cursor:pointer;text-align:center;min-width:0}
.bsel[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.bsel:disabled{cursor:default}

function h(tag,attrs,...kids){
  const el=document.createElement(tag);let val;
  if(attrs)for(const [k,v] of Object.entries(attrs)){
    if(v===undefined||v===null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='value')val=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(const c of kids.flat(Infinity)){if(c===null||c===undefined||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}
  if(val!==undefined)el.value=val;
  return el;
}

}

function activePeriod(){const l=plist();if(!l.length)return ALL;const t=todayStr();const cur=l.filter(p=>inP(t,p));if(cur.length)return cur[cur.length-1];const past=l.filter(p=>p.end<t);return past.length?past[past.length-1]:l[0];}
function selPeriod(){const l=plist();if(!l.length)return ALL;return l.find(p=>p.id===S.periodId)||activePeriod();}

const activeLevels=m=>levelsOf(m).map((lv,i)=>[lv,i]).filter(x=>!x[0].off);
const okLvl=(m,l)=>{const a=activeLevels(m);if(!a.length||a.some(x=>x[1]===l))return l;return a.reduce((b,x)=>Math.abs(x[1]-l)<Math.abs(b-l)?x[1]:b,a[0][1]);};
const LEVEL_DIV=2; /* multiplicateur du GOAT = niveau moyen / 2 (niveau 2,6 = x1,3) */
/* valeur de chaque niveau pour la moyenne et la pondération : Débutant 2, Intermédiaire 2,5, Rx 3 */
const LV_VAL=[2,2.5,3];
const LV_ABBR=['DEB','INT','RX'];
/* valeur de niveau d'un résultat : niveau choisi + paliers de 0,2 par tranche de 10 % de charge (Rx +10 % = 3,2 ; Débutant −10 % = 1,8 ; −50 % = 1) */
const lvVal=e=>Math.max(1,Math.min(3.6,LV_VAL[Math.max(0,Math.min(2,e.level||0))]+(Number(e.adj)||0)/50));
/* niveau le plus proche d'une moyenne (à égalité, le plus haut) */
function lvNear(avg){let b=0;for(let i=1;i<3;i++)if(Math.abs(avg-LV_VAL[i])<=Math.abs(avg-LV_VAL[b])+1e-9)b=i;return b;}
/* niveau affiché : le plus proche, avec + ou - s'il n'est pas exact (2,6 = INT+, 2,9 = RX-, 2 = DEB) */
const lvTag=avg=>{const i=lvNear(avg),d=avg-LV_VAL[i];return LV_ABBR[i]+(Math.abs(d)<0.005?'':d>0?'+':'-');};
const dispLvl=n=>norm(n)==='scaled'?'Débutant':n;
const levelName=(m,i)=>{const lv=levelsOf(m)[i||0];return dispLvl((lv&&lv.name)||('Niveau '+((i||0)+1)));};
const lowLvl=m=>{const a=activeLevels(m);return a.length?a[0][1]:0;};
/* niveau personnalisé : adj = % de charge en plus (Rx, +10/20/30) ou en moins (niveau le plus bas, -10 à -50) ; les points de metcon varient du même pourcentage */
const adjF=e=>1; /* le niveau personnalisé ne change plus les points, seulement le niveau du joueur */
const adjMul=e=>1+Math.max(-50,Math.min(30,Number(e&&e.adj)||0))/100;
const adjTxt=e=>(e&&e.adj)?' '+(e.adj>0?'+':'−')+Math.abs(e.adj)+' %':'';
const lvlLab=(m,e)=>levelName(m,e.level)+adjTxt(e);

/* ---------- time cap d'un For Time : tours + reps ----------
   Le score d'un For Time arrêté par le time cap est stocké en reps cumulées (capScore), les paliers aussi.
   Un « tour » est :
   - une ligne du schéma détecté dans le contenu (21-15-9 ou 10-9-8-…-1) : chaque nombre est un tour, pour tous les mouvements ;
   - sinon un tour identique, si « Reps par tour » est renseigné ;
   - sinon il n'y a pas de tours : le score est un simple nombre de reps.
   Convention : « 5 tours + 4 reps » sur un 10-9-8-… = tours 10-9-8-7-6 terminés + 4 reps du tour suivant. */
const LADDER=/^\d+(?:\s*[-–]\s*\d+)+(?:\s|$)/;
function planOf(m){
  if(!m)return null;
  const lines=String(m.content||'').split('\n').map(s=>s.replace(WTAG,'').trim()).filter(Boolean);
  const li=lines.findIndex(s=>LADDER.test(s));
  if(li>=0){
    const nums=lines[li].match(/^\d+(?:\s*[-–]\s*\d+)+/)[0].match(/\d+/g).map(Number);
    const k=lines.slice(li+1).filter(s=>!LADDER.test(s)).length;
    if(nums.length>1&&k>0)return {nums,k,sizes:nums.map(n=>n*k)};
  }
  const rt=roundTotal(m);
  return rt>0?{size:rt}:null;
}
const sizeAt=(pl,i)=>pl.sizes?pl.sizes[i]:pl.size;
function planCum(pl,r,rp){let s=0;for(let i=0;i<r;i++)s+=sizeAt(pl,i)||0;return s+rp;}
function cumToRounds(pl,v){
  if(!pl)return {r:0,rp:v};
  let r=0,left=v;
  for(;;){const s=sizeAt(pl,r);if(!(s>0)||left<s-1e-9)break;left-=s;r++;}
  return {r,rp:Math.round(left*100)/100};
}
/* reps cumulées d'un résultat au time cap (recalculées depuis tours + reps si le schéma existe) */
function capValue(m,e){
  const pl=planOf(m);
  if(pl&&e.rounds!==undefined)return planCum(pl,e.rounds,e.reps||0);
  return e.reps!==undefined?e.reps:e.capScore;
}
/* palier time cap -> reps cumulées (les anciens paliers étaient en tours fractionnaires quand « Reps par tour » était renseigné) */
function tierCum(m,t){
  if(m.capV===2||!(m.repsRound>0))return t;
  const r=Math.floor(t+1e-9);
  return r*roundTotal(m)+repsOf(m,t-r);
}
function capLabel(m,v,total){
  const pl=planOf(m);
  if(!pl)return fmtN(v)+' reps';
  const x=cumToRounds(pl,v);
  const s=[x.r>0?x.r+' tour'+(x.r>1?'s':''):'',(x.rp>0||x.r===0)?fmtN(x.rp)+' rep'+(x.rp>1?'s':''):''].filter(Boolean).join(' + ');
  return s+(total&&x.r>0?' ('+fmtN(v)+' reps)':'');
}
/* cap=true : résultat d'un For Time arrêté par le time cap (reps cumulées), points selon les paliers capTiers (score >= palier) */
function perfPoints(m,score,lvl,cap){
  if(!m||score===undefined||score===null||isNaN(score))return 0;
  const lv=levelsOf(m)[lvl||0]||levelsOf(m)[0];let best=0;
  for(const t of (cap?(lv&&lv.capTiers):(lv&&lv.tiers))||[]){
    const tv=cap?tierCum(m,t.t):t.t;
    const ok=(m.format==='FT'&&!cap)?score<=t.t:score>=tv-0.005;
    if(ok&&t.p>best)best=t.p;
  }
  return best;
}
const hasScore=e=>!!e&&((e.score!==undefined&&e.score!==null)||(!!e.cap&&e.capScore!==undefined&&e.capScore!==null));
const perfOf=(m,e)=>(m&&e)?Math.round(perfPoints(m,e.cap?capValue(m,e):e.score,e.level||0,!!e.cap)*adjF(e)*100)/100:0;
function basePts(w,period){return (w.base!==undefined&&w.base!==null)?Number(w.base):((period&&period.base!==undefined)?Number(period.base):10);}
function wodPoints(w,e,period){
  const base=basePts(w,period);
  const m=metconOf(w);const perf=m&&e?perfOf(m,e):0;
  return {base,perf,total:base+perf};
}

/* ---------- reps équivalentes dans un tour (AMRAP / EMOM) ----------
   Une ligne du metcon peut porter une pondération entre accolades :
     50 Single under {10=1}   -> 10 reps comptent pour 1 (la ligne vaut 5 reps)
     50 Single under {=5}     -> la ligne entière vaut 5 reps
   Les reps en plus saisies par l'athlète sont les reps réelles, dans l'ordre des lignes du tour. */
const WTAG=/\s*\{\s*(?:(\d+(?:[.,]\d+)?)\s*)?=\s*(\d+(?:[.,]\d+)?)\s*\}/;
const NOT_REPS=/^\d+\s*(min|minutes?|sec|secondes?|s|rounds?|tours?|'|")(\s|$)/i;
function roundModel(m){
  if(!m)return null;
  const items=[];let weighted=false;
  for(const raw of String(m.content||'').split('\n')){
    const s=raw.trim();if(!s)continue;
    const w=s.match(WTAG),clean=s.replace(WTAG,'').trim();
    if(NOT_REPS.test(clean)||/^\d+(\s*[-–\/]\s*\d+)+(\s|$)/.test(clean))continue;
    const lm=clean.match(/^(\d+)\s+\S/);
    if(!lm)continue;
    const n=+lm[1];let eq=n;
    if(w){const a=w[1]?parseNum(w[1]):null,b=parseNum(w[2]);if(b!==null&&b>=0&&(a===null||a>0)){eq=a?n*b/a:b;weighted=true;}}
    items.push({n,eq});
  }
  if(!weighted)return null;
  const raw=items.reduce((a,x)=>a+x.n,0),eqT=items.reduce((a,x)=>a+x.eq,0);
  if(!(raw>0&&eqT>0))return null;
  return {items,raw,eq:eqT};
}
const roundTotal=m=>{const md=roundModel(m);return md?md.raw:m.repsRound;};
function fracOf(m,rp){ /* reps réelles en plus -> fraction de tour en reps équivalentes */
  const md=roundModel(m);
  if(!md)return rp/m.repsRound;
  let left=rp,eq=0;
  for(const it of md.items){const k=Math.min(left,it.n);eq+=it.eq*k/it.n;left-=k;if(left<=0)break;}
  return eq/md.eq;
}
function repsOf(m,frac){ /* l'inverse : fraction de tour -> reps réelles */
  const md=roundModel(m);
  if(!md)return Math.round(frac*m.repsRound);
  let t=frac*md.eq,raw=0;
  for(const it of md.items){if(t>=it.eq-1e-6){raw+=it.n;t-=it.eq;}else{raw+=Math.round(t/it.eq*it.n);break;}}
  return raw;
}
function tagShow(s){
  const w=s.match(WTAG);if(!w)return s;
  const clean=s.replace(WTAG,'').trim(),lm=clean.match(/^(\d+)/);
  const b=parseNum(w[2]),a=w[1]?parseNum(w[1]):null;
  const eq=a?(lm&&a>0?+lm[1]*b/a:null):b;
  return clean+(eq!==null&&eq!==undefined?' · compte pour '+fmtN(eq)+' rep'+(eq>1?'s':''):'');
}

function roundsLabel(m,v){
  if(!(m&&m.repsRound>0))return fmtN(v)+' tours';
  const r=Math.floor(v+1e-9),rp=repsOf(m,v-r);
  return r+' tour'+(r>1?'s':'')+(rp?' + '+rp+' reps':'');
}
function scoreText(m,score,e){
  if(e&&e.cap)return 'Time cap · '+capLabel(m,capValue(m,e));
  if(score===undefined||score===null)return '';
  if(m.format==='FT')return fmtTime(score);
  if(e&&e.rounds!==undefined)return e.rounds+' tour'+(e.rounds>1?'s':'')+(e.reps?' + '+e.reps+' reps':'');
  return roundsLabel(m,score);
}

/* flamme toutes saisons confondues : la série continue de monter d'une saison à l'autre.
   Même règle qu'en saison : séances faites pendant la bonne semaine ; une semaine terminée où l'objectif
   de séances (celui de la saison de la semaine) est tenu, REDO compris, garde la flamme. */
function flameAll(lg){
  const t=todayStr(),weeks={};
  for(const w of Object.values(S.wods)){const k=mondayOf(w.date);(weeks[k]=weeks[k]||[]).push(w.date);}
  const onTime=(d,e)=>{if(!e.at)return true;const ds=dfmt(new Date(e.at)),mon=mondayOf(d);return ds>=mon&&ds<=addDays(mon,6);};
  let cur=0,best=0;
  for(const mon of Object.keys(weeks).sort()){
    if(mon>t)break;
    const days=weeks[mon].slice().sort(),closed=addDays(mon,6)<t;
    const per=periodFor(days[0]),goal=(per&&lg.goals)?Number(lg.goals[per.id])||0:0;
    const okN=days.filter(d=>{const e=lg.entries&&lg.entries[d];return e&&onTime(d,e);}).length;
    const redoN=Object.values(lg.redos||{}).filter(x=>x.on>=mon&&x.on<=addDays(mon,6)).length;
    const kept=goal>0&&closed&&okN+redoN>=Math.min(goal,days.length);
    for(const d of days){
      const e=lg.entries&&lg.entries[d];
      if(e&&onTime(d,e)){cur++;best=Math.max(best,cur);}
      else if(!e&&!closed)continue;
      else if(kept)continue;
      else cur=0;
    }
  }
  return {cur,best};
}
function computeBoard(period){
  const wods=Object.values(S.wods).filter(w=>inP(w.date,period)).sort((a,b)=>a.date<b.date?-1:1);
  const metconCount=wods.filter(metconOf).length;
  const catCount={cardio:0,gym:0,haltero:0};
  for(const w of wods){const m=metconOf(w);if(m&&catCount[m.focus]!==undefined)catCount[m.focus]++;}
  const weeks={};
  for(const w of wods){const k=mondayOf(w.date);(weeks[k]=weeks[k]||[]).push(w.date);}
  const t=todayStr(),done=periodState(period)==='done';
  const weekKeys=Object.keys(weeks).filter(k=>done||addDays(k,6)<t).sort();
  const rows=Object.entries(S.logs).map(([uid,lg])=>{
    const r={uid,pseudo:lg.pseudo||'Athlète',sessions:0,base:0,perf:0,perfN:0,strength:0,streak:0,lvlSum:0,lvlN:0,items:[],
      cat:{cardio:{sum:0,n:0},gym:{sum:0,n:0},haltero:{sum:0,n:0}}};
    const best={};let run=0;
    for(const w of wods){
      const e=lg.entries&&lg.entries[w.date];
      if(!e){run=0;continue;}
      run++;r.streak=Math.max(r.streak,run);r.sessions++;
      const pts=wodPoints(w,e,period);r.base+=pts.base;r.perf+=pts.perf;
      const m=metconOf(w);
      if(m&&e.level!==undefined){r.lvlSum+=lvVal(e);r.lvlN++;}
      if(m&&hasScore(e)){r.perfN++;const c=r.cat[m.focus];if(c){c.sum+=pts.perf;c.n++;}}
      for(const p of w.parts||[]){
        if(p.kind==='force'&&p.movement&&e.loads&&e.loads[p.label]>0){const k=norm(p.movement.trim());best[k]=Math.max(best[k]||0,e.loads[p.label]);}
      }
      r.items.push({w,e,pts});
    }
    r.redo=0;r.redoN=0;
    const redoWk=k=>Object.values(lg.redos||{}).filter(x=>x.on>=k&&x.on<=addDays(k,6)).length;
    for(const [wd,x] of Object.entries(lg.redos||{})){
      const rw=S.wods[wd],rm=rw&&metconOf(rw);
      if(!rm||!(lg.entries&&lg.entries[wd])||!inP(x.on,period))continue;
      const rp=perfOf(rm,x)/2;
      r.redo+=rp;r.redoN++;
      r.items.push({w:rw,e:x,pts:{base:0,perf:rp,total:rp},redo:true,on:x.on});
    }
    r.items.sort((a,b)=>(a.redo?a.on:a.w.date)<(b.redo?b.on:b.w.date)?-1:1);
    r.total=r.base+r.perf+r.redo;
    r.strength=Object.values(best).reduce((a,b)=>a+b,0);
    /* poids / puissance : meilleures charges (hors traction lestée) divisées par le poids de corps */
    r.sex=lg.sex||'';
    r.weight=Number(lg.weight)>0?Number(lg.weight):0;
    const relL=Object.entries(best).filter(([k])=>!SIGNED.some(s=>norm(s)===k));
    r.strengthRel=relL.reduce((a,x)=>a+x[1],0);r.ratioN=relL.length;
    r.ratio=(r.weight>0&&r.ratioN>0)?r.strengthRel/r.ratioN/r.weight:0;
    r.perfAvg=r.perfN?r.perf/r.perfN:0;
    r.lvlAvg=r.lvlN?r.lvlSum/r.lvlN:0;
    r.mult=r.lvlN?r.lvlAvg/LEVEL_DIV:1;
    /* seuls les points de metcon (score + REDO) sont pondérés par le niveau, pas les points de séance */
    r.weighted=Math.round((r.base+(r.perf+r.redo)*r.mult)*10)/10;
    r.perfAvgW=r.perfAvg*r.mult;
    /* série en cours : séances faites pendant la bonne semaine (lundi → dimanche de la séance).
       Une séance de la semaine encore ouverte, pas encore faite, ne casse pas la série.
       Si l'athlète a un objectif de séances par semaine inférieur au nombre de séances proposées,
       une semaine terminée où il a fait son nombre prévu (REDO compris) garde sa flamme :
       les séances non faites de cette semaine ne remettent pas la série à zéro. */
    {
      const onTime=(d,e)=>{if(!e.at)return true;const ds=dfmt(new Date(e.at)),mon=mondayOf(d);return ds>=mon&&ds<=addDays(mon,6);};
      const goalS=lg.goals?Number(lg.goals[period.id])||0:0;
      let cur=0,curBest=0;
      for(const mon of Object.keys(weeks).sort()){
        if(mon>t)break;
        const days=weeks[mon].slice().sort(),closed=addDays(mon,6)<t;
        const okN=days.filter(d=>{const e=lg.entries&&lg.entries[d];return e&&onTime(d,e);}).length;
        const need=goalS>0?Math.min(goalS,days.length):days.length;
        const kept=goalS>0&&closed&&okN+redoWk(mon)>=need;
        for(const d of days){
          const e=lg.entries&&lg.entries[d];
          if(e&&onTime(d,e)){cur++;curBest=Math.max(curBest,cur);}
          else if(!e&&!closed)continue;
          else if(kept)continue;
          else cur=0;
        }
      }
      r.cur=cur;r.curBest=curBest;
    }
    {const fa=flameAll(lg);r.flameCur=fa.cur;r.flameBest=fa.best;}
    /* temps au top : metcons d'affilée à 90 % ou plus des points max du niveau choisi.
       Seul un score saisi sous 90 % remet à zéro ; séance sans metcon ou sans score = neutre. */
    {
      const lvMax=lv=>((lv&&lv.tiers)||[]).reduce((a,x)=>Math.max(a,x.p),0);
      let tc=0,tb=0;
      for(const w of wods){
        const m=metconOf(w),e=lg.entries&&lg.entries[w.date];
        if(!m||!hasScore(e))continue;
        const lvl=e.level||0,mx=lvMax(levelsOf(m)[lvl]||levelsOf(m)[0]);
        if(!(mx>0))continue;
        if(perfOf(m,e)>=0.9*mx-1e-9){tc++;tb=Math.max(tb,tc);}else tc=0;
      }
      r.topCur=tc;r.topBest=tb;
    }
    const goal=lg.goals?Number(lg.goals[period.id]):0;
    r.goal=goal>0?goal:0;
    r.goalMet=r.goal>0&&weekKeys.length>0&&weekKeys.every(k=>weeks[k].filter(d=>lg.entries&&lg.entries[d]).length+redoWk(k)>=Math.min(r.goal,weeks[k].length));
    return r;
  });
  rows.sort((a,b)=>b.total-a.total||b.sessions-a.sessions||a.pseudo.localeCompare(b.pseudo));
  return {rows,wods,metconCount,catCount,weekKeys,period};
}
const cmpKey=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]-b[i];}return 0;};
const catTrophy=(id,name,focus,label)=>({id,name,
  desc:'La meilleure moyenne de points sur les metcons '+label+' (2 metcons minimum).',
  key:r=>[r.cat[focus].n?r.cat[focus].sum/r.cat[focus].n:0,r.cat[focus].n],
  show:r=>fmtN(r.cat[focus].sum/r.cat[focus].n)+' pts par metcon',
  elig:r=>r.cat[focus].n>=2});
const multTxt=r=>'x'+fmt2(r.mult);
const TROPHIES=[

 {id:'points',name:'Le SCRATCH',desc:'Le plus de points bruts sur la saison, sans tenir compte des niveaux.',key:r=>[r.total,r.sessions],show:r=>fmtN(r.total)+' pts'},

 {id:'top',name:'Top niveau',desc:'La plus longue série de metcons d’affilée à 90 % ou plus des points possibles de son niveau, quel que soit le niveau choisi. Un score sous 90 % remet la série à zéro.',key:r=>[r.topBest,r.sessions],show:r=>r.topBest+' metcon'+(r.topBest>1?'s':'')+' d’affilée au top'},
 {id:'perf',name:'Le plus performant',desc:'La meilleure moyenne de points de metcon, pondérée par le niveau moyen choisi (niveau moyen divisé par 2). 3 metcons minimum.',key:r=>[r.perfAvgW],show:r=>fmtN(r.perfAvgW)+' pts par metcon · '+multTxt(r),elig:(r,b)=>r.perfN>=Math.min(3,b.metconCount)},
 {id:'lafort',name:'La plus forte',desc:'Même calcul que Le plus fort (somme des meilleures charges de force), réservé aux athlètes femmes. Le sexe se renseigne dans le profil.',key:r=>[r.strength],show:r=>fmtN(r.strength)+' kg cumulés',elig:r=>r.sex==='F'},
 {id:'fort',name:'Le plus fort',desc:'Somme des meilleures charges saisies sur chaque mouvement de force.',key:r=>[r.strength],show:r=>fmtN(r.strength)+' kg cumulés'},

 {id:'objectif',name:'Objectif tenu',desc:'Avoir tenu son nombre de séances par semaine, chaque semaine de la saison.',custom:b=>b.rows.filter(r=>r.goalMet),show:r=>r.goal+' séance'+(r.goal>1?'s':'')+' par semaine'}

function winners(t,board,gid){
  if(gid!==undefined)board=Object.assign({},board,{rows:board.rows.filter(r=>inScope(r.uid,gid,board.period))});
  if(t.custom)return t.custom(board).filter(r=>r.sessions>0);
  const pool=board.rows.filter(r=>r.sessions>0&&(!t.elig||t.elig(r,board))&&t.key(r)[0]>0);
  if(!pool.length)return [];
  pool.sort((a,b)=>cmpKey(t.key(b),t.key(a)));
  const top=t.key(pool[0]);
  return pool.filter(r=>cmpKey(t.key(r),top)===0);
}

/* ---------- pourcentages et PR (parties force) ---------- */
function prFor(name){const e=S.prof.prs||{};for(const k of Object.keys(e)){if(norm(k)===norm(name))return e[k];}return null;}
function findMove(text){
  const t=norm(text);const list=[];
  for(const [c,al] of MOVES)for(const a of al)list.push([c,a]);
  for(const k of Object.keys(S.prof.prs||{}))list.push([k,norm(k)]);
  list.sort((x,y)=>y[1].length-x[1].length);
  for(const [c,a] of list){
    const re=new RegExp('(^|[^a-z0-9])'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])');
    if(re.test(t))return c;
  }
  return null;
}
function renderLine(text){
  const line=h('div',{class:'line'},h('span',{},glossSegs(text)));
  const m=text.match(PCT_RE);
  if(m){
    const nums=m[1].split(/\s*[\/–-]\s*/).map(Number).filter(n=>n>0&&n<=200);
    const canon=findMove(text);
    if(canon&&nums.length){
      const pr=prFor(canon);
      if(!(pr&&pr.kg<=0))line.append(pr?h('div',{class:'chips'},nums.map(n=>h('span',{class:'chip load'},n+' % = '+fmtKg(pr.kg*n/100))))
                    :h('div',{class:'chips'},h('span',{class:'chip miss'},'Renseigne ton PR de '+canon+' dans ton profil')));
    }
  }
  return line;
}
const plainLine=text=>h('div',{class:'line'},glossSegs(text));
const metLine=text=>plainLine(tagShow(text));
function glossSegs(text){
  const t=norm(text);
  if(t.length!==text.length)return [text];
  const hits=[];
  for(const [al,gi] of GLOSS_AL){
    for(let i=t.indexOf(al);i>=0;i=t.indexOf(al,i+1)){
      const e=i+al.length;
      if((i===0||!/[a-z0-9]/.test(t[i-1]))&&(e>=t.length||!/[a-z0-9]/.test(t[e]))&&!hits.some(x=>i<x.e&&e>x.s))hits.push({s:i,e,g:gi});
    }
  }
  hits.sort((a,b)=>a.s-b.s);
  const out=[];let c=0;
  for(const x of hits){
    if(x.s>c)out.push(text.slice(c,x.s));
    out.push(h('button',{type:'button',class:'mv',onclick:()=>openGloss(x.g)},text.slice(x.s,x.e)));
    c=x.e;
  }
  if(c<text.length)out.push(text.slice(c));
  return out;
}
function openGloss(gi){
  const g=GLOSS[gi];if(!g)return;
  const old=document.getElementById('gloss-ov');if(old)old.remove();
  const esc=e=>{if(e.key==='Escape')close();};
  const close=()=>{ov.remove();document.removeEventListener('keydown',esc);};
  const ov=h('div',{class:'ov',id:'gloss-ov',onclick:e=>{if(e.target===ov)close();}},
    h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':g[0]},
      h('div',{},h('p',{class:'eyebrow'},'Mouvement'),h('h2',{class:'wtitle'},g[0])),
      h('p',{},g[2]),
      h('div',{},h('div',{class:'flabel gok'},'Rep valide'),h('ul',{},g[3].map(x=>h('li',{},x)))),
      h('div',{},h('div',{class:'flabel gno'},'No rep'),h('ul',{},g[4].map(x=>h('li',{},x)))),
      h('p',{class:'hint'},'Standards habituels. Ton coach peut les préciser pour la séance.'),
      h('button',{class:'btn primary',id:'gloss-close',type:'button',onclick:close},'Fermer')));
  document.body.append(ov);
  document.addEventListener('keydown',esc);
  document.getElementById('gloss-close').focus();
}

const groupsList=()=>(S.groups&&S.groups.list)||[];
const groupOf=uid=>(S.groups&&S.groups.of&&S.groups.of[uid])||'';
const groupName=id=>{const g=groupsList().find(x=>x.id===id);return g?g.name:'';};
const grpTxt=uid=>{const n=groupName(groupOf(uid));return n?' · '+n:'';};
/* trophées et badges par groupe : '' = athlètes sans groupe (ou tout le monde si aucun groupe n'existe).
   Une saison terminée utilise les groupes figés à sa fin (config/groups.snap[periodId]) ; sinon les groupes actuels. */
const snapOf=per=>{const sn=per&&!per.virtual&&S.groups&&S.groups.snap&&S.groups.snap[per.id];return sn&&periodState(per)==='done'?sn:null;};
const gListFor=per=>{const sn=snapOf(per);return sn?sn.list:groupsList();};
const gOfFor=(uid,per)=>{const sn=snapOf(per);return sn?((sn.of&&sn.of[uid])||''):groupOf(uid);};
const scopeOf=(uid,per)=>{const g=gOfFor(uid,per);return gListFor(per).some(x=>x.id===g)?g:'';};
const inScope=(uid,gid,per)=>!gListFor(per).length||scopeOf(uid,per)===gid;
const scopeName=(gid,per)=>{const l=gListFor(per);if(!l.length)return '';if(!gid)return 'Sans groupe';const g=l.find(x=>x.id===gid);return g?g.name:'';};
function scopeIds(per){
  const l=gListFor(per);
  if(!l.length)return [''];
  const ids=l.map(g=>g.id);
  if(Object.keys(S.logs).some(u=>!scopeOf(u,per)))ids.push('');
  return ids;
}
/* fige les groupes de chaque saison terminée qui n'a pas encore de photo */
function freezeSnap(){
  const snap=Object.assign({},(S.groups&&S.groups.snap)||{});let ch=false;
  for(const per of plist()){
    if(periodState(per)!=='done'||snap[per.id])continue;
    snap[per.id]={list:groupsList().map(g=>({id:g.id,name:g.name})),of:Object.assign({},(S.groups&&S.groups.of)||{})};ch=true;
  }
  return ch?snap:null;
}
function maybeFreeze(){
  if(!S.owner||!ready()||!S.groups||!S.groups.loaded||S._freezing)return;
  const snap=freezeSnap();if(!snap)return;
  S._freezing=true;
  S.db.doc('config/groups').set({list:groupsList(),of:S.groups.of||{},snap}).catch(()=>{S._freezing=false;});
}
const saveGroups=(list,of,msg)=>run(async()=>{const snap=freezeSnap()||(S.groups&&S.groups.snap)||{};await S.db.doc('config/groups').set({list,of,snap});if(msg)toast(msg);});
/* uid facultatif : le coach peut écrire dans le journal d'un autre athlète (règles Firestore à adapter, voir README) */
function saveLog(patch,msg,uid){
  uid=uid||S.uid;
  return run(async()=>{
    const cur=S.logs[uid]||{};
    const data={
      pseudo:patch.pseudo!==undefined?patch.pseudo:(cur.pseudo||''),
      entries:patch.entries||cur.entries||{},
      goals:patch.goals||cur.goals||{}
    };
    const rd=patch.redos||cur.redos;
    if(rd&&Object.keys(rd).length)data.redos=rd;
    const wt=patch.weight!==undefined?patch.weight:cur.weight;
    if(wt>0)data.weight=wt;
    const sx=patch.sex!==undefined?patch.sex:(cur.sex||(uid===S.uid?S.prof.sex:'')||'');
    if(sx)data.sex=sx;
    const bd=patch.badge!==undefined?patch.badge:cur.badge;
    if(bd)data.badge=bd;
    const av=patch.avatar!==undefined?patch.avatar:cur.avatar;
    if(av&&Object.keys(av).length)data.avatar=av;
    await S.db.doc('logs/'+uid).set(data);
    if(msg)toast(msg);
  });
}

let lastCheck=0;
async function checkVersion(){
  if(!/^https?:$/.test(location.protocol))return;
  if(Date.now()-lastCheck<60000)return;
  lastCheck=Date.now();
  try{
    const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const m=(await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(m&&m[1]!==APP_VERSION&&S.newVersion!==m[1]){S.newVersion=m[1];scheduleRender();}
  }catch(e){}
}
async function applyUpdate(){
  try{
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.unregister()));}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
  }catch(e){}
  location.replace(location.pathname+'?v='+encodeURIComponent(S.newVersion||Date.now()));
}

function levelRecord(m,i){
  const sig=metSig(m),ft=m.format==='FT',wds=[];
  for(const w2 of Object.values(S.wods)){
    const m2=metconOf(w2);
    if(m2&&(m2===m||(sig&&metSig(m2)===sig)))wds.push(w2.date);
  }
  let best=null;
  const consider=(e,lg,uid)=>{
    if(!hasScore(e)||(e.level||0)!==i||e.adj)return;
    const c=!!e.cap,v=c?capValue(m,e):e.score,k=c?[0,v]:[1,ft?-v:v];
    if(!best||k[0]>best.k[0]||(k[0]===best.k[0]&&k[1]>best.k[1]))best={k,e,who:lg.pseudo||'Athlète',uid};
  };
  for(const [uid,lg] of Object.entries(S.logs)){
    const en=lg.entries||{},rd=lg.redos||{};
    for(const d of wds){consider(en[d],lg,uid);consider(rd[d],lg,uid);}
  }
  return best?{txt:scoreText(m,best.e.score,best.e),who:best.who,uid:best.uid}:null;
}

function readRounds(m,st){
  const a=String(st.rounds||'').trim(),b=String(st.reps||'').trim();
  if(a===''&&b==='')return {empty:true};
  const rn=a===''?0:parseNum(a),rp=b===''?0:parseNum(b);
  if(rn===null||rp===null||rn<0||rp<0||rn%1||rp%1)return {bad:true};
  if(rp>=roundTotal(m))return {over:true};
  return {v:Math.round((rn+fracOf(m,rp))*10000)/10000,rounds:rn,reps:rp};
}
function readScore(m,st){
  if(m.format==='FT'){
    if(st.capped){ /* time cap atteint : tours + reps (si le WOD a des tours), sinon nombre de reps */
      const pl=planOf(m);
      if(pl){
        const a=String(st.rounds||'').trim(),b=String(st.reps||'').trim();
        if(a===''&&b==='')return {empty:true};
        const rn=a===''?0:parseNum(a),rp=b===''?0:parseNum(b);
        if(rn===null||rp===null||rn<0||rp<0||rn%1||rp%1)return {bad:true,capBad:true};
        if(pl.sizes&&rn>=pl.sizes.length)return {many:true};
        const sz=sizeAt(pl,rn);
        if(rp>=sz)return {over:true,max:sz};
        return {v:planCum(pl,rn,rp),cap:true,rounds:rn,reps:rp};
      }
      const s=String(st.creps||'').trim();if(s==='')return {empty:true};
      const cv=parseNum(s);return (cv===null||cv<0||cv%1)?{bad:true,capBad:true}:{v:cv,cap:true,reps:cv};
    }
    if(String(st.score||'').trim()==='')return {empty:true};
    const v=parseTime(st.score);return v===null?{bad:true}:{v};
  }
  if(m.repsRound>0)return readRounds(m,st);
  if(String(st.score||'').trim()==='')return {empty:true};
  const v=parseNum(st.score);return (v===null||v<0)?{bad:true}:{v};
}
function scoreErr(m,r){
  if(r.many)return 'Tu as indiqué plus de tours que le WOD n’en contient. Si tu as tout terminé, choisis « Terminé dans le temps ».';
  if(r.over)return 'Les reps en plus doivent être inférieures à '+(r.max||roundTotal(m))+' (le tour en cours).';
  if(r.capBad)return 'Score illisible. Écris des nombres entiers.';
  if(m.format==='FT')return 'Temps illisible. Écris-le comme 12:45.';
  return m.repsRound>0?'Score illisible. Écris des nombres entiers de tours et de reps.':'Score illisible. Écris un nombre de tours.';
}
function splitScore(m,e){
  if(e.rounds!==undefined)return [e.rounds,e.reps||0];
  const r=Math.floor(e.score+1e-9);return [r,repsOf(m,e.score-r)];
}

function capGuide(pl){

  return intro+'Indique les tours COMPLETS terminés, puis les reps faites dans le tour en cours (tous mouvements confondus, dans l’ordre). Exemple : '+n+' tours + 4 reps'+(pl.sizes?' = tours '+pl.nums.slice(0,n).join('-')+' terminés + 4 reps du tour suivant.':'.');
}

function fillState(m,st,e){

function prevBlock(w,date,cur){
  const m=metconOf(w),sig=m&&metSig(m);

  const lg=S.logs[S.uid]||{},en=lg.entries||{},rows=[];
  for(const w2 of Object.values(S.wods)){
    const m2=metconOf(w2);
    if(!m2||w2.date===date||metSig(m2)!==sig)continue;
    const e=en[w2.date];if(hasScore(e))rows.push({d:w2.date,e,tag:''});
    const rd=(lg.redos||{})[w2.date];if(hasScore(rd))rows.push({d:rd.on,e:rd,tag:' · REDO'});
  }
  if(!rows.length)return null;
  rows.sort((a,b)=>a.d<b.d?1:-1);
  const delta=pv=>{
    if(!cur||cur.cap||pv.cap||cur.score===undefined||(cur.level||0)!==(pv.level||0))return '';
    const d=cur.score-pv.score;
    if(Math.abs(d)<0.0001)return ' · même résultat qu’ici';
    return ' · ici '+(m.format==='FT'?(d<0?'−':'+')+fmtTime(Math.abs(d)):(d>0?'+':'−')+roundsLabel(m,Math.abs(d)));
  };
  return h('div',{class:'lines'},h('span',{class:'flabel'},'Déjà fait sur ce metcon'),
    h('ul',{class:'list'},rows.map(r=>h('li',{},h('div',{class:'l'},h('div',{class:'nm'},cap(fmtShort(r.d))+r.tag),
      h('div',{class:'sub'},lvlLab(m,r.e)+' · '+scoreText(m,r.e.score,r.e)+delta(r.e)))))));
}

function submitEntry(w){
  if(!S.entry.coach&&lockedDate(S.entry.date)){toast(LOCKMSG,true);return;}
  const uid=S.entry.uid||S.uid,coach=!!S.entry.coach;
  const prevE=((S.logs[uid]||{}).entries||{})[S.entry.date];
  /* séance saisie par le coach pour un athlète : horodatée dans la semaine de la séance pour ne pas casser sa série */
  const atNew=coach?new Date(dparse(S.entry.date).getTime()+12*3600*1000).toISOString():new Date().toISOString();
  const m=metconOf(w),e={at:(prevE&&prevE.at)||atNew};
  if(m){
    if(S.entry.custom&&!S.entry.adj){toast('Choisis ton niveau personnalisé (par exemple Rx +10 %).',true);return;}
    e.level=S.entry.level;if(S.entry.adj)e.adj=S.entry.adj;
    const r=readScore(m,S.entry);
    if(r.bad||r.over||r.many){toast(scoreErr(m,r),true);return;}
    if(!r.empty){
      if(r.cap){e.cap=true;e.capScore=r.v;if(r.rounds!==undefined)e.rounds=r.rounds;e.reps=r.reps;}
      else{e.score=r.v;if(r.rounds!==undefined){e.rounds=r.rounds;e.reps=r.reps;}}
    }
  }
  const loads={};
  for(const [k,raw] of Object.entries(S.entry.loads)){if(String(raw).trim()==='')continue;const v=parseNum(raw),pm=(w.parts||[]).find(q=>q.label===k);if(!prOk(pm&&pm.movement,v)){toast('Charge illisible pour '+k,true);return;}loads[k]=v;}
  if(Object.keys(loads).length)e.loads=loads;
  /* PR déclarés : {label:{reps,mv}} ; la charge reste celle de e.loads (pas de doublon) */
  const prs={};
  for(const [k,x] of Object.entries(S.entry.prs||{})){
    const pm=(w.parts||[]).find(q=>q.label===k);
    if(!pm||!pm.movement||loads[k]===undefined){toast('PR '+k+' : indique la charge et le mouvement.',true);return;}
    prs[k]={reps:Number(x.reps)||1,mv:pm.movement};
  }
  if(Object.keys(prs).length)e.prs=prs;
  const lp=S.entry.laps!==undefined?S.entry.laps:(prevE&&prevE.laps);
  if(lp&&lp.length)e.laps=lp;
  const date=S.entry.date;const cur=S.logs[uid]||{};
  S.entry=null;
  saveLog({entries:Object.assign({},cur.entries||{},{[date]:e})},coach?'Résultats enregistrés':'Séance enregistrée',uid);
  render();
}

/* Bracelet Alpha : accessoire vectoriel indépendant, dessiné comme une bande souple qui épouse le poignet.
   Il reste un calque distinct pour que l'inventaire et le mode coach puissent le prévisualiser instantanément. */
let wristN=0;
const wristWear=hw=>{
  const id='walpha'+(++wristN), w=hw*2;
  const h=Math.max(5.1,hw*.35), edge=Math.max(1.4,hw*.12);
  return '<defs>'+
    '<linearGradient id="'+id+'body" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#54D9FF"/><stop offset=".24" stop-color="#17B8F5"/><stop offset=".72" stop-color="#079CE2"/><stop offset="1" stop-color="#0878BA"/>'+
    '</linearGradient>'+
    '<linearGradient id="'+id+'edge" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#E2FAFF" stop-opacity=".72"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".04"/><stop offset="1" stop-color="#004E86" stop-opacity=".5"/>'+
    '</linearGradient>'+
    '<linearGradient id="'+id+'side" x1="0" y1="0" x2="1" y2="0">'+
      '<stop stop-color="#006BA7" stop-opacity=".75"/><stop offset=".16" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset=".84" stop-color="#FFFFFF" stop-opacity=".03"/><stop offset="1" stop-color="#005D94" stop-opacity=".72"/>'+
    '</linearGradient>'+
    '<filter id="'+id+'shadow" x="-20%" y="-35%" width="140%" height="180%"><feGaussianBlur stdDeviation=".65"/></filter>'+ 
    '</defs>'+ 
    /* ombre très fine sous la bande */
    '<path d="M'+(-hw+2)+' '+(-h*.34)+' Q0 '+(-h*.95)+' '+(hw-2)+' '+(-h*.34)+' L'+(hw-1)+' '+(h*.28)+' Q0 '+(h*1.02)+' '+(-hw+1)+' '+(h*.28)+' Z" fill="#004B78" opacity=".48" transform="translate(0 1.5)" filter="url(#'+id+'shadow)"/>'+ 
    /* bande bombée, légèrement cintrée comme du silicone autour du poignet */
    '<path d="M'+(-hw+edge)+' '+(-h*.48)+' Q0 '+(-h*1.08)+' '+(hw-edge)+' '+(-h*.48)+' Q'+(hw+1)+' 0 '+(hw-edge)+' '+(h*.43)+' Q0 '+(h*1.04)+' '+(-hw+edge)+' '+(h*.43)+' Q'+(-hw-1)+' 0 '+(-hw+edge)+' '+(-h*.48)+' Z" fill="url(#'+id+'body)" stroke="#087EB9" stroke-width=".7"/>'+ 
    '<path d="M'+(-hw+edge)+' '+(-h*.43)+' Q0 '+(-h*.94)+' '+(hw-edge)+' '+(-h*.43)+'" fill="none" stroke="#E7FBFF" stroke-opacity=".75" stroke-width=".85" stroke-linecap="round"/>'+ 
    '<path d="M'+(-hw+edge)+' '+(h*.34)+' Q0 '+(h*.88)+' '+(hw-edge)+' '+(h*.34)+'" fill="none" stroke="#005C96" stroke-opacity=".55" stroke-width=".85" stroke-linecap="round"/>'+ 
    '<path d="M'+(-hw+1.2)+' '+(-h*.37)+' Q0 '+(-h*.9)+' '+(hw-1.2)+' '+(-h*.37)+' L'+(hw-1.2)+' '+(h*.3)+' Q0 '+(h*.8)+' '+(-hw+1.2)+' '+(h*.3)+' Z" fill="url(#'+id+'edge)"/>'+ 
    '<path d="M'+(-hw+1.5)+' '+(-h*.2)+' Q0 '+(-h*.57)+' '+(hw-1.5)+' '+(-h*.2)+'" fill="none" stroke="url(#'+id+'side)" stroke-width="1.1"/>'+ 
    /* lettres compactes et légèrement inclinées, comme imprimées sur la bande */
    '<text x="0" y="'+(h*.24)+'" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="'+Math.max(5.4,hw*.34)+'" font-weight="900" font-style="italic" letter-spacing="-.12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width=".12" paint-order="stroke">ALPHA</text>';
};

/* ---------- thème Halloween (cosmétique) ----------
   Objet « Décor » : acquis en participant à au moins un WOD d'octobre. Équipé, il habille le fond de l'avatar
   (décor de box en plein écran) et ajoute quelques décorations discrètes à l'appli (toile, araignée, citrouille). */
const webPath=R=>{let d='';const A=[0,22.5,45,67.5,90].map(a=>a*Math.PI/180);
  for(const a of A)d+='M0 0L'+(R*Math.cos(a)).toFixed(1)+' '+(R*Math.sin(a)).toFixed(1);
  for(const f of [.32,.56,.8]){const r=R*f;for(let i=0;i<4;i++){const a=A[i],b=A[i+1],m=(a+b)/2,c=r*.9;
    d+='M'+(r*Math.cos(a)).toFixed(1)+' '+(r*Math.sin(a)).toFixed(1)+'Q'+(c*Math.cos(m)).toFixed(1)+' '+(c*Math.sin(m)).toFixed(1)+' '+(r*Math.cos(b)).toFixed(1)+' '+(r*Math.sin(b)).toFixed(1);}}
  return d;};

/* peut-on gagner cet objet sur la saison en cours ? */
function avStatus(it,own){
  if(own.has(it.id))return ['✓ Déjà débloqué.',true];
  if(avOff(it))return ['✗ Pas obtenable pour l’instant : cet objet est désactivé.',false];
  const per=activePeriod();
  if(!per.virtual&&periodState(per)!=='live')return ['✗ Aucune saison en cours pour le moment.',false];
  const nm=per.virtual?'saison en cours':seasonLabel(per)+' · '+per.name;
  let ok;
  if(it.id==='shirt_beta')ok=/beta/.test(norm(per.name||''));
  else if(it.id==='wrist_alpha')ok=/alpha/.test(norm(per.name||''));
  else ok=!!per.virtual||(per.avItems||[]).includes(it.id);
  return [ok?'✓ Obtenable sur la saison en cours ('+nm+').':'✗ Pas obtenable sur la saison en cours ('+nm+').',ok];
}
/* objets acquis (saisons terminées) et « en bonne voie » (saison en cours), par athlète */
function avState(){
  if(S._ob)return S._ob;
  const earned={},prov={},aw=awards();
  for(const per of (plist().length?plist():[ALL])){
    const st=periodState(per);if(st==='soon')continue;
    const b=computeBoard(per),wins={};
    if(st==='done'){for(const [uid,l] of Object.entries(aw))for(const a of l)if(a.per.id===per.id)(wins[uid]=wins[uid]||new Set()).add(a.tid);}
    else for(const gid of scopeIds(per))for(const t of TROPHIES)for(const r of winners(t,b,gid))(wins[r.uid]=wins[r.uid]||new Set()).add(t.id);
    const ranked=b.rows.filter(r=>r.sessions>0),tgt=st==='done'?earned:prov;
    for(const r of ranked){
      const ctx={r,b,per,rank:ranked.indexOf(r)+1,wins:wins[r.uid]||new Set()};
      for(const it of AV_ITEMS)if(!avOff(it)&&(per.virtual||(per.avItems||[]).includes(it.id))&&AV_OBJ[it.id].test(ctx)){const o=(tgt[r.uid]=tgt[r.uid]||{});if(!o[it.id])o[it.id]=per;}
    }
  }
  /* t-shirt Bêta testeur : acquis dès qu'un metcon avec score est enregistré dans la saison bêta (même en cours) */
  for(const per of plist()){
    if(!/beta/.test(norm(per.name||''))||periodState(per)==='soon')continue;
    for(const r of computeBoard(per).rows)if(r.perfN>=1){const o=(earned[r.uid]=earned[r.uid]||{});if(!o.shirt_beta)o.shirt_beta=per;}
  }
  /* bracelet Alpha : acquis dès 3 séances enregistrées dans la saison Alpha (même en cours) */
  for(const per of plist()){
    if(!/alpha/.test(norm(per.name||''))||periodState(per)==='soon')continue;
    for(const r of computeBoard(per).rows)if(r.sessions>=3){const o=(earned[r.uid]=earned[r.uid]||{});if(!o.wrist_alpha)o.wrist_alpha=per;}
  }
  /* thème Halloween (cadeau) : seulement sur les saisons où le coach l'a coché ; acquis dès qu'un WOD d'octobre de cette saison est validé (même en cours) */
  for(const per of plist()){
    if(!(per.avItems||[]).includes('theme_halloween')||periodState(per)==='soon')continue;
    for(const [uid,lg] of Object.entries(S.logs)){
      const en=lg.entries||{};
      const d=Object.keys(en).sort().find(x=>S.wods[x]&&inP(x,per)&&(x.slice(5,7)==='10'||String(en[x].at||'').slice(5,7)==='10'));
      if(d){const o=(earned[uid]=earned[uid]||{});if(!o.theme_halloween)o.theme_halloween=per;}
    }
  }
  return (S._ob={earned,prov});
}

function avLoad(sx){

  const ld=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});

    g.clearRect(0,0,AV_W,AV_H);g.drawImage(m,0,0,AV_W,AV_H);const mk=g.getImageData(0,0,AV_W,AV_H);
    const sum=[0,0,0],n=[0,0,0],D=base.data,M=mk.data;
    for(let i=0;i<D.length;i+=4){const L=.299*D[i]+.587*D[i+1]+.114*D[i+2];for(let k=0;k<3;k++)if(M[i+k]>128){sum[k]+=L;n[k]++;}}

    const cl=p=>{const i=p*4;return Math.abs(D[i]-sd[0])+Math.abs(D[i+1]-sd[1])+Math.abs(D[i+2]-sd[2])<45;};
    const st=[],push=p=>{if(!bgm[p]&&cl(p)){bgm[p]=1;st.push(p);}};
    for(let x=0;x<W;x++){push(x);push((H-1)*W+x);}
    for(let y=0;y<H;y++){push(y*W);push(y*W+W-1);}
    while(st.length){const p=st.pop(),x=p%W;if(x>0)push(p-1);if(x<W-1)push(p+1);if(p>=W)push(p-W);if(p<W*(H-1))push(p+W);}
    for(let p=0;p<W*H;p++){if(bgm[p])continue;const x=p%W;if((x>0&&bgm[p-1]===1)||(x<W-1&&bgm[p+1]===1)||(p>=W&&bgm[p-W]===1)||(p<W*(H-1)&&bgm[p+W]===1))bgm[p]=2;}
    return {base,mk,bgm,mean:sum.map((s,k)=>n[k]?s/n[k]:128)};
  }).catch(()=>null));
}
function avPaint(cv,A,eq,key){

/* zoom de l'avatar : pincer, molette, double-tap ou boutons + / − ; un doigt déplace l'image quand elle est agrandie */
function addZoom(stage,el){
  let sc=1,tx=0,ty=0,d0=0,sc0=1,lastTap=0,moved=0;
  const ptr=new Map();
  const lab=h('span',{class:'zlab'},'100 %');
  const apply=()=>{
    sc=Math.max(1,Math.min(6,sc));
    const mx=el.offsetWidth*(sc-1)/2,my=el.offsetHeight*(sc-1)/2;
    tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty));
    el.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
    lab.textContent=Math.round(sc*100)+' %';
  };
  const zoomAt=(ns,cx,cy)=>{
    ns=Math.max(1,Math.min(6,ns));
    const r=stage.getBoundingClientRect(),px=cx-(r.left+r.width/2),py=cy-(r.top+r.height/2);
    tx=px-(px-tx)*ns/sc;ty=py-(py-ty)*ns/sc;sc=ns;apply();
  };
  const mid=()=>{const r=stage.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
  const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;};
  stage.addEventListener('pointerdown',e=>{
    if(e.target.closest&&e.target.closest('.zbar'))return;
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
    if(ptr.size===2){d0=dist();sc0=sc;}
  });
  stage.addEventListener('pointermove',e=>{

    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    if(ptr.size===2){const a=[...ptr.values()];zoomAt(sc0*dist()/d0,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);}
    else if(sc>1){tx+=dx;ty+=dy;apply();}
  });
  const up=e=>{
    if(!ptr.has(e.pointerId))return;
    const single=ptr.size===1;ptr.delete(e.pointerId);
    if(single&&moved<8&&e.type==='pointerup'){
      const now=Date.now();
      if(now-lastTap<320){lastTap=0;if(sc>1){sc=1;tx=0;ty=0;apply();}else zoomAt(2.6,e.clientX,e.clientY);}else lastTap=now;
    }
    if(ptr.size===1){sc0=sc;d0=0;}
  };
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(sc*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY);},{passive:false});
  const bt=(t,l,fn)=>h('button',{class:'btn sm',type:'button','aria-label':l,onclick:fn},t);
  stage.append(h('div',{class:'zbar'},bt('−','Dézoomer',()=>{const c=mid();zoomAt(sc/1.5,c[0],c[1]);}),lab,bt('+','Zoomer',()=>{const c=mid();zoomAt(sc*1.5,c[0],c[1]);}),bt('1×','Taille normale',()=>{sc=1;tx=0;ty=0;apply();})));
}

/* ---------- carnet de progression : uniquement les PR déclarés ----------
   Un PR est stocké dans la séance d'origine : logs/{uid}.entries[date].prs = {label:{reps,mv}}.
   La charge est celle de entries[date].loads[label] (aucun doublon). L'historique est calculé à la volée,
   par catégorie « mouvement + nombre de reps » : on ne compare jamais un 1 RM avec un 5 RM.
   Les anciennes séances n'ont pas de champ prs : elles ne sont jamais comptées comme des PR. */

function prEvents(uid){
  const lg=S.logs[uid]||{},en=lg.entries||{},out=[];
  for(const d of Object.keys(en).sort()){
    const e=en[d];if(!e||!e.prs)continue;
    for(const [label,x] of Object.entries(e.prs).sort()){
      const kg=e.loads?e.loads[label]:undefined,mv=x&&x.mv,reps=Number(x&&x.reps);
      if(!mv||!(reps>0)||typeof kg!=='number'||!prOk(mv,kg))continue;
      out.push({date:d,label,mv,reps,kg,title:(S.wods[d]&&S.wods[d].title)||'',key:norm(mv)+'|'+reps});
    }
  }

  return out;
}

const PROG={ex:'all',range:'all'};

function prChart(evs){

  const ts=evs.map(e=>dparse(e.date).getTime()),t0=Math.min(...ts),t1=Math.max(...ts);

/* ---------- muscles ciblés ---------- */
function muscleScore(texts){
  const sc={};MUSCLES.forEach(m=>{sc[m[0]]=0;});
  for(const tx of texts){
    const t=norm(tx),hits=[];
    for(const [al,w] of MUS_AL){
      for(let i=t.indexOf(al);i>=0;i=t.indexOf(al,i+1)){
        const e=i+al.length;
        if((i===0||!/[a-z0-9]/.test(t[i-1]))&&(e>=t.length||!/[a-z0-9]/.test(t[e]))&&!hits.some(x=>i<x.e&&e>x.s))hits.push({s:i,e,w});
      }
    }
    for(const x of hits)for(const tok of x.w.split(' ')){const m=tok.match(/^([a-z]+)(\d)$/);if(m)sc[m[1]]+=+m[2];}
  }
  return sc;
}
function wodMuscles(parts){
  const tot={};MUSCLES.forEach(m=>{tot[m[0]]=0;});
  for(const p of parts||[]){
    let sc=muscleScore(String(p.content||'').split('\n'));
    if(!Object.values(sc).some(v=>v>0))sc=muscleScore([p.name||'',p.movement||'']);
    for(const k in sc)tot[k]+=sc[k];
  }
  return tot;
}

function generateMetcon(){

  const pref=S.coach.genFmt||'auto',fmt=pref==='auto'?rnd(['FT','FT','AMRAP']):pref;
  const n=Math.min(pool.length,fmt==='FT'?rnd([2,2,3]):3);
  const sh=shuf(pool.slice()),mv=[];
  for(const x of sh)if(mv.length<n&&!mv.some(y=>y[1]===x[1]))mv.push(x);
  for(const x of sh)if(mv.length<n&&!mv.includes(x))mv.push(x);
  const nm=x=>(x[6]?x[6]+' ':'')+x[0];
  const repsFor=x=>{const v=x[3]+(x[4]-x[3])*(.2+Math.random()*.6);return x[4]>=20?Math.round(v/5)*5:Math.round(v);};
  const secSum=mv.reduce((a,x)=>a+x[5],0);
  const capIn=parseNum(String(S.coach.genCap||'')),capMin=(capIn!==null&&capIn>0)?Math.max(1,Math.round(capIn)):0;

    const mkLadder=sch=>{const sum=sch.reduce((a,b)=>a+b,0);return {content:sch.join('-')+'\n'+mv.map(nm).join('\n'),rr:'',R:sum*n,T:sum*secSum};};

      for(let j=0;j<10;j++){const t=Math.round(est*(1.3-.6*j/9)*2)/2;if(t>0&&!seen.has(t)){seen.add(t);out.push({t:String(t).replace('.',','),p:String(10-out.length)});}}
    }

    let capTiers=blankCapTiers();
    if(fmt==='FT')capTiers=[[.9,'1'],[.7,'0,5']].map(([m,p])=>({t:String(Math.max(1,Math.round(R*m))),p})); /* sous le dernier palier terminé (1 pt) */

  });

}

/* texte du coach -> reps cumulées. « 5+4 » ou « 5 tours + 4 reps » = tours + reps ; un nombre seul = reps */
function parseCap(m,s){
  const t=String(s).trim().toLowerCase(),pl=planOf(m);
  const m1=t.match(/^(\d+)\s*(?:t|tours?)?\s*\+\s*(\d+)\s*(?:reps?)?$/),m2=t.match(/^(\d+)\s*(?:t|tours?)$/);

  if(m1){r=+m1[1];rp=+m1[2];}else if(m2){r=+m2[1];}
  if(r!==null){

    if(pl.sizes&&r>=pl.sizes.length)return null;
    const sz=sizeAt(pl,r);
    if(sz>0&&rp>=sz)return null;
